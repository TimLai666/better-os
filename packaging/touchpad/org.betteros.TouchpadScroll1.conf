<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Better Touchpad scroll speed (ADR 0030). Only the service account may own
     a pass-through's name; anyone may send to those names and nothing else of
     this policy's, and the service itself refuses a change from anyone but
     the person at the machine. send_destination_prefix needs dbus-daemon 1.14;
     Ubuntu 22.04's package ships org.betteros.TouchpadScroll1.dbus-1.12.conf
     in this file's place. -->
<busconfig>
  <policy user="_better-touchpad-scroll">
    <allow own_prefix="org.betteros.TouchpadScroll1"/>
  </policy>
  <policy context="default">
    <allow send_destination_prefix="org.betteros.TouchpadScroll1"
           send_interface="org.betteros.TouchpadScroll1"/>
  </policy>
</busconfig>
