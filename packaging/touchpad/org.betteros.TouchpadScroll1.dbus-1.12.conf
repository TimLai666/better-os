<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Better Touchpad scroll speed (ADR 0030), for Ubuntu 22.04. Its
     dbus-daemon 1.12 has no send_destination_prefix (added in the 1.13
     development series, 1.14 stable), so sending is narrowed by interface
     only: the one interface no other service implements. Only the service
     account may own a pass-through's name, and the service itself refuses a
     change from anyone but the person at the machine. -->
<busconfig>
  <policy user="_better-touchpad-scroll">
    <allow own_prefix="org.betteros.TouchpadScroll1"/>
  </policy>
  <policy context="default">
    <allow send_interface="org.betteros.TouchpadScroll1"/>
  </policy>
</busconfig>
