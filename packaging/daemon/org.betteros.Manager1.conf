<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the name, so nothing else can impersonate the daemon.
       Sending to it is open on purpose: polkit is the authorization layer, and
       an unauthorized caller is refused there with a reason the client can
       show. Restricting sends here as well would only turn that into an opaque
       bus error. -->
  <policy user="root">
    <allow own="org.betteros.Manager1"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.betteros.Manager1"
           send_interface="org.betteros.Manager1"/>
    <allow send_destination="org.betteros.Manager1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.betteros.Manager1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.betteros.Manager1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
