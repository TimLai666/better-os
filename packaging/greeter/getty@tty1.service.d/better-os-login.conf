# Shipped with the Better OS login screen (design/login-screen-spec.md
# section 5.10, ticket 267). While it is the display manager
# (display-manager.service links to better-os-login-supervisor.service),
# no getty runs on tty1: the greeter is on VT 1, and a text login there
# before it starts would be one a person could sign in on and lose when the
# greeter's unit conflicts it out. GDM does the same with Conflicts=; the
# supervisor cannot (a conflict would let these units stop it), so the
# choice is read when the unit would start. With another display manager
# chosen, this changes nothing. The text logins of the fall back are on
# tty8 and tty9.
[Service]
ExecCondition=/bin/sh -c 'case "$$(/usr/bin/readlink /etc/systemd/system/display-manager.service)" in */better-os-login-supervisor.service) exit 1 ;; esac'
