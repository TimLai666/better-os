# Shipped with the Better OS login screen (design/login-screen-spec.md
# section 5.10, ticket 267). While it is the display manager
# (display-manager.service links to better-os-login-supervisor.service),
# the splash is the supervisor's to quit: deactivated before the greeter
# starts, quit with the splash kept when the greeter is ready, or quit for
# the text login. Without this, Ubuntu's plymouth-quit.service would quit
# it at multi-user.target, before the greeter has drawn anything. GDM does
# the same with Conflicts=; the supervisor cannot (the greeter's own
# OnFailure= starts this unit, and a conflict would stop the supervisor),
# so the choice is read when the unit would start. With another display
# manager chosen, this changes nothing.
[Service]
ExecCondition=/bin/sh -c 'case "$$(/usr/bin/readlink /etc/systemd/system/display-manager.service)" in */better-os-login-supervisor.service) exit 1 ;; esac'
