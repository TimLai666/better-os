# Shipped with the Better OS login screen (design/login-screen-spec.md
# section 5.10, ticket 267). While the Better OS login supervisor runs (it
# is the display manager), the splash is its to quit: deactivated before
# the greeter starts, quit with the splash kept when the greeter is ready,
# or quit for the text login. Without this, Ubuntu's plymouth-quit.service
# would quit it at multi-user.target, before the greeter has drawn
# anything. GDM does the same with Conflicts=; the supervisor cannot (the
# greeter's own OnFailure= starts this unit, and a conflict would stop the
# supervisor). If the supervisor fails for good, its backstops quit the
# splash.
# The test is the supervisor's own state in this boot, not the
# display-manager link: on a boot that never starts the display manager
# (multi-user.target, kernel parameter 3, the supervisor masked or its unit
# broken) the unit runs as it always does, and so does everything ordered
# after plymouth-quit-wait. Ordered after the supervisor, so that on a boot
# that starts it the state is read once its start job has finished; a
# `systemctl show` that does not answer in 5 s, or any state but running,
# leaves the stock behaviour.
[Unit]
After=better-os-login-supervisor.service

[Service]
ExecCondition=/bin/sh -c 'case "$$(/usr/bin/timeout 5 /usr/bin/systemctl show --property=ActiveState --value better-os-login-supervisor.service 2>/dev/null)" in active|activating|reloading) exit 1 ;; esac'
