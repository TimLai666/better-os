<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- The Better OS login supervisor (ticket 267): only root may own the
       name, and anyone may ask for its last record. It has one method,
       LastRecord, with no argument, and nothing that changes anything
       (engineering/specs/login-screen-security.md, "The supervisor"). -->
  <policy user="root">
    <allow own="org.betteros.LoginSupervisor1"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.betteros.LoginSupervisor1"
           send_interface="org.betteros.LoginSupervisor1"
           send_member="LastRecord"/>
    <allow send_destination="org.betteros.LoginSupervisor1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.betteros.LoginSupervisor1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
