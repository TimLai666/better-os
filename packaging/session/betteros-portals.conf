[preferred]
# COSMIC's portal first, GTK's for what COSMIC lacks.
default=cosmic;gtk;
# gnome-keyring.portal is UseIn=gnome; without this line no Secret portal is
# offered (ticket 201).
org.freedesktop.impl.portal.Secret=gnome-keyring;
# Better Screenshot serves the Screenshot portal (ticket 253); the frontend
# offers it with COSMIC's Access backend from default=.
org.freedesktop.impl.portal.Screenshot=betteros-screenshot;
