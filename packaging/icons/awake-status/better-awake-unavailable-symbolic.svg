<g mask="url(#m)"><path d="M1 8c1.6-3 4.1-4.5 7-4.5S13.4 5 15 8c-1.6 3-4.1 4.5-7 4.5S2.6 11 1 8z" fill="none" stroke="#bebebe" stroke-width="1.5" stroke-linejoin="round"/><circle cx="8" cy="8" r="2.2" fill="#bebebe"/></g><path d="M2 14L14 2" stroke="#bebebe" stroke-width="1.5" stroke-linecap="round"/>
</svg>
