name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  repair-chart-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Remove redundant closure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/monitor-gui/src/app.rs")
          source = path.read_text()
          old = ".map(|point| value_fn(point))"
          new = ".map(value_fn)"
          if new not in source:
              if old not in source:
                  raise SystemExit("chart summary map expression not found")
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          cargo fmt --all
      - name: Commit repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/monitor-gui/src/app.rs
          git commit -m "fix(monitor): simplify chart summary iterator"
          git push origin HEAD:feature/better-monitor-ui
