name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-device-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply device history and NetworkManager metadata patch
        run: |
          base64 -d .github/monitor-device-history.patch.gz.b64 | gzip -d > /tmp/monitor-device-history.patch
          git apply --check /tmp/monitor-device-history.patch
          git apply /tmp/monitor-device-history.patch
          cargo fmt --all
      - name: Commit device history parity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/monitor-gui/src/app.rs crates/monitor-gui/src/linux.rs crates/monitor-gui/src/parity.rs docs/better-monitor-resources-v1.10.2-parity.md
          git commit -m "feat(monitor): add per-device history and network names"
          git push origin HEAD:feature/better-monitor-ui

  rust:
    needs: apply-device-history
    runs-on: ubuntu-latest
    env:
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install GPUI Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo build --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  package:
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: ubuntu-22.04
            asset_target: ubuntu-22.04
            architecture: amd64
          - runner: ubuntu-24.04
            target: ubuntu-24.04
            asset_target: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-22.04-arm
            target: ubuntu-22.04-arm64
            asset_target: ubuntu-22.04
            architecture: arm64
          - runner: ubuntu-24.04-arm
            target: ubuntu-24.04-arm64
            asset_target: ubuntu-24.04
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify native runner architecture
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.architecture }}"
          case "${{ matrix.architecture }}" in
            amd64) test "$(uname -m)" = "x86_64" ;;
            arm64) test "$(uname -m)" = "aarch64" ;;
            *) exit 1 ;;
          esac
      - name: Install GPUI and packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Build Debian packages
        run: bash packaging/build-deb.sh --output-dir "dist/${{ matrix.target }}" --target "${{ matrix.asset_target }}"
      - name: Verify Debian packages
        run: bash packaging/verify-deb.sh "dist/${{ matrix.target }}" "${{ matrix.asset_target }}"
      - name: Run the privileged service end-to-end
        run: |
          UBUNTU_RELEASE="${{ matrix.asset_target }}"
          UBUNTU_RELEASE="${UBUNTU_RELEASE#ubuntu-}"
          cp -r "dist/${{ matrix.target }}" dist/e2e
          docker build -f packaging/e2e/Dockerfile \
            --build-arg "UBUNTU_RELEASE=${UBUNTU_RELEASE}" \
            -t "better-os-e2e:${{ matrix.target }}" .
          docker run --rm "better-os-e2e:${{ matrix.target }}"
          rm -rf dist/e2e
      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: better-os-deb-packages-${{ matrix.target }}
          path: |
            dist/${{ matrix.target }}/*.deb
            dist/${{ matrix.target }}/*.deb.sha256
