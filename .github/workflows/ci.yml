name: CI

on:
  push:
  pull_request:

jobs:
  remove-monitor-assets-import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-ui
          fetch-depth: 0
      - name: Remove the incorrect trait import
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/monitor-gui/src/app.rs")
          text = path.read_text()
          old = "use gpui_platform::ApplicationExt;\n"
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit("unexpected ApplicationExt import count")
              path.write_text(text.replace(old, "", 1))
          elif "gpui_platform::ApplicationExt" in text:
              raise SystemExit("unexpected ApplicationExt spelling")
          PY
      - name: Commit the one-line product fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/monitor-gui/src/app.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(monitor): use the GPUI asset extension trait"
          git pull --rebase origin feature/better-monitor-ui
          git push origin HEAD:feature/better-monitor-ui

  rust:
    runs-on: ubuntu-latest
    env:
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Validate packaging scripts
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find packaging -type f -name '*.sh' -print0)
          test "$(sed -n '1p' packaging/verify-deb.sh)" = '#!/usr/bin/env bash'
          test "$(sed -n '2p' packaging/verify-deb.sh)" = 'set -euo pipefail'
          test "$(wc -l < packaging/verify-deb.sh)" -gt 100
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install GPUI Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo build --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  package:
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: ubuntu-22.04
            asset_target: ubuntu-22.04
            architecture: amd64
          - runner: ubuntu-24.04
            target: ubuntu-24.04
            asset_target: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-22.04-arm
            target: ubuntu-22.04-arm64
            asset_target: ubuntu-22.04
            architecture: arm64
          - runner: ubuntu-24.04-arm
            target: ubuntu-24.04-arm64
            asset_target: ubuntu-24.04
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify native runner architecture
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.architecture }}"
          case "${{ matrix.architecture }}" in
            amd64) test "$(uname -m)" = "x86_64" ;;
            arm64) test "$(uname -m)" = "aarch64" ;;
            *) exit 1 ;;
          esac
      - name: Install GPUI and packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Build Debian packages
        run: bash packaging/build-deb.sh --output-dir "dist/${{ matrix.target }}" --target "${{ matrix.asset_target }}"
      - name: Verify Debian packages
        run: bash packaging/verify-deb.sh "dist/${{ matrix.target }}" "${{ matrix.asset_target }}"
      - name: Run the privileged service end-to-end
        run: |
          UBUNTU_RELEASE="${{ matrix.asset_target }}"
          UBUNTU_RELEASE="${UBUNTU_RELEASE#ubuntu-}"
          cp -r "dist/${{ matrix.target }}" dist/e2e
          cargo build --release -p manager-platform --features dbus-client --example e2e_client
          mkdir -p dist/e2e-client
          cp target/release/examples/e2e_client dist/e2e-client/
          docker build -f packaging/e2e/Dockerfile \
            --build-arg "UBUNTU_RELEASE=${UBUNTU_RELEASE}" \
            -t "better-os-e2e:${{ matrix.target }}" .
          docker run --rm "better-os-e2e:${{ matrix.target }}"
          rm -rf dist/e2e dist/e2e-client
      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: better-os-deb-packages-${{ matrix.target }}
          path: |
            dist/${{ matrix.target }}/*.deb
            dist/${{ matrix.target }}/*.deb.sha256
