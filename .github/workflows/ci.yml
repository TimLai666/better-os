name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-monitor-parity-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-ui
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply merge repair and parity batch
        run: |
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              if new in source:
                  return source
              if old not in source:
                  raise SystemExit(f"missing replacement anchor: {label}")
              return source.replace(old, new, 1)

          # Keep the complete current Manager dictionary while sharing Locale.
          manager_i18n = subprocess.check_output(
              ["git", "show", "origin/main:crates/manager-gui/src/i18n.rs"],
              text=True,
          )
          locale_prefix = '''#[derive(Clone, Copy, Debug, PartialEq, Eq)]
          pub(crate) enum Locale {
              System,
              EnUs,
              ZhTw,
          }

          impl Locale {
              pub(crate) fn resolved(self) -> Self {
                  match self {
                      Self::System => {
                          let language = std::env::var("LANG")
                              .unwrap_or_default()
                              .to_ascii_lowercase();
                          if language.contains("zh_tw")
                              || language.contains("zh-tw")
                              || language.contains("hant")
                          {
                              Self::ZhTw
                          } else {
                              Self::EnUs
                          }
                      }
                      locale => locale,
                  }
              }
          }

          '''
          if not manager_i18n.startswith(locale_prefix):
              raise SystemExit("main i18n Locale prefix changed")
          Path("crates/manager-gui/src/i18n.rs").write_text(
              "pub(crate) use better_ui::Locale;\n\n" + manager_i18n[len(locale_prefix):]
          )

          settings_path = Path("crates/monitor-gui/src/settings.rs")
          settings = settings_path.read_text()
          settings = replace_once(
              settings,
              "pub struct MonitorSettings {\n    pub locale: Locale,\n",
              "pub struct MonitorSettings {\n    pub locale: Locale,\n    pub last_page: String,\n",
              "settings last_page field",
          )
          settings = replace_once(
              settings,
              "            locale: Locale::System,\n            unit_base: UnitBase::Binary,",
              "            locale: Locale::System,\n            last_page: \"overview\".to_string(),\n            unit_base: UnitBase::Binary,",
              "settings last_page default",
          )
          settings = replace_once(
              settings,
              '            "locale" => self.locale = Locale::parse(value),\n',
              '            "locale" => self.locale = Locale::parse(value),\n            "last-page" if !value.is_empty() => self.last_page = value.to_string(),\n',
              "settings last_page parser",
          )
          settings = replace_once(
              settings,
              '        lines.push(format!("locale={}", self.locale.config_value()));\n',
              '        lines.push(format!("locale={}", self.locale.config_value()));\n        lines.push(format!("last-page={}", self.last_page));\n',
              "settings last_page writer",
          )
          if "fn last_page_is_serialized_and_loaded" not in settings:
              settings += '''

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn last_page_is_serialized_and_loaded() {
                  let mut settings = MonitorSettings::default();
                  settings.apply("last-page", "network");
                  assert_eq!(settings.last_page, "network");
                  assert!(settings.to_config().contains("last-page=network"));
              }
          }
          '''
          settings_path.write_text(settings)

          app_path = Path("crates/monitor-gui/src/app.rs")
          app = app_path.read_text()

          if "fn from_config(value: &str)" not in app:
              config_methods = '''    const fn config_value(self) -> &'static str {
                  match self {
                      Self::Overview => "overview",
                      Self::Apps => "apps",
                      Self::Processes => "processes",
                      Self::Cpu => "cpu",
                      Self::Memory => "memory",
                      Self::Gpu => "gpu",
                      Self::Npu => "npu",
                      Self::Storage => "storage",
                      Self::Network => "network",
                      Self::Battery => "battery",
                      Self::History => "history",
                      Self::Incidents => "incidents",
                      Self::Diagnostics => "diagnostics",
                      Self::Settings => "settings",
                  }
              }

              fn from_config(value: &str) -> Self {
                  match value {
                      "apps" => Self::Apps,
                      "processes" => Self::Processes,
                      "cpu" => Self::Cpu,
                      "memory" => Self::Memory,
                      "gpu" => Self::Gpu,
                      "npu" => Self::Npu,
                      "storage" => Self::Storage,
                      "network" => Self::Network,
                      "battery" => Self::Battery,
                      "history" => Self::History,
                      "incidents" => Self::Incidents,
                      "diagnostics" => Self::Diagnostics,
                      "settings" => Self::Settings,
                      _ => Self::Overview,
                  }
              }

          '''
              app = replace_once(
                  app,
                  "    fn label(self, locale: Locale) -> &'static str {",
                  config_methods + "    fn label(self, locale: Locale) -> &'static str {",
                  "MonitorPage config conversion",
              )

          app = replace_once(
              app,
              "        let settings = MonitorSettings::load();\n\n        let monitor_target",
              "        let settings = MonitorSettings::load();\n        let active_page = MonitorPage::from_config(&settings.last_page);\n\n        let monitor_target",
              "load active page",
          )
          app = replace_once(
              app,
              "            active_page: MonitorPage::Overview,",
              "            active_page,",
              "initialize active page",
          )

          if "fn set_active_page(&mut self" not in app:
              set_page_method = '''    fn set_active_page(&mut self, page: MonitorPage) {
                  self.active_page = page;
                  let value = page.config_value();
                  if self.settings.last_page != value {
                      self.settings.last_page = value.to_string();
                      let _ = self.settings.save();
                  }
              }

          '''
              app = replace_once(
                  app,
                  "    fn nav_button(&self, page: MonitorPage, cx: &mut Context<Self>) -> Button {",
                  set_page_method + "    fn nav_button(&self, page: MonitorPage, cx: &mut Context<Self>) -> Button {",
                  "set active page method",
              )

          for path in [app_path, Path("crates/monitor-gui/src/parity.rs")]:
              source = app if path == app_path else path.read_text()
              source = source.replace("this.active_page = page;", "this.set_active_page(page);")
              source = re.sub(
                  r"this\.active_page = (MonitorPage::[A-Za-z]+);",
                  r"this.set_active_page(\1);",
                  source,
              )
              if path == app_path:
                  app = source
              else:
                  path.write_text(source)

          chart_start = app.index("    fn chart_card(")
          section_start = app.index("    fn section_card(", chart_start)
          chart_block = app[chart_start:section_start]

          summary_line = "        let summary = chart_summary(&data, &value_fn, self.settings.locale);\n"
          if summary_line not in chart_block:
              body_start = chart_block.index("    ) -> Div {\n") + len("    ) -> Div {\n")
              chart_block = chart_block[:body_start] + summary_line + chart_block[body_start:]

          if ".child(summary)" not in chart_block:
              function_close = chart_block.rfind("\n    }\n\n")
              if function_close == -1:
                  raise SystemExit("chart_card function boundary not found")
              summary_element = '''
                  .child(
                      div()
                          .px_4()
                          .pb_3()
                          .text_xs()
                          .text_color(cx.theme().muted_foreground)
                          .child(summary),
                  )'''
              chart_block = (
                  chart_block[:function_close]
                  + summary_element
                  + chart_block[function_close:]
              )
          app = app[:chart_start] + chart_block + app[section_start:]

          if "fn chart_summary(" not in app:
              chart_helper = '''fn chart_summary(
                  data: &[MetricPoint],
                  value_fn: &impl Fn(&MetricPoint) -> f64,
                  locale: Locale,
              ) -> String {
                  let values = data
                      .iter()
                      .map(|point| value_fn(point))
                      .filter(|value| value.is_finite())
                      .collect::<Vec<_>>();
                  let Some(current) = values.last().copied() else {
                      return match locale.resolved() {
                          Locale::ZhTw => "文字摘要：目前沒有可用樣本。".to_string(),
                          _ => "Text summary: no samples are available yet.".to_string(),
                      };
                  };
                  let minimum = values.iter().copied().fold(f64::INFINITY, f64::min);
                  let maximum = values.iter().copied().fold(f64::NEG_INFINITY, f64::max);
                  let average = values.iter().sum::<f64>() / values.len() as f64;
                  match locale.resolved() {
                      Locale::ZhTw => format!(
                          "文字摘要：目前 {current:.1}，平均 {average:.1}，最低 {minimum:.1}，最高 {maximum:.1}，共 {} 個樣本。",
                          values.len()
                      ),
                      _ => format!(
                          "Text summary: current {current:.1}, average {average:.1}, minimum {minimum:.1}, maximum {maximum:.1}, across {} samples.",
                          values.len()
                      ),
                  }
              }

          '''
              app = replace_once(
                  app,
                  "fn uses_compact_navigation(width: Pixels) -> bool {",
                  chart_helper + "fn uses_compact_navigation(width: Pixels) -> bool {",
                  "chart summary helper",
              )

          test_module_start = app.index("#[cfg(test)]\nmod adaptive_navigation_tests")
          test_module_end = app.index("\n}\n\npub fn run()", test_module_start)
          new_tests = ""
          if "fn monitor_page_config_values_round_trip" not in app[test_module_start:test_module_end]:
              new_tests += '''

              #[test]
              fn monitor_page_config_values_round_trip() {
                  for page in MonitorPage::ALL {
                      assert_eq!(MonitorPage::from_config(page.config_value()), page);
                  }
                  assert_eq!(MonitorPage::from_config("unknown"), MonitorPage::Overview);
              }
          '''
          if "fn chart_summary_reports_current_average_and_range" not in app[test_module_start:test_module_end]:
              new_tests += '''

              #[test]
              fn chart_summary_reports_current_average_and_range() {
                  let data = vec![
                      MetricPoint {
                          time: "0s".to_string(),
                          cpu: 10.0,
                          memory: 0.0,
                          network_received: 0.0,
                          network_transmitted: 0.0,
                          disk_read: 0.0,
                          disk_written: 0.0,
                      },
                      MetricPoint {
                          time: "1s".to_string(),
                          cpu: 30.0,
                          memory: 0.0,
                          network_received: 0.0,
                          network_transmitted: 0.0,
                          disk_read: 0.0,
                          disk_written: 0.0,
                      },
                  ];
                  let summary = chart_summary(&data, &|point| point.cpu, Locale::EnUs);
                  assert!(summary.contains("current 30.0"));
                  assert!(summary.contains("average 20.0"));
                  assert!(summary.contains("minimum 10.0"));
                  assert!(summary.contains("maximum 30.0"));
              }
          '''
          if new_tests:
              app = app[:test_module_end] + new_tests + app[test_module_end:]

          app_path.write_text(app)

          parity_path = Path("docs/better-monitor-resources-v1.10.2-parity.md")
          parity = parity_path.read_text()
          parity = re.sub(
              r"^\| Accessible chart summary \|.*$",
              "| Accessible chart summary | ✅ | Every shared chart card presents current, average, minimum, maximum, and sample-count text alongside the visual graph. |",
              parity,
              flags=re.MULTILINE,
          )
          parity = re.sub(
              r"^\| Restore last selected page \|.*$",
              "| Restore last selected page | 🟨 | The selected page is persisted and restored. Per-device selection and window geometry remain missing. |",
              parity,
              flags=re.MULTILINE,
          )
          parity = re.sub(
              r"^\| Accessible chart summaries \|.*$",
              "| Accessible chart summaries | ✅ | Shared chart cards expose localized current, average, minimum, maximum, and sample-count summaries. |",
              parity,
              flags=re.MULTILINE,
          )
          parity_path.write_text(parity)
          PY
          cargo fmt --all
      - name: Commit parity batch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/manager-gui/src/i18n.rs crates/monitor-gui/src/app.rs crates/monitor-gui/src/parity.rs crates/monitor-gui/src/settings.rs docs/better-monitor-resources-v1.10.2-parity.md
          git commit -m "feat(monitor): persist page state and summarize charts"
          git pull --rebase origin feature/better-monitor-ui
          git push origin HEAD:feature/better-monitor-ui
