name: CI

on:
  push:
  pull_request:

jobs:
  diagnose-package:
    runs-on: ubuntu-24.04
    env:
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: package-diagnostic
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev jq libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Check generated notices
        run: bash packaging/generate-third-party-notices.sh --check
      - name: Reproduce package build with bounded output
        shell: bash
        run: |
          set +e
          bash packaging/build-deb.sh \
            --output-dir dist/ubuntu-24.04 \
            --target ubuntu-24.04 \
            > /tmp/package-build.log 2>&1
          status=$?
          printf '%s\n' '===== package build tail ====='
          tail -n 160 /tmp/package-build.log
          printf '===== exit status: %s =====\n' "$status"
          exit "$status"
