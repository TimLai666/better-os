name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Validate packaging scripts
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find packaging -type f -name '*.sh' -print0)
          test "$(sed -n '1p' packaging/verify-deb.sh)" = '#!/usr/bin/env bash'
          test "$(sed -n '2p' packaging/verify-deb.sh)" = 'set -euo pipefail'
          test "$(wc -l < packaging/verify-deb.sh)" -gt 100
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install GPUI Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked

  diagnose-package:
    needs: rust
    runs-on: ubuntu-24.04
    env:
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: package-diagnostic
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev jq libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Check generated notices
        run: bash packaging/generate-third-party-notices.sh --check
      - name: Reproduce package build with bounded output
        shell: bash
        run: |
          set +e
          bash packaging/build-deb.sh \
            --output-dir dist/ubuntu-24.04 \
            --target ubuntu-24.04 \
            > /tmp/package-build.log 2>&1
          status=$?
          printf '%s\n' '===== package build tail ====='
          tail -n 160 /tmp/package-build.log
          printf '===== exit status: %s =====\n' "$status"
          exit "$status"
