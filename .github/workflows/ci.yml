name: Apply Better Monitor interactions

on:
  push:
    branches:
      - feature/better-monitor-ui
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-monitor-interactions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Decode and apply interaction patch
        run: |
          cat .github/monitor-interactions/chunk-*.b64 \
            | tr -d '\n' \
            | base64 -d > /tmp/monitor-interactions.patch

          if git apply --check /tmp/monitor-interactions.patch; then
            git apply /tmp/monitor-interactions.patch
            cargo fmt --all
          elif git apply --reverse --check /tmp/monitor-interactions.patch; then
            echo "Interaction patch is already applied."
          else
            echo "Patch cannot be applied or reversed cleanly."
            exit 1
          fi
      - name: Commit interaction components
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/monitor-gui/src/parity.rs crates/monitor-gui/src/process_table.rs
          git commit -m "feat(monitor): add parity interaction components"
          git push origin HEAD:feature/better-monitor-ui
