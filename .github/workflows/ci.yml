name: CI

on:
  push:
  pull_request:

jobs:
  inspect-monitor-dmi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-ui
      - name: Inspect verifier migration
        run: |
          cat .github/monitor-dmi-migration/chunk-* | base64 -d | gzip -d > /tmp/apply_monitor_dmi.py
          test "$(sha256sum /tmp/apply_monitor_dmi.py | cut -d' ' -f1)" = "1395fce49e1976afad1cbadef3a0ae5f48702e5c787f630ca87e84ce3dd23552"
          python3 .github/patch_monitor_dmi_migration.py
          python3 -m py_compile /tmp/apply_monitor_dmi.py
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/apply_monitor_dmi.py').read_text()
          start = text.find('verify = Path("packaging/verify-deb.sh")')
          if start < 0:
              raise SystemExit('verify section not found')
          print(text[start:start + 5000])
          PY
