name: CI

on:
  push:
  pull_request:

jobs:
  apply-monitor-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/better-monitor-ui'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-ui
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Register assets and replace text markers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/monitor-gui/src/app.rs")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "    ActiveTheme, Disableable, Root, Selectable as _, Sizable, StyledExt,\n",
              "    ActiveTheme, Disableable, Icon, Root, Selectable as _, Sizable, StyledExt,\n",
          )
          replace_once(
              "use monitor_core::{Incident, MonitorStore, Sample};\n",
              "use gpui_platform::ApplicationExt;\nuse monitor_core::{Incident, MonitorStore, Sample};\n",
          )
          replace_once(
              '''    const fn marker(self) -> &'static str {
        match self {
            Self::Overview => "◫",
            Self::Apps => "▦",
            Self::Processes => "≡",
            Self::Cpu => "◇",
            Self::Memory => "▤",
            Self::Gpu => "▰",
            Self::Npu => "◇",
            Self::Storage => "▱",
            Self::Network => "⌁",
            Self::Battery => "▥",
            Self::History => "↗",
            Self::Incidents => "!",
            Self::Diagnostics => "⊙",
            Self::Settings => "⚙",
        }
    }
''',
              '''    const fn icon_path(self) -> &'static str {
        match self {
            Self::Overview => "icons/gauge.svg",
            Self::Apps => "icons/layout-grid.svg",
            Self::Processes => "icons/search.svg",
            Self::Cpu | Self::Gpu | Self::Npu => "icons/cpu.svg",
            Self::Memory => "icons/memory-stick.svg",
            Self::Storage => "icons/hard-drive.svg",
            Self::Network => "icons/network.svg",
            Self::Battery => "icons/battery.svg",
            Self::History | Self::Diagnostics => "icons/gauge.svg",
            Self::Incidents => "icons/triangle-alert.svg",
            Self::Settings => "icons/settings.svg",
        }
    }
''',
          )
          replace_once(
              '''        Button::new(page.id())
            .ghost()
            .small()
            .w_full()
            .label(format!(
                "{}   {}",
                page.marker(),
                page.label(self.settings.locale)
            ))
''',
              '''        Button::new(page.id())
            .ghost()
            .small()
            .w_full()
            .icon(Icon::default().path(page.icon_path()))
            .label(page.label(self.settings.locale))
''',
          )
          replace_once(
              '''        Button::new(format!("compact-{}", page.id()))
            .ghost()
            .small()
            .flex_shrink_0()
            .label(format!(
                "{}  {}",
                page.marker(),
                page.label(self.settings.locale)
            ))
''',
              '''        Button::new(format!("compact-{}", page.id()))
            .ghost()
            .small()
            .flex_shrink_0()
            .icon(Icon::default().path(page.icon_path()))
            .label(page.label(self.settings.locale))
''',
          )
          replace_once(
              "    let app = gpui_platform::application();\n",
              "    let app = gpui_platform::application().with_assets(gpui_component_assets::Assets);\n",
          )

          path.write_text(text)
          PY
          cargo fmt --all
      - name: Commit product files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/monitor-gui/src/app.rs crates/monitor-gui/Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(monitor): register embedded navigation icons"
          git pull --rebase origin feature/better-monitor-ui
          git push origin HEAD:feature/better-monitor-ui

  rust:
    runs-on: ubuntu-latest
    env:
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Validate packaging scripts
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find packaging -type f -name '*.sh' -print0)
          test "$(sed -n '1p' packaging/verify-deb.sh)" = '#!/usr/bin/env bash'
          test "$(sed -n '2p' packaging/verify-deb.sh)" = 'set -euo pipefail'
          test "$(wc -l < packaging/verify-deb.sh)" -gt 100
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install GPUI Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo build --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  package:
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: ubuntu-22.04
            asset_target: ubuntu-22.04
            architecture: amd64
          - runner: ubuntu-24.04
            target: ubuntu-24.04
            asset_target: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-22.04-arm
            target: ubuntu-22.04-arm64
            asset_target: ubuntu-22.04
            architecture: arm64
          - runner: ubuntu-24.04-arm
            target: ubuntu-24.04-arm64
            asset_target: ubuntu-24.04
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify native runner architecture
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.architecture }}"
          case "${{ matrix.architecture }}" in
            amd64) test "$(uname -m)" = "x86_64" ;;
            arm64) test "$(uname -m)" = "aarch64" ;;
            *) exit 1 ;;
          esac
      # Keep release target artifacts isolated by Ubuntu release. Proc-macro
      # shared objects are linked against the runner's glibc.
      - name: Install GPUI and packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Build Debian packages
        run: bash packaging/build-deb.sh --output-dir "dist/${{ matrix.target }}" --target "${{ matrix.asset_target }}"
      - name: Verify Debian packages
        run: bash packaging/verify-deb.sh "dist/${{ matrix.target }}" "${{ matrix.asset_target }}"
      # The privileged service is the only thing here that changes a machine, so
      # it is exercised against a real dpkg, system bus, and polkitd rather than
      # only against fakes. It runs in a throwaway container for the same reason
      # the local script refuses to run on a host.
      - name: Run the privileged service end-to-end
        run: |
          # ubuntu-24.04 -> 24.04 for the base image; the script still wants the
          # full asset target to find the packages.
          UBUNTU_RELEASE="${{ matrix.asset_target }}"
          UBUNTU_RELEASE="${UBUNTU_RELEASE#ubuntu-}"
          cp -r "dist/${{ matrix.target }}" dist/e2e
          # The client that drives the authorized path. It is an example rather
          # than a package binary, so it is built here and copied in separately.
          cargo build --release -p manager-platform --features dbus-client --example e2e_client
          mkdir -p dist/e2e-client
          cp target/release/examples/e2e_client dist/e2e-client/
          docker build -f packaging/e2e/Dockerfile \
            --build-arg "UBUNTU_RELEASE=${UBUNTU_RELEASE}" \
            -t "better-os-e2e:${{ matrix.target }}" .
          docker run --rm "better-os-e2e:${{ matrix.target }}"
          rm -rf dist/e2e dist/e2e-client
      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: better-os-deb-packages-${{ matrix.target }}
          path: |
            dist/${{ matrix.target }}/*.deb
            dist/${{ matrix.target }}/*.deb.sha256
