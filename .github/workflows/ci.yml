name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup-stale-monitor-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Remove unused helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          control = Path("crates/monitor-gui/src/process_control.rs")
          source = control.read_text()
          source = source.replace('''
    pub const fn next(self) -> Self {
        match self {
            Self::VeryHigh => Self::High,
            Self::High => Self::Normal,
            Self::Normal => Self::Low,
            Self::Low => Self::VeryLow,
            Self::VeryLow => Self::VeryHigh,
        }
    }
''', '\n')
          control.write_text(source)

          table = Path("crates/monitor-gui/src/process_table.rs")
          source = table.read_text()
          source = source.replace('''
    pub fn selected_count(&self) -> usize {
        self.selected_pids.len()
    }
''', '\n')
          table.write_text(source)
          PY
          cargo fmt --all
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/monitor-gui/src/process_control.rs crates/monitor-gui/src/process_table.rs
          git commit -m "fix(monitor): remove stale parity helpers"
          git push origin HEAD:feature/better-monitor-ui || {
            git pull --rebase origin feature/better-monitor-ui
            git push origin HEAD:feature/better-monitor-ui
          }

  rust:
    runs-on: ubuntu-latest
    env:
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install GPUI Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo build --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  package:
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: ubuntu-22.04
            asset_target: ubuntu-22.04
            architecture: amd64
          - runner: ubuntu-24.04
            target: ubuntu-24.04
            asset_target: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-22.04-arm
            target: ubuntu-22.04-arm64
            asset_target: ubuntu-22.04
            architecture: arm64
          - runner: ubuntu-24.04-arm
            target: ubuntu-24.04-arm64
            asset_target: ubuntu-24.04
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify native runner architecture
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.architecture }}"
          case "${{ matrix.architecture }}" in
            amd64) test "$(uname -m)" = "x86_64" ;;
            arm64) test "$(uname -m)" = "aarch64" ;;
            *) exit 1 ;;
          esac
      # Keep release target artifacts isolated by Ubuntu release. Proc-macro
      # shared objects are linked against the runner's glibc.
      - name: Install GPUI and packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Build Debian packages
        run: bash packaging/build-deb.sh --output-dir "dist/${{ matrix.target }}" --target "${{ matrix.asset_target }}"
      - name: Verify Debian packages
        run: bash packaging/verify-deb.sh "dist/${{ matrix.target }}" "${{ matrix.asset_target }}"
      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: better-os-deb-packages-${{ matrix.target }}
          path: |
            dist/${{ matrix.target }}/*.deb
            dist/${{ matrix.target }}/*.deb.sha256
