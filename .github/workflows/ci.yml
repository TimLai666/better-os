name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    env:
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The inventory pins the Cargo.lock hash, so any lockfile change makes it
      # stale. It needs only `cargo metadata --locked`, so it runs before the
      # build dependencies and fails in seconds rather than in the package jobs
      # an hour later — which is how three merges landed with a stale file.
      - name: Third-party license inventory is current
        run: bash packaging/generate-third-party-notices.sh --check
      - name: Install GPUI Linux dependencies
        # The runners have lost name resolution for the Ubuntu mirrors for minutes
        # at a time, which failed this step and so the whole run. `apt-get update`
        # exits 0 with stale lists in that state, so the retry is around both.
        #
        # What the tests run, beside the build dependencies. Each test that
        # needs one goes through `test_prerequisites`, so under CI a missing
        # one fails the test rather than skipping it (ticket 177):
        # - dbus (`dbus-daemon`): every private-bus test, in awake-service,
        #   awake-tray, files-gui, git-gui, hardware-platform, launcher-platform,
        #   manager-daemon, manager-gui, monitor-service, monitor-tray,
        #   screenshot-gui, storage-service, touchpad-gesture-service,
        #   touchpad-platform, and window-attention-service.
        # - gstreamer1.0-plugins-base and -good (`appsrc`, `vp8enc`):
        #   screenshot-capture's recorder tests.
        # - dconf-service: the private dconf tests
        #   (`defaults_platform::test_support`): defaults-core's
        #   `gnome_writes` and touchpad-platform's `session_profile`.
        # - gjs: the two shell extensions parsed by the interpreter GNOME
        #   Shell uses (`window-attention-service/tests/extension.rs`,
        #   `touchpad-session/tests/extension.rs`). They need nothing else:
        #   `gjs -m` stops at the first `resource:///org/gnome/shell` import,
        #   which no machine outside a shell has, so no shell typelib is read.
        # - locales and language-pack-gnome-zh-hant-base: files-gui's GVfs
        #   zh_TW host-key test, with the locale generated below.
        # - gvfs-backends (with gvfs-daemons): files-gui's
        #   `the_installed_gvfs_is_found_when_there_is_one`.
        # - poppler-utils (`pdftoppm`): files-preview's
        #   `poppler_renders_and_searches_a_real_pdf_when_installed`.
        # - dpkg (`dpkg-query`): better-core's self_update journal test; the
        #   image ships it.
        # - libgdk-pixbuf2.0-bin (`gdk-pixbuf-thumbnailer`) with
        #   librsvg2-common (the SVG loader): monitor-tray's
        #   `picture` tests draw the taskbar picture with librsvg, as GNOME
        #   Shell does (ticket 295).
        # The ubuntu-24.04 image already ships dbus and locales (and dpkg), so
        # taking those off this line would not turn CI red; the line names
        # them so the dependency is written down. The runner itself gives the
        # rest: a user other than root (files-gui, files-operations,
        # files-platform, monitor-collectors-linux), a temporary directory
        # with sparse files and user extended attributes (files-operations),
        # and an RLIMIT_MEMLOCK of at least 1 MiB (login-screen-core's
        # `the_pages_are_locked_where_the_memory_lock_limit_allows_it`; the
        # next step prints the runner's limit).
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good dbus dconf-service gjs locales language-pack-gnome-zh-hant-base gvfs-backends poppler-utils libgdk-pixbuf2.0-bin librsvg2-common; then
              exit 0
            fi
            echo "apt attempt $attempt failed; waiting before the next" >&2
            sleep 60
          done
          exit 1
      # Better Files recognises GVfs's zh_TW words for a changed SSH host key
      # (ticket 117); the test reads GVfs's own catalog in that locale.
      - name: Generate the zh_TW.UTF-8 locale
        run: sudo locale-gen zh_TW.UTF-8
      # login-screen-core's mlock test needs 1 MiB of lockable memory; the
      # line says what the runner gives, in KiB, so a failure there is read
      # from the log rather than guessed.
      - name: Show the memory lock limit
        run: ulimit -l
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo build --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # A test that cannot run here prints `better-os-test-skipped:` and
      # passes, and under CI fails instead (`test_prerequisites`, ticket 177).
      # The output of a passing test is captured and never reaches this log,
      # so the tests run with `--show-output`, which prints it after each test
      # binary, and the run fails when a skip line is in it: a skip that got
      # past a misread `CI` variable, or one written the old way.
      - name: Tests, and none of them skipped
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/test-output.log"
          cargo test --workspace -- --show-output 2>&1 | tee "$log"
          if grep -nE 'better-os-test-skipped:|^(skipping|skipped):' "$log"; then
            echo "A test skipped on CI. Install what it needs in the install step above." >&2
            exit 1
          fi

  # The workspace declares the oldest Rust it builds with, and stable CI would
  # never notice that declaration going stale: it did, from 1.85 to a lockfile
  # that needed 1.95. This job reads `rust-version` from Cargo.toml and checks
  # every target with exactly that toolchain, so a dependency bump that needs a
  # newer compiler fails here rather than on a contributor's machine.
  msrv:
    runs-on: ubuntu-24.04
    env:
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Read the declared Rust version
        id: declared
        run: |
          set -eu
          version="$(awk '
            $0 == "[workspace.package]" { in_section = 1; next }
            /^\[/ { in_section = 0 }
            in_section && $1 == "rust-version" { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)"
          test -n "$version" || { echo "no rust-version in [workspace.package]" >&2; exit 1; }
          echo "rust-version is $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.declared.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Install GPUI Linux dependencies
        # The runners have lost name resolution for the Ubuntu mirrors for minutes
        # at a time, which failed this step and so the whole run. `apt-get update`
        # exits 0 with stale lists in that state, so the retry is around both.
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good; then
              exit 0
            fi
            echo "apt attempt $attempt failed; waiting before the next" >&2
            sleep 60
          done
          exit 1
      - name: The declared Rust version builds the workspace
        run: |
          rustc --version
          cargo check --workspace --all-targets --locked

  # The bootstrap installer is a shell script with no build step, so its own
  # checks do not wait for the Rust job. This covers the half of it that needs
  # nothing built: the linter, and the release resolution against the real
  # public API. The half that changes a machine runs in the container e2e
  # below, against the packages that job just built.
  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint the installer
        run: |
          bash -n install.sh
          shellcheck install.sh
      # Detection is a table, and the entry that matters most is the one this
      # runner cannot be: Zorin OS reports its own version number and names its
      # Ubuntu base only in UBUNTU_CODENAME. These fixtures are how that row is
      # checked at all.
      - name: Release detection maps derivatives to their Ubuntu base
        run: |
          set -eu
          fixtures="$(mktemp -d)"
          printf 'PRETTY_NAME="Zorin OS 18.1"\nID=zorin\nVERSION_ID="18"\nUBUNTU_CODENAME=noble\nVERSION_CODENAME=noble\n' > "$fixtures/zorin18"
          printf 'PRETTY_NAME="Zorin OS 17.2"\nID=zorin\nVERSION_ID="17"\nUBUNTU_CODENAME=jammy\nVERSION_CODENAME=jammy\n' > "$fixtures/zorin17"
          printf 'PRETTY_NAME="Ubuntu 22.04 LTS"\nID=ubuntu\nVERSION_ID="22.04"\n' > "$fixtures/ubuntu2204"
          printf 'PRETTY_NAME="Ubuntu 20.04 LTS"\nID=ubuntu\nVERSION_ID="20.04"\nUBUNTU_CODENAME=focal\n' > "$fixtures/ubuntu2004"
          printf 'PRETTY_NAME="Fedora Linux 41"\nID=fedora\nVERSION_ID="41"\n' > "$fixtures/fedora"
          expect_release() {
            actual="$(BETTER_OS_INSTALL_OS_RELEASE="$fixtures/$1" bash install.sh --dry-run \
              | sed -n 's/.*installing the Ubuntu \([0-9.]*\) packages.*/\1/p')"
            test "$actual" = "$2" || { echo "$1: expected $2, got '${actual:-nothing}'" >&2; exit 1; }
            echo "$1 -> ubuntu-$2"
          }
          expect_refused() {
            if BETTER_OS_INSTALL_OS_RELEASE="$fixtures/$1" bash install.sh --dry-run >/dev/null 2>&1; then
              echo "$1: expected the installer to refuse this system" >&2
              exit 1
            fi
            echo "$1 -> refused"
          }
          expect_release zorin18 24.04
          expect_release zorin17 22.04
          expect_release ubuntu2204 22.04
          expect_refused ubuntu2004
          expect_refused fedora
          # Which file: /etc/os-release, and /usr/lib/os-release only when
          # the first does not exist, as better_core::host reads them.
          mkdir -p "$fixtures/vendor-only/usr/lib" "$fixtures/both/etc" "$fixtures/both/usr/lib"
          cp "$fixtures/zorin17" "$fixtures/vendor-only/usr/lib/os-release"
          cp "$fixtures/zorin18" "$fixtures/both/etc/os-release"
          cp "$fixtures/zorin17" "$fixtures/both/usr/lib/os-release"
          expect_release_under() {
            actual="$(BETTER_OS_INSTALL_ROOT="$fixtures/$1" bash install.sh --dry-run \
              | sed -n 's/.*installing the Ubuntu \([0-9.]*\) packages.*/\1/p')"
            test "$actual" = "$2" || { echo "$1: expected $2, got '${actual:-nothing}'" >&2; exit 1; }
            echo "$1 -> ubuntu-$2"
          }
          expect_release_under vendor-only 22.04
          expect_release_under both 24.04
        env:
          # Raises the anonymous API rate limit that every job on this runner
          # network shares. The installer never requires a token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The jq-free parser is not a fallback nobody takes: a minimal Ubuntu has
      # no jq, which is the machine this script is written for.
      - name: Resolve the latest release without jq
        run: |
          set -eu
          shim="$(mktemp -d)"
          for tool in bash env curl sed awk grep head sha256sum dpkg dpkg-query apt-get mktemp cp rm sudo; do
            path="$(command -v "$tool" || true)"
            if [ -n "$path" ]; then ln -s "$path" "$shim/$tool"; fi
          done
          test ! -e "$shim/jq"
          PATH="$shim" bash install.sh --dry-run | tee /tmp/nojq.log
          grep -q 'releases/download/' /tmp/nojq.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The build-tree cleanup script needs nothing built either: its test makes
      # synthetic target directories, so this step runs without cargo.
      - name: Lint and test the target prune script
        run: |
          bash -n packaging/prune-target.sh
          bash -n packaging/tests/prune-target.test.sh
          shellcheck packaging/prune-target.sh packaging/tests/prune-target.test.sh
          bash packaging/tests/prune-target.test.sh
      # Ticket 105: the user-unit half of every package's preinst and postinst,
      # against a fake systemctl. It needs nothing built either.
      - name: Lint and test the maintainer script library
        run: |
          sh -n packaging/maintainer/user-units.sh packaging/maintainer/daemon.sh packaging/maintainer/touchpad-scroll.sh
          bash -n packaging/tests/maintainer-scripts.test.sh
          shellcheck --shell=sh packaging/maintainer/user-units.sh packaging/maintainer/daemon.sh packaging/maintainer/touchpad-scroll.sh
          shellcheck packaging/tests/maintainer-scripts.test.sh packaging/touchpad/generate-bus-policy-1.12.sh
          bash packaging/tests/maintainer-scripts.test.sh
          sh -n packaging/maintainer/autostart-overrides.sh
          shellcheck --shell=sh packaging/maintainer/autostart-overrides.sh
          shellcheck packaging/tests/autostart-overrides.test.sh
          bash packaging/tests/autostart-overrides.test.sh
          sh -n packaging/maintainer/accounts.sh packaging/maintainer/account-step.sh packaging/maintainer/before-removal-accounts.sh
          shellcheck --shell=sh packaging/maintainer/accounts.sh packaging/maintainer/account-step.sh packaging/maintainer/before-removal-accounts.sh
          shellcheck packaging/tests/before-removal-accounts.test.sh
          bash packaging/tests/before-removal-accounts.test.sh
          shellcheck packaging/tests/account-scripts.test.sh
          bash packaging/tests/account-scripts.test.sh
          sh -n packaging/maintainer/files-activation.sh
          shellcheck --shell=sh packaging/maintainer/files-activation.sh
          shellcheck packaging/tests/files-activation.test.sh
          bash packaging/tests/files-activation.test.sh
          bash -n packaging/boot-watch/run.sh packaging/boot-watch/check.sh
          shellcheck packaging/boot-watch/run.sh packaging/boot-watch/check.sh
          bash -n packaging/hardware-unit/run.sh packaging/hardware-unit/check.sh
          shellcheck packaging/hardware-unit/run.sh packaging/hardware-unit/check.sh
          sh -n packaging/maintainer/greeter-watch.sh
          shellcheck --shell=sh packaging/maintainer/greeter-watch.sh
          shellcheck packaging/tests/greeter-watch.test.sh
          bash packaging/tests/greeter-watch.test.sh
      # ADR 0028: the handoff a privileged service of 0.2.12 or older is
      # updated through, against fake dpkg, systemd, and apt.
      - name: Lint and test the privileged service handoff
        run: |
          sh -n packaging/maintainer/daemon-handoff.sh
          bash -n packaging/tests/daemon-handoff.test.sh
          shellcheck --shell=sh packaging/maintainer/daemon-handoff.sh
          shellcheck packaging/tests/daemon-handoff.test.sh
          bash packaging/tests/daemon-handoff.test.sh

  package:
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: ubuntu-22.04
            asset_target: ubuntu-22.04
            architecture: amd64
          - runner: ubuntu-24.04
            target: ubuntu-24.04
            asset_target: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-22.04-arm
            target: ubuntu-22.04-arm64
            asset_target: ubuntu-22.04
            architecture: arm64
          - runner: ubuntu-24.04-arm
            target: ubuntu-24.04-arm64
            asset_target: ubuntu-24.04
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify native runner architecture
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.architecture }}"
          case "${{ matrix.architecture }}" in
            amd64) test "$(uname -m)" = "x86_64" ;;
            arm64) test "$(uname -m)" = "aarch64" ;;
            *) exit 1 ;;
          esac
      # Keep release target artifacts isolated by Ubuntu release. Proc-macro
      # shared objects are linked against the runner's glibc.
      - name: Install GPUI and packaging dependencies
        # The runners have lost name resolution for the Ubuntu mirrors for minutes
        # at a time, which failed this step and so the whole run. `apt-get update`
        # exits 0 with stale lists in that state, so the retry is around both.
        #
        # The 22.04 runner images carry libunwind-14-dev (from LLVM 14), which
        # conflicts with the libunwind-dev that libgstreamer1.0-dev depends on;
        # apt then refuses the install as "held broken packages".
        run: |
          if dpkg -s libunwind-14-dev >/dev/null 2>&1; then
            sudo apt-get remove -y libunwind-14-dev
          fi
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update && sudo apt-get install -y dpkg-dev libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good; then
              exit 0
            fi
            echo "apt attempt $attempt failed; waiting before the next" >&2
            sleep 60
          done
          exit 1
      - name: Build Debian packages
        run: bash packaging/build-deb.sh --output-dir "dist/${{ matrix.target }}" --target "${{ matrix.asset_target }}"
      # The matrix is per release and architecture; this is the per-component
      # half of it. build-deb.sh and verify-deb.sh each know their own package
      # list, so a component dropped from both would still pass them — this step
      # is what makes the release surface a checked list rather than a habit.
      - name: Confirm every component produced a target-specific package
        run: |
          set -eu
          version="$(awk '
            $0 == "[workspace.package]" { in_section = 1; next }
            /^\[/ { in_section = 0 }
            in_section && $1 == "version" { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)"
          for package in \
            better-manager \
            better-manager-daemon \
            better-monitor \
            better-launcher \
            better-files \
            better-git \
            better-touchpad \
            better-awake \
            better-storage \
            better-shell-adapter; do
            asset="dist/${{ matrix.target }}/${package}_${version}_${{ matrix.asset_target }}_${{ matrix.architecture }}.deb"
            test -s "$asset" || { echo "Missing package asset: $asset" >&2; exit 1; }
            test -s "$asset.sha256" || { echo "Missing checksum sidecar: $asset.sha256" >&2; exit 1; }
          done
      - name: Verify Debian packages
        run: bash packaging/verify-deb.sh "dist/${{ matrix.target }}" "${{ matrix.asset_target }}"
      # The installer's package selection and checksum verification against the
      # real filenames this job just produced, with no network and nothing
      # installed. It is the cheap half; the container below runs the apt call.
      - name: The installer selects and verifies this job's packages
        run: bash install.sh --from-dir "dist/${{ matrix.target }}" --dry-run
      # The privileged service is the only thing here that changes a machine, so
      # it is exercised against a real dpkg, system bus, and polkitd rather than
      # only against fakes. It runs in a throwaway container for the same reason
      # the local script refuses to run on a host. The same container carries
      # the apt install/remove smoke for better-launcher and better-storage
      # (the latter also started against a real udisksd and session bus),
      # and the bootstrap installer's real install, re-run, and uninstall.
      - name: Run the privileged service end-to-end
        run: |
          # ubuntu-24.04 -> 24.04 for the base image; the script still wants the
          # full asset target to find the packages.
          UBUNTU_RELEASE="${{ matrix.asset_target }}"
          UBUNTU_RELEASE="${UBUNTU_RELEASE#ubuntu-}"
          cp -r "dist/${{ matrix.target }}" dist/e2e
          # The client that drives the authorized path. It is an example rather
          # than a package binary, so it is built here and copied in separately.
          cargo build --release -p manager-platform --features dbus-client --example e2e_client
          mkdir -p dist/e2e-client
          cp target/release/examples/e2e_client dist/e2e-client/
          # The stand-in UDisks2 the drive-mounting check resolves against
          # (ticket 127): the container has no block device to offer.
          cargo build --release -p manager-daemon --features test-support --example e2e_udisks
          cp target/release/examples/e2e_udisks dist/e2e-client/
          # The published 0.2.9 privileged service the handoff check upgrades
          # from (ADR 0028). Downloaded here, where there is network.
          mkdir -p dist/e2e-legacy
          gh release download v0.2.9 --repo "${{ github.repository }}" \
            --pattern "better-manager-daemon_0.2.9_${{ matrix.asset_target }}_${{ matrix.architecture }}.deb" \
            --dir dist/e2e-legacy
          docker build -f packaging/e2e/Dockerfile \
            --build-arg "UBUNTU_RELEASE=${UBUNTU_RELEASE}" \
            -t "better-os-e2e:${{ matrix.target }}" .
          docker run --rm "better-os-e2e:${{ matrix.target }}"
          rm -rf dist/e2e dist/e2e-client dist/e2e-legacy
        env:
          GH_TOKEN: ${{ github.token }}
      # Ticket 140 (ADR 0033): the login screen watch against a real systemd,
      # logind, and journal, with a stand-in gdm.service that starts and never
      # opens a session. It runs in a throwaway container because it restarts
      # a unit named gdm.service.
      - name: The login screen watch restarts a GDM that shows nothing, once
        run: |
          bash packaging/boot-watch/run.sh target/release/better-manager-daemon
      # ADR 0029 and ADR 0034: the hardware helpers' transient units against
      # a real systemd as PID 1, with the property list read from the release
      # daemon itself (`--helper-properties`). The attribute helper writes
      # its one stand-in file and nothing else, the restore unit and the
      # removal path work, and the LampArray helper's unit starts and fails
      # cleanly on a node that is absent or not hidraw (the container has no
      # hidraw device). It runs in a throwaway container because it covers
      # parts of /sys with stand-ins.
      - name: The hardware helpers run in their sandbox on a real systemd
        run: |
          bash packaging/hardware-unit/run.sh target/release/better-manager-daemon
      - name: Upload Debian packages
        uses: actions/upload-artifact@v7
        with:
          name: better-os-deb-packages-${{ matrix.target }}
          path: |
            dist/${{ matrix.target }}/*.deb
            dist/${{ matrix.target }}/*.deb.sha256
