name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-monitor-dmi:
    runs-on: ubuntu-latest
    env:
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-ui
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install validation dependencies
        run: sudo apt-get update && sudo apt-get install -y jq libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Apply idempotent DMI source fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/manager-daemon/src/dmi.rs")
          text = path.read_text()
          text = text.replace("use std::sync::Arc;\n", "")
          conditional_arc = '#[cfg(any(test, feature = "test-support"))]\nuse std::sync::Arc;\n'
          if conditional_arc not in text:
              text = text.replace("use std::fs;\n", f"use std::fs;\n\n{conditional_arc}", 1)
          text = text.replace(
              "report.validate().map_err(Into::into)?;",
              "report.validate().map_err(DaemonError::from)?;",
          )
          text = text.replace(
              "detail_labels(device.type_detail),",
              "detail_labels(device.type_detail.clone()),",
          )
          path.write_text(text)

          path = Path("crates/monitor-gui/src/app.rs")
          text = path.read_text()
          for value in (
              "used",
              "total",
              "available",
              "swap_used",
              "swap_total",
              "total_memory",
              "size",
          ):
              text = text.replace(
                  f"self.format_bytes({value})",
                  f"linux::format_bytes({value}, self.settings.unit_base)",
              )
          path.write_text(text)
          PY
      - name: Format DMI implementation
        run: cargo fmt --all
      - name: Check monitor IPC
        run: cargo check -p monitor-ipc
      - name: Check privileged DMI service
        run: cargo check -p manager-daemon --all-targets --all-features
      - name: Check Monitor GUI
        run: cargo check -p monitor-gui --all-targets
      - name: Regenerate third-party notices
        run: bash packaging/generate-third-party-notices.sh
      - name: Confirm final formatting
        run: cargo fmt --all -- --check
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock ENG.md delivery-status.md crates packaging docs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(monitor): keep DMI validation reproducible"
          git pull --rebase origin feature/better-monitor-ui
          git push origin HEAD:feature/better-monitor-ui

  rust:
    needs: apply-monitor-dmi
    runs-on: ubuntu-latest
    env:
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install GPUI Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo build --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
