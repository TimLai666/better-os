name: Monitor I18n Apply

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/better-monitor-i18n'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-i18n
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply Apps localization patch
        run: |
          python3 .github/scripts/apply_monitor_app_i18n.py
          cargo fmt --all
      - name: Commit localized surfaces
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/monitor-gui/src/app.rs crates/monitor-gui/src/app_table.rs crates/monitor-gui/src/parity.rs docs/better-monitor-resources-v1.10.2-parity.md
          git commit -m "feat(monitor): localize Apps table and actions"
          git push origin HEAD:feature/better-monitor-i18n
