name: Monitor I18n Apply

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/better-monitor-i18n'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-i18n
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Make locale listener patch whitespace-independent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_monitor_app_i18n.py')
          source = path.read_text()
          start = source.index("old_listener = '''")
          end = source.index("parity_path.write_text(parity)", start)
          replacement = '''listener_pattern = re.compile(
              r"\\.on_click\\(cx\\.listener\\(\\|this,\\s*_,\\s*_,\\s*cx\\|\\s*\\{"
              r"\\s*this\\.settings\\.locale\\s*=\\s*this\\.settings\\.locale\\.next\\(\\);"
              r"\\s*this\\.persist_settings\\(\\);"
              r"\\s*cx\\.notify\\(\\);"
              r"\\s*\\}\\)\\),"
          )
          new_listener = '''                                    .on_click(cx.listener(|this, _, window, cx| {
                                        this.settings.locale = this.settings.locale.next();
                                        let placeholder = text(
                                            this.settings.locale,
                                            CopyKey::SearchPlaceholder,
                                        );
                                        this.search_input.update(cx, |input, cx| {
                                            input.set_placeholder(placeholder, window, cx);
                                        });
                                        this.sync_table_settings(cx);
                                    })),'''
          parity, replacements = listener_pattern.subn(new_listener, parity, count=1)
          if replacements != 1 and "input.set_placeholder" not in parity:
              raise SystemExit("runtime locale listener not found")
          parity_path.write_text(parity)'''
          source = source[:start] + replacement + source[end + len("parity_path.write_text(parity)"):]
          path.write_text(source)
          PY
      - name: Apply Apps localization patch
        run: |
          python3 .github/scripts/apply_monitor_app_i18n.py
          cargo fmt --all
      - name: Commit localized surfaces
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/monitor-gui/src/app.rs crates/monitor-gui/src/app_table.rs crates/monitor-gui/src/parity.rs docs/better-monitor-resources-v1.10.2-parity.md
          git commit -m "feat(monitor): localize Apps table and actions"
          git push origin HEAD:feature/better-monitor-i18n
