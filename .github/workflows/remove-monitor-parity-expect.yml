name: Remove monitor parity lint expectation

on:
  push:
    branches:
      - feature/better-monitor-ui
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Remove stale expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/monitor-gui/src/parity.rs")
          source = path.read_text()
          block = '''    #[expect(
        clippy::too_many_arguments,
        reason = "a dynamic sidebar row carries its full resource presentation and navigation contract"
    )]
'''
          source = source.replace(block, "")
          path.write_text(source)
          PY
          cargo fmt --all
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/monitor-gui/src/parity.rs
          git commit -m "fix(monitor): remove stale lint expectations"
          git push origin HEAD:feature/better-monitor-ui
