name: Monitor Dialog Repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'feature/better-monitor-interactions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-interactions
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rebuild dialog functions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/monitor-gui/src/app_table.rs")
          source = path.read_text()

          def replace_between(source: str, start: str, end: str, replacement: str) -> str:
              start_ix = source.index(start)
              end_ix = source.index(end, start_ix)
              return source[:start_ix] + replacement + source[end_ix:]

          info_dialog = '''fn open_app_information_dialog(
              group: AppGroup,
              unit_base: UnitBase,
              row_ix: usize,
              window: &mut Window,
              cx: &mut App,
          ) {
              let title = format!("{} Information", group.display_name);
              let description = app_information(&group, unit_base);
              window.open_dialog(cx, move |dialog, _, _| {
                  dialog
                      .title(title.clone())
                      .child(description.clone())
                      .footer(
                          h_flex().justify_end().gap_2().child(
                              Button::new(("app-info-close", row_ix))
                                  .outline()
                                  .label("Close")
                                  .on_click(|_, window, cx| window.close_dialog(cx)),
                          ),
                      )
              });
          }

          '''
          source = replace_between(
              source,
              "fn open_app_information_dialog(",
              "#[derive(Clone)]",
              info_dialog,
          )

          signal_dialog = '''fn open_app_signal_dialog(
              request: AppSignalRequest,
              window: &mut Window,
              cx: &mut App,
          ) {
              window.open_dialog(cx, move |dialog, _, _| {
                  let action_request = request.clone();
                  let click_request = action_request.clone();
                  let confirm = Button::new(("app-action-confirm", action_request.row_ix))
                      .label(action_request.confirm_label);
                  let confirm = if action_request.destructive {
                      confirm.warning()
                  } else {
                      confirm
                  };
                  dialog
                      .title(request.title.clone())
                      .child(request.description)
                      .footer(
                          h_flex()
                              .justify_end()
                              .gap_2()
                              .child(
                                  Button::new(("app-action-cancel", action_request.row_ix))
                                      .outline()
                                      .label("Cancel")
                                      .on_click(|_, window, cx| window.close_dialog(cx)),
                              )
                              .child(confirm.on_click(move |_, window, cx| {
                                  send_app_signal(
                                      click_request.monitor.clone(),
                                      click_request.pids.clone(),
                                      click_request.signal,
                                      cx,
                                  );
                                  window.close_dialog(cx);
                              })),
                      )
              });
          }

          '''
          source = replace_between(
              source,
              "fn open_app_signal_dialog(",
              "fn send_app_signal(",
              signal_dialog,
          )

          path.write_text(source)
          PY
          cargo fmt --all
      - name: Commit repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/monitor-gui/src/app_table.rs
          git commit -m "fix(monitor): render Apps dialog footers"
          git push origin HEAD:feature/better-monitor-interactions
