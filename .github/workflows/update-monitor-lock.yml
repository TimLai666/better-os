name: Update monitor lock and notices

on:
  push:
    branches:
      - feature/better-monitor-ui
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-ui
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve dependency lock
        run: cargo metadata --format-version 1 >/dev/null
      - name: Regenerate notices
        run: bash packaging/generate-third-party-notices.sh
      - name: Verify locked metadata
        run: cargo metadata --format-version 1 --locked >/dev/null
      - name: Commit lock and notices
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock docs/third-party-licenses.md
          git commit -m "chore(monitor): lock metrics dependencies and notices"
          git push origin HEAD:feature/better-monitor-ui
