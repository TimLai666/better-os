name: Better Monitor source snapshot

on:
  push:
    branches:
      - feature/better-monitor-ui

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: better-monitor-current-source
          path: |
            crates/monitor-gui
            docs/better-monitor-resources-v1.10.2-parity.md
