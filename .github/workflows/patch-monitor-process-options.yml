name: Patch monitor process options

on:
  push:
    branches:
      - feature/better-monitor-ui
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Integrate process options
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/monitor-gui/src/parity.rs")
          source = path.read_text()

          import_marker = "use sysinfo::Signal;\n"
          process_import = "use crate::process_control::{self, PriorityPreset};\n"
          if process_import not in source:
              source = source.replace(import_marker, import_marker + process_import, 1)

          old_selected = '''            .when_some(selected, |this, process| {
                this.child(self.render_process_details(&process, cx))
            })'''
          new_selected = '''            .when_some(selected, |this, process| {
                this.child(
                    v_flex()
                        .gap_4()
                        .child(self.render_process_details(&process, cx))
                        .child(self.render_process_options(&process, cx)),
                )
            })'''
          if old_selected not in source:
              raise SystemExit("selected process render marker not found")
          source = source.replace(old_selected, new_selected, 1)

          gpu_marker = "    pub(super) fn render_gpu_parity(&self, cx: &Context<Self>) -> Div {\n"
          process_options = '''    fn render_process_options(
        &self,
        process: &ProcessInfo,
        cx: &mut Context<Self>,
    ) -> Div {
        let pid = process.pid;
        let current_priority = PriorityPreset::from_nice(process.nice.unwrap_or_default());
        let next_priority = current_priority.next();
        let affinity_result = process_control::affinity(pid);
        let current_affinity = affinity_result.as_ref().cloned().unwrap_or_default();
        let affinity_summary = affinity_result.as_ref().map_or_else(
            |error| error.to_string(),
            |cpus| process_control::format_affinity(cpus),
        );
        let all_cpus = process_control::available_cpus();
        let all_cpus_for_action = all_cpus.clone();

        self.section_card(
            "Process options",
            "GNOME Resources parity controls using Linux setpriority and sched_setaffinity",
            v_flex()
                .gap_3()
                .child(
                    h_flex()
                        .items_center()
                        .justify_between()
                        .gap_4()
                        .py_2()
                        .border_b_1()
                        .border_color(cx.theme().border)
                        .child(
                            v_flex()
                                .gap_1()
                                .child(div().text_sm().font_bold().child("Priority"))
                                .child(
                                    div()
                                        .text_xs()
                                        .text_color(cx.theme().muted_foreground)
                                        .child(format!(
                                            "{} · nice {}",
                                            current_priority.label(),
                                            process.nice.unwrap_or_default()
                                        )),
                                ),
                        )
                        .child(
                            Button::new(("process-priority", pid.as_u32() as usize))
                                .outline()
                                .small()
                                .label(format!("Set {}", next_priority.label()))
                                .on_click(cx.listener(move |this, _, _, cx| {
                                    this.apply_process_priority(pid, next_priority);
                                    cx.notify();
                                })),
                        ),
                )
                .child(
                    v_flex()
                        .gap_3()
                        .child(
                            h_flex()
                                .items_center()
                                .justify_between()
                                .gap_4()
                                .child(
                                    v_flex()
                                        .gap_1()
                                        .child(div().text_sm().font_bold().child("CPU affinity"))
                                        .child(
                                            div()
                                                .text_xs()
                                                .text_color(cx.theme().muted_foreground)
                                                .child(format!("Logical CPUs: {affinity_summary}")),
                                        ),
                                )
                                .child(
                                    Button::new(("process-affinity-all", pid.as_u32() as usize))
                                        .outline()
                                        .small()
                                        .label("Use all CPUs")
                                        .disabled(all_cpus_for_action.is_empty())
                                        .on_click(cx.listener(move |this, _, _, cx| {
                                            this.apply_process_affinity(pid, &all_cpus_for_action);
                                            cx.notify();
                                        })),
                                ),
                        )
                        .child(
                            h_flex()
                                .flex_wrap()
                                .gap_2()
                                .children(all_cpus.into_iter().map(|cpu| {
                                    let checked = current_affinity.contains(&cpu);
                                    h_flex()
                                        .items_center()
                                        .gap_2()
                                        .rounded(cx.theme().radius)
                                        .border_1()
                                        .border_color(cx.theme().border)
                                        .px_3()
                                        .py_2()
                                        .child(
                                            Switch::new(("process-affinity-cpu", cpu))
                                                .checked(checked)
                                                .on_click(cx.listener(
                                                    move |this, checked, _, cx| {
                                                        this.toggle_process_cpu(pid, cpu, *checked);
                                                        cx.notify();
                                                    },
                                                )),
                                        )
                                        .child(div().text_sm().child(format!("CPU {}", cpu + 1)))
                                })),
                        ),
                ),
            cx,
        )
    }

'''
          if gpu_marker not in source:
              raise SystemExit("GPU render marker not found")
          source = source.replace(gpu_marker, process_options + gpu_marker, 1)

          persist_marker = "    fn persist_settings(&mut self) {\n"
          process_methods = '''    fn apply_process_priority(&mut self, pid: Pid, preset: PriorityPreset) {
        self.last_action = Some(match process_control::set_priority(pid, preset) {
            Ok(()) => format!(
                "Set PID {} priority to {} (nice {})",
                pid,
                preset.label(),
                preset.nice()
            ),
            Err(error) => error.to_string(),
        });
    }

    fn apply_process_affinity(&mut self, pid: Pid, cpus: &[usize]) {
        self.last_action = Some(match process_control::set_affinity(pid, cpus) {
            Ok(()) => format!(
                "Set PID {} CPU affinity to {}",
                pid,
                process_control::format_affinity(cpus)
            ),
            Err(error) => error.to_string(),
        });
    }

    fn toggle_process_cpu(&mut self, pid: Pid, cpu: usize, enabled: bool) {
        let mut cpus = match process_control::affinity(pid) {
            Ok(cpus) => cpus,
            Err(error) => {
                self.last_action = Some(error.to_string());
                return;
            }
        };

        if enabled {
            if !cpus.contains(&cpu) {
                cpus.push(cpu);
                cpus.sort_unstable();
            }
        } else {
            cpus.retain(|candidate| *candidate != cpu);
        }
        self.apply_process_affinity(pid, &cpus);
    }

'''
          if persist_marker not in source:
              raise SystemExit("persist settings marker not found")
          source = source.replace(persist_marker, process_methods + persist_marker, 1)

          path.write_text(source)
          PY
          cargo fmt --all
      - name: Commit process options
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/monitor-gui/src/parity.rs
          git commit -m "feat(monitor): add process priority and CPU affinity controls"
          git push origin HEAD:feature/better-monitor-ui
