name: Monitor Process Interaction Apply

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/better-monitor-process-interactions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-process-interactions
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply deterministic source patch
        run: |
          python3 .github/scripts/apply_process_interactions.py
          cargo fmt --all
      - name: Commit implementation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/monitor-gui/src/main.rs crates/monitor-gui/src/app.rs crates/monitor-gui/src/app_table.rs crates/monitor-gui/src/process_table.rs docs/better-monitor-resources-v1.10.2-parity.md
          git commit -m "feat(monitor): add process context actions and refresh hold"
          git push origin HEAD:feature/better-monitor-process-interactions
