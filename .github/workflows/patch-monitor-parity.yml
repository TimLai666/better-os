name: Integrate monitor parity modules

on:
  push:
    branches:
      - feature/better-monitor-ui
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Integrate parity modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("crates/monitor-gui/src/main.rs")
          source = path.read_text()

          if not source.startswith("mod linux;"):
              source = "mod linux;\nmod parity;\nmod process_table;\nmod settings;\n\n" + source

          source = source.replace(
              "    collections::VecDeque,\n    time::{Duration, SystemTime, UNIX_EPOCH},",
              "    collections::{HashMap, VecDeque},\n    time::{Duration, SystemTime, UNIX_EPOCH},",
          )

          source = source.replace(
              "    chart::AreaChart,\n    h_flex,\n    scroll::ScrollableElement,\n    table::{Column, ColumnSort, DataTable, TableDelegate, TableState},\n    v_flex,",
              "    chart::AreaChart,\n    h_flex,\n    input::{InputEvent, InputState},\n    scroll::ScrollableElement,\n    table::{DataTable, TableEvent, TableState},\n    v_flex,",
          )

          source = source.replace(
              "use monitor_core::{Incident, MonitorStore, Sample};\nuse smol::Timer;\nuse sysinfo::{Disks, Networks, Pid, System};",
              "use linux::{AppGroup, AppProcessSample, BatteryDevice, CpuDetails, GpuDevice, NetworkMetadata, NpuDevice};\nuse monitor_core::{Incident, MonitorStore, Sample};\nuse process_table::{ProcessInfo, ProcessTableDelegate};\nuse settings::{MonitorSettings, RefreshSpeed, SidebarMeterType, TemperatureUnit, UnitBase};\nuse smol::Timer;\nuse sysinfo::{Disks, Networks, Pid, System};",
          )

          source = re.sub(
              r"#\[derive\(Clone\)\]\nstruct ProcessInfo \{.*?\n\}\n\n(?=#\[derive\(Clone\)\]\nstruct DiskInfo)",
              "",
              source,
              flags=re.S,
          )

          source = re.sub(
              r"#\[derive\(Clone, Copy, Debug, Default, Eq, PartialEq\)\]\nenum ProcessSortField.*?\n\}\n\nstruct MonitorWindow",
              "struct MonitorWindow",
              source,
              flags=re.S,
          )

          source = source.replace(
              "    Memory,\n    Storage,\n    Network,\n    History,",
              "    Memory,\n    Gpu,\n    Npu,\n    Storage,\n    Network,\n    Battery,\n    History,",
          )
          source = source.replace(
              "    Incidents,\n    Diagnostics,\n}",
              "    Incidents,\n    Diagnostics,\n    Settings,\n}",
              1,
          )

          source = source.replace(
              "    const PRIMARY: [Self; 7] = [\n        Self::Overview,\n        Self::Apps,\n        Self::Processes,\n        Self::Cpu,\n        Self::Memory,\n        Self::Storage,\n        Self::Network,\n    ];",
              "    const PRIMARY: [Self; 5] = [\n        Self::Overview,\n        Self::Apps,\n        Self::Processes,\n        Self::Cpu,\n        Self::Memory,\n    ];",
          )

          replacements = {
              '            Self::Memory => "monitor-memory",\n            Self::Storage => "monitor-storage",': '            Self::Memory => "monitor-memory",\n            Self::Gpu => "monitor-gpu",\n            Self::Npu => "monitor-npu",\n            Self::Storage => "monitor-storage",',
              '            Self::Network => "monitor-network",\n            Self::History => "monitor-history",': '            Self::Network => "monitor-network",\n            Self::Battery => "monitor-battery",\n            Self::History => "monitor-history",',
              '            Self::Diagnostics => "monitor-diagnostics",\n        }': '            Self::Diagnostics => "monitor-diagnostics",\n            Self::Settings => "monitor-settings",\n        }',
              '            Self::Memory => "Memory",\n            Self::Storage => "Storage",': '            Self::Memory => "Memory",\n            Self::Gpu => "GPU",\n            Self::Npu => "NPU",\n            Self::Storage => "Storage",',
              '            Self::Network => "Network",\n            Self::History => "History",': '            Self::Network => "Network",\n            Self::Battery => "Battery",\n            Self::History => "History",',
              '            Self::Diagnostics => "Diagnostics",\n        }': '            Self::Diagnostics => "Diagnostics",\n            Self::Settings => "Settings",\n        }',
              '            Self::Memory => "▤",\n            Self::Storage => "▱",': '            Self::Memory => "▤",\n            Self::Gpu => "▰",\n            Self::Npu => "◇",\n            Self::Storage => "▱",',
              '            Self::Network => "⌁",\n            Self::History => "↗",': '            Self::Network => "⌁",\n            Self::Battery => "▥",\n            Self::History => "↗",',
              '            Self::Diagnostics => "⊙",\n        }': '            Self::Diagnostics => "⊙",\n            Self::Settings => "⚙",\n        }',
              '            Self::Memory => "Available memory, swap, cache context, and pressure coverage",\n            Self::Storage => "Filesystem capacity and current process I/O throughput",': '            Self::Memory => "Available memory, swap, hardware properties, and pressure coverage",\n            Self::Gpu => "GPU usage, media engines, memory, thermals, power, clocks, and driver",\n            Self::Npu => "NPU usage, memory, thermals, power, clocks, and driver",\n            Self::Storage => "Per-drive activity, throughput, totals, capacity, and hardware properties",',
              '            Self::Network => "Per-interface throughput and link activity",\n            Self::History => "Recent low-cost samples retained by the monitor session",': '            Self::Network => "Per-interface throughput, totals, link, driver, and connection metadata",\n            Self::Battery => "Charge, power, health, cycles, capacity, and battery identity",\n            Self::History => "Recent low-cost samples retained by the monitor session",',
              '            Self::Diagnostics => "Collector health, coverage, and known blind spots",\n        }': '            Self::Diagnostics => "Collector health, coverage, and known blind spots",\n            Self::Settings => "Refresh, units, sidebar, graph, device, app, and process column settings",\n        }',
          }
          for old, new in replacements.items():
              source = source.replace(old, new)

          source = source.replace(
              "struct DiskInfo {\n    name: String,\n    mount_point: String,\n    file_system: String,\n    total: u64,\n    available: u64,\n}",
              "struct DiskInfo {\n    name: String,\n    mount_point: String,\n    file_system: String,\n    total: u64,\n    available: u64,\n    metadata: linux::BlockMetadata,\n}",
          )
          source = source.replace(
              "struct NetworkInfo {\n    name: String,\n    received: u64,\n    transmitted: u64,\n    total_received: u64,\n    total_transmitted: u64,\n}",
              "struct NetworkInfo {\n    name: String,\n    received: u64,\n    transmitted: u64,\n    total_received: u64,\n    total_transmitted: u64,\n    metadata: NetworkMetadata,\n}",
          )

          source = source.replace(
              "    top_processes: Vec<ProcessInfo>,\n    disk_info: Vec<DiskInfo>,\n    network_info: Vec<NetworkInfo>,\n    active_page: MonitorPage,",
              "    top_processes: Vec<ProcessInfo>,\n    app_groups: Vec<AppGroup>,\n    disk_info: Vec<DiskInfo>,\n    network_info: Vec<NetworkInfo>,\n    cpu_details: CpuDetails,\n    gpus: Vec<GpuDevice>,\n    npus: Vec<NpuDevice>,\n    batteries: Vec<BatteryDevice>,\n    users: HashMap<u32, String>,\n    settings: MonitorSettings,\n    search_input: Entity<InputState>,\n    search_query: String,\n    selected_pid: Option<Pid>,\n    selected_gpu: usize,\n    selected_npu: usize,\n    selected_disk: usize,\n    selected_network: usize,\n    selected_battery: usize,\n    last_action: Option<String>,\n    _subscriptions: Vec<Subscription>,\n    active_page: MonitorPage,",
          )

          source = source.replace(
              "        let process_table = cx.new(|cx| {\n            TableState::new(ProcessTableDelegate::new(), window, cx)\n                .col_selectable(false)\n                .col_movable(false)\n        });",
              "        let settings = MonitorSettings::load();\n        let process_table = cx.new(|cx| {\n            TableState::new(ProcessTableDelegate::new(&settings), window, cx)\n                .col_selectable(false)\n                .col_movable(false)\n                .row_selectable(true)\n        });\n        let search_input = cx.new(|cx| {\n            InputState::new(window, cx)\n                .placeholder(\"Search apps and processes…\")\n                .clean_on_escape()\n        });\n        let table_subscription = cx.subscribe(&process_table, |this, table, event, cx| {\n            match event {\n                TableEvent::SelectRow(row) | TableEvent::DoubleClickedRow(row) => {\n                    this.selected_pid = table\n                        .read(cx)\n                        .delegate()\n                        .process_at(*row)\n                        .map(|process| process.pid);\n                    cx.notify();\n                }\n                TableEvent::ClearSelection => {\n                    this.selected_pid = None;\n                    cx.notify();\n                }\n                _ => {}\n            }\n        });\n        let search_subscription = cx.subscribe_in(\n            &search_input,\n            window,\n            |this, input, event, _, cx| {\n                if matches!(event, InputEvent::Change) {\n                    this.search_query = input.read(cx).value().to_string();\n                    let query = this.search_query.clone();\n                    this.process_table.update(cx, |table, cx| {\n                        table.delegate_mut().set_filter(query);\n                        table.refresh(cx);\n                        cx.notify();\n                    });\n                    cx.notify();\n                }\n            },\n        );",
          )

          source = source.replace(
              "            top_processes: Vec::new(),\n            disk_info: Vec::new(),\n            network_info: Vec::new(),\n            active_page: MonitorPage::Overview,",
              "            top_processes: Vec::new(),\n            app_groups: Vec::new(),\n            disk_info: Vec::new(),\n            network_info: Vec::new(),\n            cpu_details: linux::cpu_details(&system),\n            gpus: linux::scan_gpus(),\n            npus: linux::scan_npus(),\n            batteries: linux::scan_batteries(),\n            users: linux::users_by_id(),\n            settings,\n            search_input,\n            search_query: String::new(),\n            selected_pid: None,\n            selected_gpu: 0,\n            selected_npu: 0,\n            selected_disk: 0,\n            selected_network: 0,\n            selected_battery: 0,\n            last_action: None,\n            _subscriptions: vec![table_subscription, search_subscription],\n            active_page: MonitorPage::Overview,",
          )

          source = source.replace(
              "            loop {\n                Timer::after(REFRESH_INTERVAL).await;\n                if this",
              "            loop {\n                let delay = match this.update(cx, |this, _| this.settings.refresh_interval()) {\n                    Ok(delay) => delay,\n                    Err(_) => break,\n                };\n                Timer::after(delay).await;\n                if this",
          )

          source = source.replace(
              "        if self.history.len() >= MAX_DATA_POINTS {\n            self.history.pop_front();\n        }",
              "        if self.history.len() >= self.settings.clamped_graph_points() {\n            self.history.pop_front();\n        }",
          )

          old_process_collection = '''        let mut processes = self
            .system
            .processes()
            .iter()
            .map(|(pid, process)| {
                let disk = process.disk_usage();
                ProcessInfo {
                    pid: *pid,
                    name: process.name().to_string_lossy().to_string(),
                    state: format!("{:?}", process.status()),
                    cpu_usage: process.cpu_usage(),
                    memory: process.memory(),
                    read_bytes: disk.read_bytes,
                    written_bytes: disk.written_bytes,
                }
            })
            .collect::<Vec<_>>();'''
          new_process_collection = '''        let mut app_samples = Vec::new();
        let mut processes = self
            .system
            .processes()
            .iter()
            .map(|(pid, process)| {
                let disk = process.disk_usage();
                let extra = linux::process_extra(*pid, &self.users);
                let name = process.name().to_string_lossy().to_string();
                app_samples.push(AppProcessSample {
                    pid: *pid,
                    name: name.clone(),
                    cpu_usage: process.cpu_usage(),
                    memory: process.memory(),
                    swap: extra.swap_bytes.unwrap_or_default(),
                    read_speed: disk.read_bytes,
                    read_total: disk.total_read_bytes,
                    write_speed: disk.written_bytes,
                    write_total: disk.total_written_bytes,
                    app_id: extra.app_id.clone(),
                    cgroup: extra.cgroup.clone(),
                });
                ProcessInfo {
                    pid: *pid,
                    parent_pid: extra.parent_pid,
                    name,
                    user: extra.user.unwrap_or_else(|| {
                        extra.uid.map_or_else(|| "N/A".to_string(), |uid| uid.to_string())
                    }),
                    state: format!("{:?}", process.status()),
                    cpu_usage: process.cpu_usage(),
                    memory: process.memory(),
                    swap: extra.swap_bytes.unwrap_or_default(),
                    read_speed: disk.read_bytes,
                    read_total: disk.total_read_bytes,
                    write_speed: disk.written_bytes,
                    write_total: disk.total_written_bytes,
                    total_cpu_time_ticks: extra.total_cpu_time_ticks,
                    user_cpu_time_ticks: extra.user_cpu_time_ticks,
                    system_cpu_time_ticks: extra.system_cpu_time_ticks,
                    priority: extra.priority,
                    nice: extra.nice,
                    threads: extra.threads,
                    file_descriptors: extra.file_descriptors,
                    command_line: extra.command_line,
                    executable: extra.executable,
                    working_directory: extra.working_directory,
                    cgroup: extra.cgroup,
                    app_id: extra.app_id,
                }
            })
            .collect::<Vec<_>>();
        self.app_groups = linux::group_apps(&app_samples);'''
          if old_process_collection not in source:
              raise SystemExit("process collection marker not found")
          source = source.replace(old_process_collection, new_process_collection)

          source = source.replace(
              "                available: disk.available_space(),\n            })",
              "                available: disk.available_space(),\n                metadata: linux::block_metadata(&disk.name().to_string_lossy()),\n            })",
          )
          source = source.replace(
              "                total_transmitted: data.total_transmitted(),\n            })",
              "                total_transmitted: data.total_transmitted(),\n                metadata: linux::network_metadata(name),\n            })",
          )

          source = source.replace(
              "        self.network_info.sort_by(|a, b| a.name.cmp(&b.name));\n    }",
              "        self.network_info.sort_by(|a, b| a.name.cmp(&b.name));\n\n        if self.sample_index % 2 == 0 {\n            self.cpu_details = linux::cpu_details(&self.system);\n            self.gpus = linux::scan_gpus();\n            self.npus = linux::scan_npus();\n            self.batteries = linux::scan_batteries();\n        }\n    }",
              1,
          )

          source = re.sub(
              r"    fn render_sidebar\(&self, cx: &mut Context<Self>\) -> Div \{.*?\n    fn render_header",
              "    fn render_header",
              source,
              flags=re.S,
          )

          source = re.sub(
              r"    fn render_apps\(&self, cx: &Context<Self>\) -> Div \{.*?\n    fn render_cpu",
              "    fn render_cpu",
              source,
              flags=re.S,
          )

          source = source.replace(
              "            MonitorPage::Apps => self.render_apps(cx),\n            MonitorPage::Processes => self.render_processes(cx),",
              "            MonitorPage::Apps => self.render_apps_parity(cx),\n            MonitorPage::Processes => self.render_processes_parity(cx),",
          )
          source = source.replace(
              "            MonitorPage::Memory => self.render_memory(cx),\n            MonitorPage::Storage => self.render_storage(cx),",
              "            MonitorPage::Memory => self.render_memory(cx),\n            MonitorPage::Gpu => self.render_gpu_parity(cx),\n            MonitorPage::Npu => self.render_npu_parity(cx),\n            MonitorPage::Storage => self.render_storage(cx),",
          )
          source = source.replace(
              "            MonitorPage::Network => self.render_network(cx),\n            MonitorPage::History => self.render_history(cx),",
              "            MonitorPage::Network => self.render_network(cx),\n            MonitorPage::Battery => self.render_battery_parity(cx),\n            MonitorPage::History => self.render_history(cx),",
          )
          source = source.replace(
              "            MonitorPage::Diagnostics => self.render_diagnostics(cx),\n        }",
              "            MonitorPage::Diagnostics => self.render_diagnostics(cx),\n            MonitorPage::Settings => self.render_settings_parity(cx),\n        }",
              1,
          )
          source = source.replace(
              ".child(self.render_sidebar(cx))",
              ".child(self.render_resources_sidebar(cx))",
          )

          path.write_text(source)
          PY
          cargo fmt --all
      - name: Commit parity integration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/monitor-gui/src/main.rs crates/monitor-gui/src/*.rs
          git commit -m "feat(monitor): integrate Resources parity shell and collectors"
          git push origin HEAD:feature/better-monitor-ui
