name: Apply Better Monitor window and NetworkManager parity

on:
  push:
    branches:
      - feature/better-monitor-ui
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-ui
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install GPUI Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Apply and validate
        run: |
          if ! grep -q 'fn network_manager_dbus_name' crates/monitor-gui/src/linux.rs; then
            cat .github/monitor-window-network/chunk-* | base64 -d | gzip -d > /tmp/monitor-window-network.patch
            test "$(sha256sum /tmp/monitor-window-network.patch | cut -d' ' -f1)" = "37c98157d99418c4d8416d83caaceb8fa825949bccba539548d479a164e3d507"
            git apply --check /tmp/monitor-window-network.patch
            git apply /tmp/monitor-window-network.patch
          fi
          cargo fmt --all
          cargo check -p monitor-gui
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/monitor-gui/Cargo.toml crates/monitor-gui/src/app.rs crates/monitor-gui/src/linux.rs crates/monitor-gui/src/settings.rs docs/better-monitor-resources-v1.10.2-parity.md docs/better-monitor-window-and-network-state.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(monitor): persist window state and query NetworkManager over D-Bus"
          git push origin HEAD:feature/better-monitor-ui
