name: Refresh Better Monitor lockfile

on:
  push:
    branches:
      - feature/better-monitor-ui

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-ui
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh the locked dependency graph
        run: cargo generate-lockfile
      - name: Commit the lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build(monitor): lock direct zbus dependency"
          git pull --rebase origin feature/better-monitor-ui
          git push origin HEAD:feature/better-monitor-ui
