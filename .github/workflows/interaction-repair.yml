name: Monitor Interaction Repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'feature/better-monitor-interactions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-interactions
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rebuild Apps interaction sections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/monitor-gui/src/app_table.rs")
          source = path.read_text()

          def replace_between(source: str, start: str, end: str, replacement: str) -> str:
              start_ix = source.index(start)
              end_ix = source.index(end, start_ix)
              return source[:start_ix] + replacement + source[end_ix:]

          render_actions = '''    fn render_actions(
              &self,
              row_ix: usize,
              group: AppGroup,
              _: &mut Context<TableState<Self>>,
          ) -> AnyElement {
              let info_group = group.clone();
              let info_unit = self.settings.unit_base;
              let term_monitor = self.monitor.clone();
              let term_group = group.clone();
              let menu_monitor = self.monitor.clone();
              let menu_group = group.clone();

              h_flex()
                  .items_center()
                  .gap_1()
                  .child(
                      Button::new(("app-information", row_ix))
                          .outline()
                          .small()
                          .label("Info")
                          .on_click(move |_, window, cx| {
                              open_app_information_dialog(
                                  info_group.clone(),
                                  info_unit,
                                  row_ix,
                                  window,
                                  cx,
                              );
                          }),
                  )
                  .child(
                      DropdownButton::new(("app-actions", row_ix))
                          .outline()
                          .small()
                          .button(
                              Button::new(("app-end-primary", row_ix))
                                  .label("End")
                                  .on_click(move |_, window, cx| {
                                      open_app_signal_dialog(
                                          AppSignalRequest {
                                              monitor: term_monitor.clone(),
                                              pids: term_group.pids.clone(),
                                              signal: Signal::Term,
                                              title: format!("End {}?", term_group.display_name),
                                              description: "All processes in this application group will receive a graceful termination signal.",
                                              confirm_label: "End Application",
                                              row_ix,
                                              destructive: false,
                                          },
                                          window,
                                          cx,
                                      );
                                  }),
                          )
                          .dropdown_menu(move |menu, _, _| {
                              app_action_menu(
                                  menu,
                                  menu_monitor.clone(),
                                  menu_group.clone(),
                                  row_ix,
                              )
                          }),
                  )
                  .into_any_element()
          }
          '''
          source = replace_between(
              source,
              "    fn render_actions(",
              "\n}\n\nfn app_information",
              render_actions,
          )

          helpers = '''fn app_information(group: &AppGroup, unit_base: UnitBase) -> String {
              format!(
                  "Identity: {}\\nGrouped processes: {}\\nGrouping evidence: {}\\nPIDs: {}\\nCPU: {:.1}%\\nMemory: {}\\nSwap: {}\\nRead: {} total, {}/s\\nWritten: {} total, {}/s",
                  group.id,
                  group.process_count,
                  group.grouping_reason,
                  group
                      .pids
                      .iter()
                      .map(ToString::to_string)
                      .collect::<Vec<_>>()
                      .join(", "),
                  group.cpu_usage,
                  linux::format_bytes(group.memory, unit_base),
                  linux::format_bytes(group.swap, unit_base),
                  linux::format_bytes(group.read_total, unit_base),
                  linux::format_bytes(group.read_speed, unit_base),
                  linux::format_bytes(group.write_total, unit_base),
                  linux::format_bytes(group.write_speed, unit_base),
              )
          }

          fn open_app_information_dialog(
              group: AppGroup,
              unit_base: UnitBase,
              row_ix: usize,
              window: &mut Window,
              cx: &mut App,
          ) {
              let title = format!("{} Information", group.display_name);
              let description = app_information(&group, unit_base);
              window.open_dialog(cx, move |dialog, _, _| {
                  dialog
                      .title(title.clone())
                      .child(description.clone())
                      .footer(move |_, _, _, _| {
                          vec![
                              Button::new(("app-info-close", row_ix))
                                  .outline()
                                  .label("Close")
                                  .on_click(|_, window, cx| window.close_dialog(cx)),
                          ]
                      })
              });
          }

          #[derive(Clone)]
          struct AppSignalRequest {
              monitor: WeakEntity<MonitorWindow>,
              pids: Vec<Pid>,
              signal: Signal,
              title: String,
              description: &'static str,
              confirm_label: &'static str,
              row_ix: usize,
              destructive: bool,
          }

          fn open_app_signal_dialog(
              request: AppSignalRequest,
              window: &mut Window,
              cx: &mut App,
          ) {
              window.open_dialog(cx, move |dialog, _, _| {
                  let confirm_request = request.clone();
                  dialog
                      .title(request.title.clone())
                      .child(request.description)
                      .footer(move |_, _, _, _| {
                          let action_request = confirm_request.clone();
                          let confirm = Button::new((
                              "app-action-confirm",
                              action_request.row_ix,
                          ))
                          .label(action_request.confirm_label);
                          let confirm = if action_request.destructive {
                              confirm.warning()
                          } else {
                              confirm
                          };
                          vec![
                              Button::new(("app-action-cancel", action_request.row_ix))
                                  .outline()
                                  .label("Cancel")
                                  .on_click(|_, window, cx| window.close_dialog(cx)),
                              confirm.on_click(move |_, window, cx| {
                                  send_app_signal(
                                      action_request.monitor.clone(),
                                      action_request.pids.clone(),
                                      action_request.signal,
                                      cx,
                                  );
                                  window.close_dialog(cx);
                              }),
                          ]
                      })
              });
          }

          fn send_app_signal(
              monitor: WeakEntity<MonitorWindow>,
              pids: Vec<Pid>,
              signal: Signal,
              cx: &mut App,
          ) {
              let _ = monitor.update(cx, |monitor, cx| {
                  monitor.signal_pids(&pids, signal);
                  cx.notify();
              });
          }

          fn app_action_menu(
              menu: PopupMenu,
              monitor: WeakEntity<MonitorWindow>,
              group: AppGroup,
              row_ix: usize,
          ) -> PopupMenu {
              let force_monitor = monitor.clone();
              let force_group = group.clone();
              let pause_monitor = monitor.clone();
              let pause_pids = group.pids.clone();
              let resume_monitor = monitor;
              let resume_pids = group.pids.clone();

              menu.item(
                  PopupMenuItem::new("Force stop").on_click(move |_, window, cx| {
                      open_app_signal_dialog(
                          AppSignalRequest {
                              monitor: force_monitor.clone(),
                              pids: force_group.pids.clone(),
                              signal: Signal::Kill,
                              title: format!("Force stop {}?", force_group.display_name),
                              description: "Every process in this application group will stop immediately without cleanup.",
                              confirm_label: "Force stop",
                              row_ix,
                              destructive: true,
                          },
                          window,
                          cx,
                      );
                  }),
              )
              .separator()
              .item(PopupMenuItem::new("Pause").on_click(move |_, _, cx| {
                  send_app_signal(
                      pause_monitor.clone(),
                      pause_pids.clone(),
                      Signal::Stop,
                      cx,
                  );
              }))
              .item(PopupMenuItem::new("Resume").on_click(move |_, _, cx| {
                  send_app_signal(
                      resume_monitor.clone(),
                      resume_pids.clone(),
                      Signal::Continue,
                      cx,
                  );
              }))
          }

          '''
          source = replace_between(
              source,
              "fn app_information(",
              "impl TableDelegate for AppTableDelegate {",
              helpers,
          )

          context_menu = '''    fn context_menu(
              &mut self,
              row_ix: usize,
              menu: PopupMenu,
              _: &mut Window,
              _: &mut Context<TableState<Self>>,
          ) -> PopupMenu {
              let Some(group) = self.groups.get(row_ix).cloned() else {
                  return menu;
              };
              let info_group = group.clone();
              let info_unit = self.settings.unit_base;
              let end_monitor = self.monitor.clone();
              let end_group = group.clone();
              let action_monitor = self.monitor.clone();

              let menu = menu
                  .item(
                      PopupMenuItem::new("Application information").on_click(
                          move |_, window, cx| {
                              open_app_information_dialog(
                                  info_group.clone(),
                                  info_unit,
                                  row_ix,
                                  window,
                                  cx,
                              );
                          },
                      ),
                  )
                  .separator()
                  .item(
                      PopupMenuItem::new("End application").on_click(move |_, window, cx| {
                          open_app_signal_dialog(
                              AppSignalRequest {
                                  monitor: end_monitor.clone(),
                                  pids: end_group.pids.clone(),
                                  signal: Signal::Term,
                                  title: format!("End {}?", end_group.display_name),
                                  description: "All processes in this application group will receive a graceful termination signal.",
                                  confirm_label: "End Application",
                                  row_ix,
                                  destructive: false,
                              },
                              window,
                              cx,
                          );
                      }),
                  )
                  .separator();
              app_action_menu(menu, action_monitor, group, row_ix)
          }

          '''
          source = replace_between(
              source,
              "    fn context_menu(",
              "    fn perform_sort(",
              context_menu,
          )

          path.write_text(source)
          PY
          cargo fmt --all
      - name: Commit repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/monitor-gui/src/app_table.rs
          git commit -m "fix(monitor): type Apps action requests"
          git push origin HEAD:feature/better-monitor-interactions
