name: Format monitor parity branch

on:
  push:
    branches:
      - feature/better-monitor-ui
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply parity lint fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path("crates/monitor-gui/src/app.rs")
          source = app.read_text()
          source = source.replace(
              "struct DiskInfo {\n    name: String,\n",
              "struct DiskInfo {\n",
              1,
          )
          source = source.replace(
              '                let name = disk.name().to_string_lossy().to_string();\n                let metadata = linux::block_metadata(&name);',
              '                let device_name = disk.name().to_string_lossy().to_string();\n                let metadata = linux::block_metadata(&device_name);',
              1,
          )
          source = source.replace(
              "                DiskInfo {\n                    name,\n                    mount_point:",
              "                DiskInfo {\n                    mount_point:",
              1,
          )
          app.write_text(source)

          linux = Path("crates/monitor-gui/src/linux.rs")
          source = linux.read_text()
          source = source.replace("    pub start_time_ticks: Option<u64>,\n", "", 1)
          source = source.replace(
              "        start_time_ticks: stat_fields.as_ref().map(|fields| fields.start_time_ticks),\n",
              "",
              1,
          )
          source = source.replace("    pub interface: String,\n", "", 1)
          source = source.replace("        interface: interface.to_string(),\n", "", 1)
          source = source.replace("    pub read_ticks_ms: u64,\n", "", 1)
          source = source.replace("    pub write_ticks_ms: u64,\n", "", 1)
          source = source.replace(
              "        let Some(read_ticks_ms) = parse(6) else {\n            continue;\n        };\n",
              "",
              1,
          )
          source = source.replace(
              "        let Some(write_ticks_ms) = parse(10) else {\n            continue;\n        };\n",
              "",
              1,
          )
          source = source.replace("                read_ticks_ms,\n", "", 1)
          source = source.replace("                write_ticks_ms,\n", "", 1)
          source = source.replace("    start_time_ticks: u64,\n", "", 1)
          source = source.replace(
              "        start_time_ticks: fields.get(19)?.parse::<u64>().ok()?,\n",
              "",
              1,
          )
          source = source.replace(
              '    let interface_type = if path.join("wireless").exists() {\n        "Wi-Fi"\n    } else if interface.starts_with("wl") {\n        "Wi-Fi"',
              '    let interface_type = if path.join("wireless").exists()\n        || interface.starts_with("wl")\n    {\n        "Wi-Fi"',
              1,
          )
          linux.write_text(source)

          parity = Path("crates/monitor-gui/src/parity.rs")
          source = parity.read_text()
          source = source.replace(
              "    fn sidebar_resource_row(\n",
              "    #[expect(\n        clippy::too_many_arguments,\n        reason = \"a dynamic sidebar row carries its full resource presentation and navigation contract\"\n    )]\n    fn sidebar_resource_row(\n",
              1,
          )
          parity.write_text(source)
          PY
          cargo fmt --all
      - name: Commit lint fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/monitor-gui/src/app.rs crates/monitor-gui/src/linux.rs crates/monitor-gui/src/parity.rs
          git commit -m "fix(monitor): satisfy Resources parity lints"
          git push origin HEAD:feature/better-monitor-ui
