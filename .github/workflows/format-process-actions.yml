name: Format Process Actions

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feature/better-monitor-process-interactions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-monitor-process-interactions
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatted source
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/monitor-gui/src/process_actions.rs
          git commit -m "style(monitor): format process action module"
          git push origin HEAD:feature/better-monitor-process-interactions
