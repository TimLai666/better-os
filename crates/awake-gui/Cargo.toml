[package]
name = "awake-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "awake-gui"
path = "src/main.rs"
test = true
bench = false

[dependencies]
awake-core.workspace = true
awake-ipc.workspace = true
# The one local-time conversion (`better_core::local_time`, ticket 146).
better-core.workspace = true
better-ui.workspace = true
# The battery's state and words every battery icon shares, and the one
# reader of `power_supply` it comes from (ticket 170).
hardware-core.workspace = true
hardware-platform.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
gpui-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
zbus = { version = "5" }

[dev-dependencies]
tempfile.workspace = true
