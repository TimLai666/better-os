[package]
name = "files-preview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
app-catalog-core.workspace = true
thiserror.workspace = true
# Only the four formats a file manager actually meets first. Every one of them
# is already in the workspace lockfile, so this adds no package to the build;
# it narrows which decoders are compiled in, which is the point.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
] }

# The shared thumbnail cache names a thumbnail by the MD5 of the file's URI
# and keeps the file's mtime in a PNG text chunk (freedesktop thumbnail
# specification). Both crates are already in the lockfile through `image`
# and the digest crates.
md-5 = "0.10"
png = "0.18"
# The preview window lists what is inside an archive with the same readers
# the extract operation uses; nothing new is compiled.
zip.workspace = true
tar.workspace = true
flate2.workspace = true
ruzstd.workspace = true
# Audio and video in the large preview. The bindings are MIT/Apache; the
# GStreamer libraries they call are LGPL, linked dynamically from the system
# (the package depends on the base plugins). The decoders are whatever
# GStreamer plugins are installed; a missing one is said plainly.
# A converter or thumbnailer that times out is ended with everything it
# started (its process group). Already in the lockfile.
libc = "0.2"
# A private folder for an installed thumbnailer's output.
tempfile.workspace = true
gstreamer = "0.25"
gstreamer-video = "0.25"
gstreamer-app = "0.25"

[dev-dependencies]

[[bench]]
name = "preview"
harness = false
