[package]
name = "monitor-actions-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
monitor-core.workspace = true
# The four operations this crate performs — kill(2), setpriority(2),
# getpriority(2), and geteuid(2) — have no safe equivalent in the standard
# library, and shelling out to `kill` or `renice` is exactly what the
# architecture forbids. `libc` is the smallest binding that exposes them and is
# already in the workspace lockfile through existing dependencies.
libc = "0.2"
