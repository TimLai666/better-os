[package]
name = "manager-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "manager-gui"
path = "src/main.rs"
test = true
bench = false

[dependencies]
better-ui.workspace = true
manager-core.workspace = true
manager-platform = { workspace = true, features = ["dbus-client", "personal-data"] }
manager-store.workspace = true
better-core.workspace = true
defaults-core.workspace = true
defaults-store.workspace = true
app-catalog-core.workspace = true
app-catalog-platform.workspace = true
window-attention-core.workspace = true
# The Touchpad page (ticket 88) draws from the GPUI-free Better Touchpad
# models and reaches the desktop through the same typed backends the older
# window used; nothing here builds a backend command.
better-actions.workspace = true
touchpad-core.workspace = true
touchpad-gestures.workspace = true
touchpad-platform.workspace = true
touchpad-session.workspace = true
touchpad-views.workspace = true
semver.workspace = true
thiserror.workspace = true
awake-core.workspace = true
awake-ipc.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
gpui-platform.workspace = true
serde.workspace = true
smol = "2"
zbus.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
awake-service = { workspace = true, features = ["test-support"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json.workspace = true
tempfile.workspace = true
