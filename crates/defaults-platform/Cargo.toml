[package]
name = "defaults-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# The dconf write path: a `ca.desrt.dconf.Writer.Change` call over the session
# bus. Without it the GNOME adapters read and verify, and report Manual action
# required for a change, and the crate links no D-Bus stack.
dconf-write = ["session-bus", "dep:tokio"]
# The session bus itself: the `user-service` adapter's `ReloadConfig` and
# name-owner reads (ticket 129, ADR 0041), and the dconf writer's call.
session-bus = ["dep:zbus"]
# A real dconf-service on a private bus, for other crates' tests. No shipped
# binary enables it.
test-support = ["dconf-write", "dep:tempfile", "dep:test-prerequisites"]

[dependencies]
app-catalog-core.workspace = true
# Loading the shared application catalog a restore checks against.
app-catalog-platform.workspace = true
app-chooser-core.workspace = true
better-core.workspace = true
# `getuid` and `statfs`, for dconf's mandatory profile and its NFS rule.
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = { workspace = true, optional = true }
# The skip rule `test_support` shares with every test (ticket 177).
test-prerequisites = { workspace = true, optional = true }
thiserror.workspace = true
# The runtime is this crate's own: it blocks on the async dconf call. zbus
# itself stays on its default async-io flavor — see the root Cargo.toml.
tokio = { version = "1", features = ["rt-multi-thread", "sync"], optional = true }
zbus = { version = "5", optional = true }

[dev-dependencies]
tempfile.workspace = true
