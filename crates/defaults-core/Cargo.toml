[package]
name = "defaults-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
better-core.workspace = true
# The production GNOME adapters write through the dconf service.
defaults-platform = { workspace = true, features = ["dconf-write"] }
defaults-store.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The mixed-handler-group tests run the production `mimeapps.list` adapter over
# a temporary file.
app-chooser-core.workspace = true
manager-core.workspace = true
manager-platform.workspace = true
serde_json.workspace = true
tempfile.workspace = true
