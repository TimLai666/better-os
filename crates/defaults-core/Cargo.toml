[package]
name = "defaults-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
better-core.workspace = true
# The production GNOME adapters write through the dconf service.
defaults-platform = { workspace = true, features = ["dconf-write"] }
defaults-store.workspace = true
serde.workspace = true
thiserror.workspace = true

# Better Files' before-removal program (ticket 129, ADR 0041): it restores
# what Better Files took over, through the same Restore as the window.
[[bin]]
name = "better-files-before-removal"
path = "src/bin/files_before_removal.rs"

[dev-dependencies]
defaults-platform = { workspace = true, features = ["dconf-write", "test-support"] }
# The mixed-handler-group tests run the production `mimeapps.list` adapter over
# a temporary file.
app-chooser-core.workspace = true
manager-core.workspace = true
manager-platform.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# The file managers a private bus starts in `tests/bus_activation.rs`.
zbus.workspace = true
