[package]
name = "login-screen-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Everything the login screen (`better-greeter`, ticket 264) and the lock
# screen (`better-lock`, ticket 262) share and nothing that draws: the view
# model and its transitions, the layout numbers, the copy in both languages,
# the date and time formatter, the wait after failures, the account order, the
# session list, the keyboard layout indicator, the PAM prompt mapping, the lock
# screen's notification and media rows, the password buffer and the greetd
# messages. No GPUI (design/login-screen-spec.md section 5.1).

[dependencies]
# The one desktop entry parser (`app_catalog_core::entry`): the session list
# reads `/usr/share/wayland-sessions/*.desktop` through it, never a second one.
app-catalog-core.workspace = true
# The one local-time conversion (ticket 146) the clock formats from.
better-core.workspace = true
# The avatar decoder, PNG and JPEG only, with the spec's limits
# (section 5.8: at most 1 MiB and 1024 x 1024).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# mlock and madvise for the password buffer.
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Wipes the password buffer in a way the optimizer keeps.
zeroize = "1"

[dev-dependencies]
tempfile.workspace = true
