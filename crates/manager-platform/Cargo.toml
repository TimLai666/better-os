[package]
name = "manager-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# The client half of the privileged protocol. Off by default so nothing links
# a D-Bus stack unless it is actually going to talk to the daemon.
dbus-client = ["dep:zbus"]
# Moving a removed component's personal data to the trash, which the window
# and the command line need and the privileged service never does.
personal-data = ["dep:files-platform"]

[dependencies]
better-core.workspace = true
files-platform = { workspace = true, optional = true }
manager-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
ureq = "3"
zbus = { version = "5", optional = true }

[dev-dependencies]
tempfile.workspace = true
