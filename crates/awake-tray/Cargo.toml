[package]
name = "awake-tray"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "better-awake-tray"
path = "src/main.rs"

[lib]
name = "awake_tray"
path = "src/lib.rs"

[dependencies]
awake-core.workspace = true
awake-ipc.workspace = true
# The one local-time conversion (`better_core::local_time`, ticket 146).
better-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
zbus = { version = "5" }

[dev-dependencies]
# A missing program is a skip on a developer's machine and a failure
# under CI (ticket 177).
test-prerequisites.workspace = true
awake-service = { workspace = true, features = ["test-support"] }
awake-store.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
