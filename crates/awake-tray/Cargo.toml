[package]
name = "awake-tray"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "better-awake-tray"
path = "src/main.rs"

[lib]
name = "awake_tray"
path = "src/lib.rs"

[dependencies]
awake-core.workspace = true
awake-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
awake-service = { workspace = true, features = ["test-support"] }
awake-store.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
