[package]
name = "files-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
app-catalog-core.workspace = true
# The MIME graph, shared rather than reimplemented: `app-chooser-core` already
# parses the freedesktop MIME database's globs and subclass relations, and a
# second glob table here would be a second answer to "what type is this file".
app-chooser-core.workspace = true
# The one local-time conversion (`better_core::local_time`, ticket 146): a
# `.trashinfo` stamp is local time.
better-core.workspace = true
files-core.workspace = true
notify.workspace = true
storage-core.workspace = true
thiserror.workspace = true

[dev-dependencies]
# A missing program is a skip on a developer's machine and a failure
# under CI (ticket 177).
test-prerequisites.workspace = true
tempfile.workspace = true
