[package]
name = "files-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "files_gui"
path = "src/lib.rs"

[[bin]]
name = "better-files"
path = "src/main.rs"
test = false

# The large preview (Space), in a process of its own.
[[bin]]
name = "better-files-preview"
path = "src/bin/preview.rs"
test = false
bench = false

[dependencies]
app-catalog-core.workspace = true
app-catalog-platform.workspace = true
app-chooser-core.workspace = true
app-chooser-gui.workspace = true
better-ui.workspace = true
files-core.workspace = true
files-platform.workspace = true
# org.freedesktop.FileManager1, so "Show in folder" in other applications
# opens Better Files. Already in the workspace through the storage service.
zbus.workspace = true
# LocalSend's protocol: HTTPS to the receiver, its certificate pinned to the
# fingerprint it announced, and a multicast announcement. rustls (with ring),
# sha2 and socket2 are already built for Better Manager and the async runtime.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.10"
# Better Files' own LocalSend certificate, made once (the generator
# LocalSend itself uses; ring as above).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
socket2 = { version = "0.6", features = ["all"] }
# Plugins run in a process group of their own, ended whole.
libc = "0.2"
files-operations.workspace = true
files-preview.workspace = true
files-search.workspace = true
storage-core.workspace = true
storage-platform.workspace = true
storage-service.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
gpui-platform.workspace = true
smol = "2"
# The preview's video frames become GPUI images, which hold `image` frames.
# The version gpui already uses; no decoder features.
image = { version = "0.25", default-features = false }

[dev-dependencies]
better-core.workspace = true
# The fake platform, so the in-process storage engine can be driven without a
# disk. Test builds only; the shipped binary never has it.
storage-platform = { workspace = true, features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile.workspace = true

[[bench]]
name = "view_model"
harness = false

[[bench]]
name = "files_suite"
harness = false
