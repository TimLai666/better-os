[package]
name = "launcher-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "launcher_gui"
path = "src/lib.rs"

[[bin]]
name = "better-launcher"
path = "src/main.rs"
test = false
bench = false

[dependencies]
app-catalog-core.workspace = true
app-catalog-platform.workspace = true
better-ui.workspace = true
launcher-core.workspace = true
launcher-platform.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
gpui-platform.workspace = true
serde.workspace = true
# Pins and history are written through a temporary file in the same folder,
# synced, then renamed over the old one.
tempfile.workspace = true

[dev-dependencies]
better-core.workspace = true
serde_json.workspace = true

[[bench]]
name = "launcher_suite"
harness = false
