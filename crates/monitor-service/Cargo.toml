[package]
name = "monitor-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "better-monitor-service"
path = "src/main.rs"

[lib]
name = "monitor_service"
path = "src/lib.rs"

[dependencies]
manager-store.workspace = true
monitor-collectors-linux.workspace = true
monitor-core.workspace = true
monitor-export.workspace = true
monitor-ipc.workspace = true
monitor-store.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
# zbus stays on its default async-io flavor everywhere in this workspace.
# Cargo unifies features across every package one `cargo build` names, and
# `packaging/build-deb.sh` builds the services and the windows together, so a
# single crate asking for zbus's `tokio` feature compiles it into every GUI as
# well. gpui's XDG desktop portal and accesskit both open their own zbus
# connections from plain threads that no tokio runtime owns, and the tokio
# flavor panics there with "there is no reactor running". See ticket 49.
zbus = { version = "5" }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
