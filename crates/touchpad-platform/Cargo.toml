[package]
name = "touchpad-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["dconf-write"]
# The write half of the GNOME backend: a `ca.desrt.dconf.Writer.Change` call
# over the session bus. On by default because a touchpad control centre that
# cannot change a setting is not the component; a consumer that only wants
# device enumeration, session detection, and reading can turn it off and link
# no D-Bus stack.
# The writer itself lives in `defaults-platform`, which Better Defaults shares.
dconf-write = ["defaults-platform/dconf-write", "dep:zbus"]

[[bin]]
name = "better-touchpad-before-removal"
path = "src/bin/before_removal.rs"
required-features = ["dconf-write"]

[dependencies]
# The one rule for which desktop a session is (`better_core::desktop`).
better-core.workspace = true
defaults-platform.workspace = true
touchpad-core.workspace = true
# The scroll pass-through's names and factor rule (ADR 0030); without its
# service feature this is the library alone.
touchpad-scroll.workspace = true
thiserror.workspace = true
# The pending restore and the undo file a removal keeps (ticket 88).
serde_json.workspace = true
# The scroll pass-through's client, on the system bus.
zbus = { workspace = true, optional = true }

[dev-dependencies]
# A missing program is a skip on a developer's machine and a failure
# under CI (ticket 177).
test-prerequisites.workspace = true
defaults-platform = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
# The integration tests speak the core vocabulary, which a dependency of the
# library is not automatically lent to them.
touchpad-core.workspace = true
# tests/scroll_bus.rs serves a fake pass-through on a private bus.
zbus.workspace = true
