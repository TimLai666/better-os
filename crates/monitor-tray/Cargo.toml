[package]
name = "monitor-tray"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "better-monitor-tray"
path = "src/main.rs"

[lib]
name = "monitor_tray"
path = "src/lib.rs"

[dependencies]
# The companion rule that finds the window (ticket 179).
better-core.workspace = true
monitor-core.workspace = true
# The battery's state and words, shared by every battery icon (ticket 170).
hardware-core.workspace = true
# The power mode, read the way the System page reads it (ticket 295).
hardware-platform.workspace = true
monitor-ipc.workspace = true
monitor-service.workspace = true
serde.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
# Default async-io flavor, as everywhere in this workspace (ticket 49).
zbus = { version = "5" }

[dev-dependencies]
# A missing program is a skip on a developer's machine and a failure
# under CI (ticket 177).
test-prerequisites.workspace = true
tempfile.workspace = true
# A stand-in power-profiles-daemon on a private bus.
hardware-platform = { workspace = true, features = ["test-support"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "test-util"] }
