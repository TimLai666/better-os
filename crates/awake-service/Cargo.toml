[package]
name = "awake-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "better-awake-service"
path = "src/main.rs"

[lib]
name = "awake_service"
path = "src/lib.rs"

[dependencies]
awake-platform.workspace = true
awake-core.workspace = true
awake-ipc.workspace = true
awake-store.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
# zbus stays on its default async-io flavor everywhere in this workspace.
# Cargo unifies features across every package one `cargo build` names, and
# `packaging/build-deb.sh` builds the services and the windows together, so a
# single crate asking for zbus's `tokio` feature compiles it into every GUI as
# well. gpui's XDG desktop portal and accesskit both open their own zbus
# connections from plain threads that no tokio runtime owns, and the tokio
# flavor panics there with "there is no reactor running". See ticket 49.
zbus = { version = "5" }

[features]
# A fake inhibitor backend and a fixed clock. Never enabled for the shipped
# binary: nothing in `main.rs` can construct them.
test-support = []

[dev-dependencies]
awake-service = { path = ".", features = ["test-support"] }
# The fixture builders that write a fake `/proc` and `/sys` node, so the
# battery-safety test drives the real providers against a captured tree rather
# than against whatever this machine happens to report.
awake-platform = { workspace = true, features = ["test-support"] }
better-core.workspace = true
tempfile.workspace = true
