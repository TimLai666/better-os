[package]
name = "manager-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "better-manager-daemon"
path = "src/main.rs"

[lib]
name = "manager_daemon"
path = "src/lib.rs"

[dependencies]
better-core.workspace = true
drive-mounts.workspace = true
hardware-core.workspace = true
libc.workspace = true
hardware-platform.workspace = true
manager-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "fs"] }
# zbus stays on its default async-io flavor everywhere in this workspace.
# Cargo unifies features across every package one `cargo build` names, and
# `packaging/build-deb.sh` builds the services and the windows together, so a
# single crate asking for zbus's `tokio` feature compiles it into every GUI as
# well. gpui's XDG desktop portal and accesskit both open their own zbus
# connections from plain threads that no tokio runtime owns, and the tokio
# flavor panics there with "there is no reactor running". See ticket 49.
zbus = { version = "5" }
zbus_polkit = { version = "5" }

[features]
# Fakes for the traits that touch the host or decide authorization. Never
# enabled for the shipped binary: nothing in `main.rs` can construct them.
test-support = ["hardware-core/test-support"]

[dev-dependencies]
# A missing program is a skip on a developer's machine and a failure
# under CI (ticket 177).
test-prerequisites.workspace = true
tempfile.workspace = true
hardware-core = { workspace = true, features = ["test-support"] }
hardware-platform = { workspace = true, features = ["test-support"] }
manager-daemon = { path = ".", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }

# Stand-ins for the System page's services on a private bus, for screenshots
# in a sandbox desktop (ticket 86). Not in any package.
[[example]]
name = "hardware_standin"
required-features = ["test-support"]

# A stand-in UDisks2 on the container end-to-end check's system bus (ticket
# 127). Not in any package.
[[example]]
name = "e2e_udisks"
required-features = ["test-support"]
