schema_version: 2
id: better-git
display_name: Better Git
# Enhancement is the closest existing type, not an exact one. Better Git is a
# standalone application: it replaces nothing and changes no other part of the
# system, so it declares neither `replaces` nor `enhances`. The schema has no
# standalone type, and a released Better Manager refuses a manifest with a type
# it does not know, so adding one is a schema change for its own ticket.
component_type: enhancement
version: 0.2.13
summary: Work with Git repositories and GitHub without a terminal, the way GitHub Desktop does.
# The icon set is closed in the same way and has no Git mark; generic is the
# value a component without a dedicated icon takes.
icon: generic
restart: application
targets:
  distributions: [zorin, ubuntu]
  releases: [22.04, 24.04]
  architectures: [amd64, arm64]
# Placeholder checksums until v0.2.13 is published. ADR 0002 records the
# checksum of a *published* release asset; the v0.2.12 values these variants
# carried describe 0.2.12's packages, not 0.2.13's. The real values are written
# back once the release is public and every asset has been re-downloaded and
# verified.
artifacts:
  - release: "22.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.13/better-git_0.2.13_ubuntu-22.04_amd64.deb
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    release_asset: better-git_0.2.13_ubuntu-22.04_amd64.deb
  - release: "22.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.13/better-git_0.2.13_ubuntu-22.04_arm64.deb
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    release_asset: better-git_0.2.13_ubuntu-22.04_arm64.deb
  - release: "24.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.13/better-git_0.2.13_ubuntu-24.04_amd64.deb
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    release_asset: better-git_0.2.13_ubuntu-24.04_amd64.deb
  - release: "24.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.13/better-git_0.2.13_ubuntu-24.04_arm64.deb
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    release_asset: better-git_0.2.13_ubuntu-24.04_arm64.deb
lifecycle:
  install: plan-local-apt-install
  enable: plan-enable
  disable: plan-disable
  remove: plan-remove
  rollback: plan-rollback
health_checks:
  - git-desktop-entry-check
  - git-executable-check
# No privileged part: Better Git never talks to better-manager-daemon, and
# every entry below is something the person's own session already allows.
permissions:
  - name: desktop-session
    reason: needs a graphical session, Wayland or X11
  - name: run-system-git
    reason: runs the system git with an argument vector and no shell, so the person's own configuration, credential helper, and SSH keys apply
  - name: repository-read-write
    reason: reads and changes files only in repositories the person opens, clones, or creates, and only after the person says they trust that repository
  - name: network-github
    reason: reaches GitHub (or the GitHub Enterprise server the person signs in to) for sign-in, pull requests, checks, issues, publishing, and forking, and git remotes for fetch, pull, and push
  - name: secret-service-keyring
    reason: keeps the GitHub sign-in token in the desktop keyring through the Secret Service, never in a file
  - name: desktop-trash
    reason: puts a copy of every discarded change in the desktop trash so it can be restored
paths:
  - /usr/bin/better-git
  - /usr/share/applications/io.betteros.Git.desktop
  - /usr/share/icons/hicolor/scalable/apps/better-git.svg
  - ~/.local/state/better-os/git-recent.json
  - ~/.local/state/better-os/git-repositories.json
  - ~/.local/state/better-os/git-trusted
  - ~/.config/better-os/git.json
release_notes:
  - Open a repository, see each changed file and its diff, stage or unstage it, and commit with a summary and description.
  - Every operation is the system git, which the package depends on. Better Git keeps no copy of your credentials and links no Git library.
  - Removing the component removes the package, its desktop entry, and its icon. The list of recently opened repositories is left in place.
