schema_version: 2
id: better-launcher
display_name: Better Launcher
component_type: enhancement
version: 0.2.3
summary: One overlay with the search row on top and the whole application library below it.
icon: launcher
restart: application
targets:
  distributions: [zorin, ubuntu]
  releases: [22.04, 24.04]
  architectures: [amd64, arm64]
# Enhancement, not replacement, and deliberately so. Installing Better Launcher
# leaves the GNOME application overview exactly where it was; the overview stays
# the recoverable entry path until the health checks pass and the user chooses
# the replacement themselves.
enhances:
  - org.gnome.Shell
# The checksums below belong to the published v0.2.3 release assets. Each one
# was re-hashed from the package downloaded back from the public release rather
# than copied from its sidecar, which is what ADR 0002 requires a manifest to
# record.
artifacts:
  - release: "22.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.3/better-launcher_0.2.3_ubuntu-22.04_amd64.deb
    sha256: 4d135783a19526fc719afd1bed463789a2bd4563ad0542b196fa6468828baddb
    release_asset: better-launcher_0.2.3_ubuntu-22.04_amd64.deb
  - release: "22.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.3/better-launcher_0.2.3_ubuntu-22.04_arm64.deb
    sha256: f2e06c61143f92c2f6f87090adff8bb0b5b8bb913951316ae10d518c9b651e08
    release_asset: better-launcher_0.2.3_ubuntu-22.04_arm64.deb
  - release: "24.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.3/better-launcher_0.2.3_ubuntu-24.04_amd64.deb
    sha256: b17b5dea77dc743dbf7dc48637be8cdb5bc9c6d7e1818af5b6f7666b4f4b57cd
    release_asset: better-launcher_0.2.3_ubuntu-24.04_amd64.deb
  - release: "24.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.3/better-launcher_0.2.3_ubuntu-24.04_arm64.deb
    sha256: fdfd93fe1240828290a64ec32b3c7ac16bba97cac02e1f534f5f2174786db511
    release_asset: better-launcher_0.2.3_ubuntu-24.04_arm64.deb
lifecycle:
  install: plan-local-apt-install
  enable: plan-enable
  disable: plan-disable
  remove: plan-remove
  rollback: plan-rollback
health_checks:
  - launcher-desktop-entry-check
  - launcher-index-build-check
  - launcher-activation-name-check
# Every definition below names the workload the harness actually builds and the
# number it actually prints. `cargo bench -p launcher-gui --bench launcher_suite`
# is the harness; `docs/launcher-performance.md` records the measurements and the
# hardware. `launcher_gui::BENCHMARKS` holds the same five rows and a test fails
# if this list drifts from it, so a promised measurement cannot outlive the code
# that takes it.
benchmarks:
  - name: warm-search-update
    workload: synthetic-5000-entry-xdg-directory-keystroke-script
    metric: milliseconds-p95-keystroke-to-updated-result-model
    minimum_improvement_percent: 0
    maximum_regression_percent: 0
  - name: warm-overlay-open
    workload: headless-process-start-with-warm-5000-entry-index
    metric: milliseconds-process-start-to-first-renderable-model
    minimum_improvement_percent: 0
    maximum_regression_percent: 5
  - name: application-list-update
    workload: write-then-remove-one-desktop-entry-under-watch
    metric: milliseconds-p95-filesystem-event-to-refreshed-model
    minimum_improvement_percent: 0
    maximum_regression_percent: 5
  - name: idle-overhead
    workload: headless-overlay-idle-for-a-measured-window
    metric: cpu-percent-over-the-idle-window
    minimum_improvement_percent: 0
    maximum_regression_percent: 1
  - name: idle-memory
    workload: headless-overlay-idle-for-a-measured-window
    metric: resident-kilobytes-at-the-end-of-the-idle-window
    minimum_improvement_percent: 0
    maximum_regression_percent: 5
permissions:
  - name: desktop-session
    reason: needs a graphical session, Wayland or X11; no compositor extension is installed
  - name: application-metadata-read
    reason: reads XDG desktop entries and watches those directories for changes
  - name: session-bus-name
    reason: owns org.betteros.Launcher1 so a second launch toggles the running overlay
  - name: gnome-keyboard-shortcut
    reason: optional global shortcut carried by GNOME custom-keybinding settings, applied by Better Defaults
  - name: gesture-adapter
    reason: optional five-finger adapter; none ships in this version, see ADR 0008
paths:
  - /usr/bin/better-launcher
  - /usr/share/applications/better-launcher.desktop
  - /usr/share/icons/hicolor/scalable/apps/better-launcher.svg
  - /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/better-launcher/name
  - /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/better-launcher/command
  - /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/better-launcher/binding
  - org.gnome.settings-daemon.plugins.media-keys custom-keybindings
release_notes:
  - One overlay with two query-driven states, keyboard-operable end to end.
  - Rollback removes the package and the desktop entry, and drops this component's own custom-keybinding path from the GNOME shortcut list. The GNOME application overview is never removed, so the previous entry path is always available.
  - No production five-finger gesture adapter ships in this version. See ADR 0008.
