schema_version: 2
id: better-manager
display_name: Better Manager
component_type: diagnostic
version: 0.2.7
summary: Installs, updates, verifies, and rolls back every Better OS component.
icon: manager
# Better Manager is a component in its own catalog, so updating it replaces the
# package the running window came from. apt handles the in-flight replacement —
# the process keeps the file it already opened — but the window on screen stays
# on the old version until it is opened again, so the requirement is a restart
# of the application and not "none".
restart: application
targets:
  distributions: [zorin, ubuntu]
  releases: [22.04, 24.04]
  architectures: [amd64, arm64]
# The checksums below belong to the published v0.2.7 release assets. Each one
# was re-hashed from the package downloaded back from the public release rather
# than copied from its sidecar, which is what ADR 0002 requires a manifest to
# record.
artifacts:
  - release: "22.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.7/better-manager_0.2.7_ubuntu-22.04_amd64.deb
    sha256: 638e581c480902a843f642ebd9baba6b3ec0a2e034e11b94d5f915ff32220a4d
    release_asset: better-manager_0.2.7_ubuntu-22.04_amd64.deb
  - release: "22.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.7/better-manager_0.2.7_ubuntu-22.04_arm64.deb
    sha256: c430e1ad9f9f624fffd7678828be93194dd7faadb24eec3f13cf8b37de4a6552
    release_asset: better-manager_0.2.7_ubuntu-22.04_arm64.deb
  - release: "24.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.7/better-manager_0.2.7_ubuntu-24.04_amd64.deb
    sha256: df617510cbb235657835e3a76422ad9833a102b4afea0c02f6a63ad1a875e687
    release_asset: better-manager_0.2.7_ubuntu-24.04_amd64.deb
  - release: "24.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.7/better-manager_0.2.7_ubuntu-24.04_arm64.deb
    sha256: f290a00a14f1b587c0a703aedcdfb355a306dadebed7a59f4a1ccd83dc522336
    release_asset: better-manager_0.2.7_ubuntu-24.04_arm64.deb
lifecycle:
  install: plan-local-apt-install
  enable: plan-enable
  disable: plan-disable
  remove: plan-remove
  rollback: plan-rollback
health_checks:
  - manager-core-self-check
benchmarks: []
permissions:
  - name: package-management
    reason: future privileged boundary, not executed by this scaffold
paths:
  - /usr/bin/better-manager
  # The window had no menu entry at all until now, so an installed Better
  # Manager was only reachable from a terminal. The icon is a file rather than
  # a theme name with nothing behind it, which is what draws a blank tile.
  - /usr/share/applications/io.betteros.Manager.desktop
  - /usr/share/icons/hicolor/scalable/apps/better-manager.svg
