schema_version: 2
id: better-manager
display_name: Better Manager
component_type: diagnostic
version: 0.2.9
summary: Installs, updates, verifies, and rolls back every Better OS component.
icon: manager
# Better Manager is a component in its own catalog, so updating it replaces the
# package the running window came from. apt handles the in-flight replacement —
# the process keeps the file it already opened — but the window on screen stays
# on the old version until it is opened again, so the requirement is a restart
# of the application and not "none".
restart: application
targets:
  distributions: [zorin, ubuntu]
  releases: [22.04, 24.04]
  architectures: [amd64, arm64]
# The checksums below belong to the published v0.2.9 release assets. Each one
# was re-hashed from the package downloaded back from the public release rather
# than copied from its sidecar, which is what ADR 0002 requires a manifest to
# record.
artifacts:
  - release: "22.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.9/better-manager_0.2.9_ubuntu-22.04_amd64.deb
    sha256: 6e92c38a8ea1a29f51cd5878b4c9bb2e3833e18741407da668b607a3af843585
    release_asset: better-manager_0.2.9_ubuntu-22.04_amd64.deb
  - release: "22.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.9/better-manager_0.2.9_ubuntu-22.04_arm64.deb
    sha256: 3395ed62e0b5dd3096bc5cdbc66ee0ff7350230a1bb3204b4bc7c129e7e86c42
    release_asset: better-manager_0.2.9_ubuntu-22.04_arm64.deb
  - release: "24.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.9/better-manager_0.2.9_ubuntu-24.04_amd64.deb
    sha256: 0303929a3ee56f9173bdf393044d7c0a9eaef5aa63baf85fe158276eb7697acd
    release_asset: better-manager_0.2.9_ubuntu-24.04_amd64.deb
  - release: "24.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.9/better-manager_0.2.9_ubuntu-24.04_arm64.deb
    sha256: 3f9774c35afb97ad973317e5bae48be0f7e6c74e6753bf7301547a6b1ce74ce1
    release_asset: better-manager_0.2.9_ubuntu-24.04_arm64.deb
lifecycle:
  install: plan-local-apt-install
  enable: plan-enable
  disable: plan-disable
  remove: plan-remove
  rollback: plan-rollback
health_checks:
  - manager-core-self-check
benchmarks: []
permissions:
  - name: package-management
    reason: future privileged boundary, not executed by this scaffold
paths:
  - /usr/bin/better-manager
  # The window had no menu entry at all until now, so an installed Better
  # Manager was only reachable from a terminal. The icon is a file rather than
  # a theme name with nothing behind it, which is what draws a blank tile.
  - /usr/share/applications/io.betteros.Manager.desktop
  - /usr/share/icons/hicolor/scalable/apps/better-manager.svg
