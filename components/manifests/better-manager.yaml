schema_version: 2
id: better-manager
display_name: Better Manager
component_type: diagnostic
version: 0.2.11
summary: Installs, updates, verifies, and rolls back every Better OS component.
icon: manager
# Better Manager is a component in its own catalog, so updating it replaces the
# package the running window came from. apt handles the in-flight replacement —
# the process keeps the file it already opened — but the window on screen stays
# on the old version until it is opened again, so the requirement is a restart
# of the application and not "none".
restart: application
targets:
  distributions: [zorin, ubuntu]
  releases: [22.04, 24.04]
  architectures: [amd64, arm64]
# The checksums below belong to the published v0.2.11 release assets. Each one
# was re-hashed from the package downloaded back from the public release rather
# than copied from its sidecar, which is what ADR 0002 requires a manifest to
# record.
artifacts:
  - release: "22.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.11/better-manager_0.2.11_ubuntu-22.04_amd64.deb
    sha256: 7fd98772cdbfc70f920647e8f2a50c54bb329f31bd940229e888ef2b212510b8
    release_asset: better-manager_0.2.11_ubuntu-22.04_amd64.deb
  - release: "22.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.11/better-manager_0.2.11_ubuntu-22.04_arm64.deb
    sha256: 003ec66b25cab465bedb722dc68b4dbc6a1c34f0278018dd2bfcde3e33570309
    release_asset: better-manager_0.2.11_ubuntu-22.04_arm64.deb
  - release: "24.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.11/better-manager_0.2.11_ubuntu-24.04_amd64.deb
    sha256: e4ecccc3f7dcb9b11c23f2706d8540d3d4d4bb0720ac0fc93bede95c7d2a8ced
    release_asset: better-manager_0.2.11_ubuntu-24.04_amd64.deb
  - release: "24.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.11/better-manager_0.2.11_ubuntu-24.04_arm64.deb
    sha256: 8ece4fffd849a81d180e0e68d87e2fc8fb4209440e4a5fdaf6fadd2d4ef58bff
    release_asset: better-manager_0.2.11_ubuntu-24.04_arm64.deb
lifecycle:
  install: plan-local-apt-install
  enable: plan-enable
  disable: plan-disable
  remove: plan-remove
  rollback: plan-rollback
health_checks:
  - manager-core-self-check
benchmarks: []
permissions:
  - name: package-management
    reason: future privileged boundary, not executed by this scaffold
paths:
  - /usr/bin/better-manager
  # The window had no menu entry at all until now, so an installed Better
  # Manager was only reachable from a terminal. The icon is a file rather than
  # a theme name with nothing behind it, which is what draws a blank tile.
  - /usr/share/applications/io.betteros.Manager.desktop
  - /usr/share/icons/hicolor/scalable/apps/better-manager.svg
