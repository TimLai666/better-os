schema_version: 2
id: better-manager
display_name: Better Manager
component_type: diagnostic
version: 0.2.5
summary: Installs, updates, verifies, and rolls back every Better OS component.
icon: manager
# Better Manager is a component in its own catalog, so updating it replaces the
# package the running window came from. apt handles the in-flight replacement —
# the process keeps the file it already opened — but the window on screen stays
# on the old version until it is opened again, so the requirement is a restart
# of the application and not "none".
restart: application
targets:
  distributions: [zorin, ubuntu]
  releases: [22.04, 24.04]
  architectures: [amd64, arm64]
# Placeholder checksums until v0.2.5 is published. ADR 0002 records the
# checksum of a *published* release asset; the v0.2.4 values these variants
# carried describe 0.2.4's packages, not 0.2.5's. The real values are written
# back once the release is public and every asset has been re-downloaded and
# verified.
artifacts:
  - release: "22.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.5/better-manager_0.2.5_ubuntu-22.04_amd64.deb
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    release_asset: better-manager_0.2.5_ubuntu-22.04_amd64.deb
  - release: "22.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.5/better-manager_0.2.5_ubuntu-22.04_arm64.deb
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    release_asset: better-manager_0.2.5_ubuntu-22.04_arm64.deb
  - release: "24.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.5/better-manager_0.2.5_ubuntu-24.04_amd64.deb
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    release_asset: better-manager_0.2.5_ubuntu-24.04_amd64.deb
  - release: "24.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.5/better-manager_0.2.5_ubuntu-24.04_arm64.deb
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    release_asset: better-manager_0.2.5_ubuntu-24.04_arm64.deb
lifecycle:
  install: plan-local-apt-install
  enable: plan-enable
  disable: plan-disable
  remove: plan-remove
  rollback: plan-rollback
health_checks:
  - manager-core-self-check
benchmarks: []
permissions:
  - name: package-management
    reason: future privileged boundary, not executed by this scaffold
paths:
  - /usr/bin/better-manager
  # The window had no menu entry at all until now, so an installed Better
  # Manager was only reachable from a terminal. The icon is a file rather than
  # a theme name with nothing behind it, which is what draws a blank tile.
  - /usr/share/applications/io.betteros.Manager.desktop
  - /usr/share/icons/hicolor/scalable/apps/better-manager.svg
