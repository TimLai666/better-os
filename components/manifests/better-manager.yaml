schema_version: 2
id: better-manager
display_name: Better Manager
component_type: diagnostic
version: 0.2.13
summary: Installs, updates, verifies, and rolls back every Better OS component.
icon: manager
# Better Manager is a component in its own catalog, so updating it replaces the
# package the running window came from. apt handles the in-flight replacement —
# the process keeps the file it already opened — but the window on screen stays
# on the old version until it is opened again, so the requirement is a restart
# of the application and not "none".
restart: application
targets:
  distributions: [zorin, ubuntu]
  releases: [22.04, 24.04]
  architectures: [amd64, arm64]
# The checksums below belong to the published v0.2.13 release assets. Each one
# was re-hashed from the package downloaded back from the public release rather
# than copied from its sidecar, which is what ADR 0002 requires a manifest to
# record.
artifacts:
  - release: "22.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.13/better-manager_0.2.13_ubuntu-22.04_amd64.deb
    sha256: dff73591eb5566f104ceb4bb082ed796a25fe449d16f7099ca754382a3f8942b
    release_asset: better-manager_0.2.13_ubuntu-22.04_amd64.deb
  - release: "22.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.13/better-manager_0.2.13_ubuntu-22.04_arm64.deb
    sha256: 026ea858c133594e05fd4ef1d2173dd45379bc170c2136a3786b4d3e64759149
    release_asset: better-manager_0.2.13_ubuntu-22.04_arm64.deb
  - release: "24.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.13/better-manager_0.2.13_ubuntu-24.04_amd64.deb
    sha256: b9659506c74b40892689e4b447f44995c43292fbee284459d0ce8e51d8e06fed
    release_asset: better-manager_0.2.13_ubuntu-24.04_amd64.deb
  - release: "24.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.13/better-manager_0.2.13_ubuntu-24.04_arm64.deb
    sha256: c66fc1768cefa6d9593850a2974db9bbb02d20ee801528151a59e3fe6faff4f9
    release_asset: better-manager_0.2.13_ubuntu-24.04_arm64.deb
lifecycle:
  install: plan-local-apt-install
  enable: plan-enable
  disable: plan-disable
  remove: plan-remove
  rollback: plan-rollback
health_checks:
  - manager-core-self-check
benchmarks: []
permissions:
  - name: package-management
    reason: future privileged boundary, not executed by this scaffold
paths:
  - /usr/bin/better-manager
  # The window had no menu entry at all until now, so an installed Better
  # Manager was only reachable from a terminal. The icon is a file rather than
  # a theme name with nothing behind it, which is what draws a blank tile.
  - /usr/share/applications/io.betteros.Manager.desktop
  - /usr/share/icons/hicolor/scalable/apps/better-manager.svg
  # The window attention service behind the Window attention page (ticket
  # 106, ADR 0018). Its GNOME Shell extension ships in better-shell-adapter,
  # which this package recommends and which is not a catalog component.
  - /usr/libexec/better-window-attention
  - /usr/lib/systemd/user/better-window-attention.service
  - /usr/share/dbus-1/services/org.betteros.WindowAttention1.service
