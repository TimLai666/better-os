schema_version: 2
id: better-manager
display_name: Better Manager
component_type: diagnostic
version: 0.2.17
summary: Installs, updates, verifies, and rolls back every Better OS component.
icon: manager
# Better Manager is a component in its own catalog, so updating it replaces the
# package the running window came from. apt handles the in-flight replacement —
# the process keeps the file it already opened — but the window on screen stays
# on the old version until it is opened again, so the requirement is a restart
# of the application and not "none".
restart: application
targets:
  distributions: [zorin, ubuntu]
  releases: [22.04, 24.04]
  architectures: [amd64, arm64]
# Placeholder checksums until v0.2.17 is published. ADR 0002 records the
# checksum of a *published* release asset; the v0.2.16 values these variants
# carried describe 0.2.16's packages, not 0.2.17's. The real values are written
# back once the release is public and every asset has been re-downloaded and
# verified.
artifacts:
  - release: "22.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.17/better-manager_0.2.17_ubuntu-22.04_amd64.deb
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    release_asset: better-manager_0.2.17_ubuntu-22.04_amd64.deb
    companions:
      - package: better-shell-adapter
        url: https://github.com/TimLai666/better-os/releases/download/v0.2.17/better-shell-adapter_0.2.17_ubuntu-22.04_amd64.deb
        sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        release_asset: better-shell-adapter_0.2.17_ubuntu-22.04_amd64.deb
      - package: better-manager-daemon
        url: https://github.com/TimLai666/better-os/releases/download/v0.2.17/better-manager-daemon_0.2.17_ubuntu-22.04_amd64.deb
        sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        release_asset: better-manager-daemon_0.2.17_ubuntu-22.04_amd64.deb
  - release: "22.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.17/better-manager_0.2.17_ubuntu-22.04_arm64.deb
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    release_asset: better-manager_0.2.17_ubuntu-22.04_arm64.deb
    companions:
      - package: better-shell-adapter
        url: https://github.com/TimLai666/better-os/releases/download/v0.2.17/better-shell-adapter_0.2.17_ubuntu-22.04_arm64.deb
        sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        release_asset: better-shell-adapter_0.2.17_ubuntu-22.04_arm64.deb
