schema_version: 2
id: better-manager
display_name: Better Manager
component_type: diagnostic
version: 0.2.12
summary: Installs, updates, verifies, and rolls back every Better OS component.
icon: manager
# Better Manager is a component in its own catalog, so updating it replaces the
# package the running window came from. apt handles the in-flight replacement —
# the process keeps the file it already opened — but the window on screen stays
# on the old version until it is opened again, so the requirement is a restart
# of the application and not "none".
restart: application
targets:
  distributions: [zorin, ubuntu]
  releases: [22.04, 24.04]
  architectures: [amd64, arm64]
# The checksums below belong to the published v0.2.12 release assets. Each one
# was re-hashed from the package downloaded back from the public release rather
# than copied from its sidecar, which is what ADR 0002 requires a manifest to
# record.
artifacts:
  - release: "22.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.12/better-manager_0.2.12_ubuntu-22.04_amd64.deb
    sha256: aac0c057ba765cfa311bf6b2d78e4a21af2f89a14ee7ce6af355be6ab69a1294
    release_asset: better-manager_0.2.12_ubuntu-22.04_amd64.deb
  - release: "22.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.12/better-manager_0.2.12_ubuntu-22.04_arm64.deb
    sha256: 46e0cc6a2650bdb096720b86a85b697af55478d1f36a5b7c8d9869e8b782980d
    release_asset: better-manager_0.2.12_ubuntu-22.04_arm64.deb
  - release: "24.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.12/better-manager_0.2.12_ubuntu-24.04_amd64.deb
    sha256: e04e74b82bac3f7577e3af6fb4969b2fa91aa9509ea87ebb83874ce801eb6738
    release_asset: better-manager_0.2.12_ubuntu-24.04_amd64.deb
  - release: "24.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.12/better-manager_0.2.12_ubuntu-24.04_arm64.deb
    sha256: 879c14635f338613dd33716f1d77f816fd652fea95280c66c91b7e869a130faf
    release_asset: better-manager_0.2.12_ubuntu-24.04_arm64.deb
lifecycle:
  install: plan-local-apt-install
  enable: plan-enable
  disable: plan-disable
  remove: plan-remove
  rollback: plan-rollback
health_checks:
  - manager-core-self-check
benchmarks: []
permissions:
  - name: package-management
    reason: future privileged boundary, not executed by this scaffold
paths:
  - /usr/bin/better-manager
  # The window had no menu entry at all until now, so an installed Better
  # Manager was only reachable from a terminal. The icon is a file rather than
  # a theme name with nothing behind it, which is what draws a blank tile.
  - /usr/share/applications/io.betteros.Manager.desktop
  - /usr/share/icons/hicolor/scalable/apps/better-manager.svg
