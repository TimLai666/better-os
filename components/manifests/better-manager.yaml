schema_version: 2
id: better-manager
display_name: Better Manager
component_type: diagnostic
version: 0.2.8
summary: Installs, updates, verifies, and rolls back every Better OS component.
icon: manager
# Better Manager is a component in its own catalog, so updating it replaces the
# package the running window came from. apt handles the in-flight replacement —
# the process keeps the file it already opened — but the window on screen stays
# on the old version until it is opened again, so the requirement is a restart
# of the application and not "none".
restart: application
targets:
  distributions: [zorin, ubuntu]
  releases: [22.04, 24.04]
  architectures: [amd64, arm64]
# The checksums below belong to the published v0.2.8 release assets. Each one
# was re-hashed from the package downloaded back from the public release rather
# than copied from its sidecar, which is what ADR 0002 requires a manifest to
# record.
artifacts:
  - release: "22.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.8/better-manager_0.2.8_ubuntu-22.04_amd64.deb
    sha256: ee516d828dd43608bc0323abdfaa223e56bfbceb8a525934250d3ad24750f166
    release_asset: better-manager_0.2.8_ubuntu-22.04_amd64.deb
  - release: "22.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.8/better-manager_0.2.8_ubuntu-22.04_arm64.deb
    sha256: 49fab6607ed3ffcdbccb951e23207827ba743d8aa7e34c981d904f65cd948f99
    release_asset: better-manager_0.2.8_ubuntu-22.04_arm64.deb
  - release: "24.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.8/better-manager_0.2.8_ubuntu-24.04_amd64.deb
    sha256: 4e3b7a5a41d5ad3d1271c0fbe553db47ea899fe0d4f9b9708acb962311619b57
    release_asset: better-manager_0.2.8_ubuntu-24.04_amd64.deb
  - release: "24.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.8/better-manager_0.2.8_ubuntu-24.04_arm64.deb
    sha256: 1ec5abfe84781da0f2d3035d914e7cf7eb15357614f175028a40acdadf2451b0
    release_asset: better-manager_0.2.8_ubuntu-24.04_arm64.deb
lifecycle:
  install: plan-local-apt-install
  enable: plan-enable
  disable: plan-disable
  remove: plan-remove
  rollback: plan-rollback
health_checks:
  - manager-core-self-check
benchmarks: []
permissions:
  - name: package-management
    reason: future privileged boundary, not executed by this scaffold
paths:
  - /usr/bin/better-manager
  # The window had no menu entry at all until now, so an installed Better
  # Manager was only reachable from a terminal. The icon is a file rather than
  # a theme name with nothing behind it, which is what draws a blank tile.
  - /usr/share/applications/io.betteros.Manager.desktop
  - /usr/share/icons/hicolor/scalable/apps/better-manager.svg
