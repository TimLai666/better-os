lifecycle:
  install: plan-local-apt-install
  enable: plan-enable
  disable: plan-disable
  remove: plan-remove
  rollback: plan-rollback
health_checks:
  - manager-core-self-check
benchmarks: []
permissions:
  - name: package-management
    reason: future privileged boundary, not executed by this scaffold
paths:
  - /usr/bin/better-manager
  # The window had no menu entry at all until now, so an installed Better
  # Manager was only reachable from a terminal. The icon is a file rather than
  # a theme name with nothing behind it, which is what draws a blank tile.
  - /usr/share/applications/io.betteros.Manager.desktop
  - /usr/share/icons/hicolor/scalable/apps/better-manager.svg
  # The window attention service behind the Window attention page (ticket
  # 106, ADR 0018). Its GNOME Shell extension ships in better-shell-adapter,
  # which this package recommends and which is not a catalog component.
  - /usr/libexec/better-window-attention
  - /usr/lib/systemd/user/better-window-attention.service
  - /usr/share/dbus-1/services/org.betteros.WindowAttention1.service
  # The System page's "Switch power mode with the charger" choice (ticket 86),
  # the person's own data, read by better-window-attention at each plug event.
  - ~/.config/better-os/power-follow.json
  # The keyboard colour the person chose on the System page (ticket 136, ADR
  # 0034). Machine state like the charge limit, kept by better-manager-daemon
  # for its boot-time restore; the daemon package's removal gives the
  # keyboard back to its firmware and deletes it.
  - /var/lib/better-os/keyboard-lighting.json
  # Better Patch, the Fixes page (ticket 90). The before-removal program the
  # package's prerm runs as each person undoes every applied fix that has an
  # undo and deletes the record; the set-aside file is what an abandoned
  # removal puts back, deleted by the postrm; the location file says where
  # the record and the overrides are when XDG_STATE_HOME or XDG_DATA_HOME is
  # not the default.
  - /usr/lib/better-os/before-removal/better-manager
  - ~/.local/state/better-os/fixes.json
  - ~/.local/state/better-os/fixes-removal-undo.json
  - ~/.local/state/better-os/fixes-location.json
  # What an interrupted write of each can leave beside it; the postrm
  # deletes these too.
  - ~/.local/state/better-os/.fixes.json.tmp
  - ~/.local/state/better-os/fixes-removal-undo.json.tmp
  - ~/.local/state/better-os/fixes-location.json.tmp
