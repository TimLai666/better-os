schema_version: 2
id: better-monitor
display_name: Better Monitor
component_type: diagnostic
version: 0.1.0
summary: Low-cost desktop observation with samples, incidents, and export.
icon: monitor
restart: application
targets:
  distributions: [zorin, ubuntu]
  releases: [22.04, 24.04]
  architectures: [amd64, arm64]
enhances:
  - gnome-system-monitor
artifacts:
  - release: "22.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.1.0/better-monitor_0.1.0_ubuntu-22.04_amd64.deb
    sha256: 7250158e15872ca3bbf219ab4f00132c9f99bdad1f1473cc7590fa2bcae6ec73
    release_asset: better-monitor_0.1.0_ubuntu-22.04_amd64.deb
  - release: "22.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.1.0/better-monitor_0.1.0_ubuntu-22.04_arm64.deb
    sha256: 2dea7609809c84dba2ba784096d55d29e7edd2479bf07c930db60c552597bac3
    release_asset: better-monitor_0.1.0_ubuntu-22.04_arm64.deb
  - release: "24.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.1.0/better-monitor_0.1.0_ubuntu-24.04_amd64.deb
    sha256: 28a7946a1f3a5269034b15ca4f329181dddd18cabb8f6b9577c30aefb3b0eec4
    release_asset: better-monitor_0.1.0_ubuntu-24.04_amd64.deb
  - release: "24.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.1.0/better-monitor_0.1.0_ubuntu-24.04_arm64.deb
    sha256: f62a5114fafbc08a2bdeed283206d20e94865281bb18a5d384821b511b3fe904
    release_asset: better-monitor_0.1.0_ubuntu-24.04_arm64.deb
lifecycle:
  install: plan-local-apt-install
  enable: plan-enable
  disable: plan-disable
  remove: plan-remove
  rollback: plan-rollback
health_checks:
  - monitor-core-self-check
benchmarks:
  - name: idle-overhead
    workload: desktop-idle
    metric: cpu-percent
    minimum_improvement_percent: 0
    maximum_regression_percent: 1
permissions:
  - name: procfs-read
    reason: future low-cost observation collector
paths:
  - /usr/bin/better-monitor
  - /var/lib/better-os/monitor
