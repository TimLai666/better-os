schema_version: 2
id: better-monitor
display_name: Better Monitor
component_type: diagnostic
version: 0.2.2
summary: Low-cost desktop observation with samples, incidents, and export.
icon: monitor
restart: application
targets:
  distributions: [zorin, ubuntu]
  releases: [22.04, 24.04]
  architectures: [amd64, arm64]
enhances:
  - gnome-system-monitor
# The package changed shape at 0.2.0: v0.1.0 shipped the window alone, and
# ticket 36 put the session service, the command line, and the systemd user
# unit into the same package, so the wider payload took its own version number
# rather than reusing 0.1.0.
# The checksums below belong to the published v0.2.2 release assets. Each one
# was re-hashed from the package downloaded back from the public release rather
# than copied from its sidecar, which is what ADR 0002 requires a manifest to
# record.
artifacts:
  - release: "22.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.2/better-monitor_0.2.2_ubuntu-22.04_amd64.deb
    sha256: d5343418bd53260741b658453a5704c54ccb8bbe34a20f79156572964cb476f2
    release_asset: better-monitor_0.2.2_ubuntu-22.04_amd64.deb
  - release: "22.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.2/better-monitor_0.2.2_ubuntu-22.04_arm64.deb
    sha256: 0044c2e5e002b10bcde137d37104a8872e423a1827556f3a06aeba574a318d74
    release_asset: better-monitor_0.2.2_ubuntu-22.04_arm64.deb
  - release: "24.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.2/better-monitor_0.2.2_ubuntu-24.04_amd64.deb
    sha256: 5e2a233c40dcfe994b4ff8260ed43bc323879f35ee658c7288e4572ae44a504f
    release_asset: better-monitor_0.2.2_ubuntu-24.04_amd64.deb
  - release: "24.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.2/better-monitor_0.2.2_ubuntu-24.04_arm64.deb
    sha256: fc6dc288854888ffd928ca4b39a5cd0f96c3534e63b6638ea4fbe85d5b83a869
    release_asset: better-monitor_0.2.2_ubuntu-24.04_arm64.deb
lifecycle:
  install: plan-local-apt-install
  enable: plan-enable
  disable: plan-disable
  remove: plan-remove
  rollback: plan-rollback
health_checks:
  - monitor-core-self-check
benchmarks:
  - name: idle-overhead
    workload: desktop-idle
    metric: cpu-percent
    minimum_improvement_percent: 0
    maximum_regression_percent: 1
permissions:
  - name: procfs-read
    reason: future low-cost observation collector
paths:
  # /usr/bin/better-monitor is the window, because that is what the published
  # v0.1.0 package installed. The command line is installed beside it as
  # better-monitor-cli even though its own --help says `better-monitor`; the
  # collision and what resolving it would cost are in ticket 36.
  - /usr/bin/better-monitor
  - /usr/bin/better-monitor-service
  - /usr/bin/better-monitor-cli
  - /usr/lib/systemd/user/better-monitor.service
  - /var/lib/better-os/monitor
