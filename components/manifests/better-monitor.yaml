schema_version: 2
id: better-monitor
display_name: Better Monitor
component_type: diagnostic
version: 0.2.13
summary: Low-cost desktop observation with samples, incidents, and export.
icon: monitor
restart: application
targets:
  distributions: [zorin, ubuntu]
  releases: [22.04, 24.04]
  architectures: [amd64, arm64]
enhances:
  - gnome-system-monitor
# The package changed shape at 0.2.0: v0.1.0 shipped the window alone, and
# ticket 36 put the session service, the command line, and the systemd user
# unit into the same package, so the wider payload took its own version number
# rather than reusing 0.1.0.
# The checksums below belong to the published v0.2.13 release assets. Each one
# was re-hashed from the package downloaded back from the public release rather
# than copied from its sidecar, which is what ADR 0002 requires a manifest to
# record.
artifacts:
  - release: "22.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.13/better-monitor_0.2.13_ubuntu-22.04_amd64.deb
    sha256: 0dc3b0f47e705d5361e083493dc55a50404cd53dd7bea01e41cfc7b7c26a6c74
    release_asset: better-monitor_0.2.13_ubuntu-22.04_amd64.deb
  - release: "22.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.13/better-monitor_0.2.13_ubuntu-22.04_arm64.deb
    sha256: 9be5d12bce949aec8f176dcc5adeafc9923614e05c919b2b4c53df59d338ac1d
    release_asset: better-monitor_0.2.13_ubuntu-22.04_arm64.deb
  - release: "24.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.13/better-monitor_0.2.13_ubuntu-24.04_amd64.deb
    sha256: eb00cc26012221b2716bac59ba0a6de804cb810651dd05877a8c6ac0a81f6083
    release_asset: better-monitor_0.2.13_ubuntu-24.04_amd64.deb
  - release: "24.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.13/better-monitor_0.2.13_ubuntu-24.04_arm64.deb
    sha256: 4c59d745629cd63270fd092bbc4838d5665c92f08fe1e08b7d8ab6a6ffe389c0
    release_asset: better-monitor_0.2.13_ubuntu-24.04_arm64.deb
lifecycle:
  install: plan-local-apt-install
  enable: plan-enable
  disable: plan-disable
  remove: plan-remove
  rollback: plan-rollback
health_checks:
  - monitor-core-self-check
benchmarks:
  - name: idle-overhead
    workload: desktop-idle
    metric: cpu-percent
    minimum_improvement_percent: 0
    maximum_regression_percent: 1
permissions:
  - name: procfs-read
    reason: future low-cost observation collector
paths:
  # /usr/bin/better-monitor is the window, because that is what the published
  # v0.1.0 package installed. The command line is installed beside it as
  # better-monitor-cli and calls itself that, and the window refuses the
  # command line's arguments and names it (ticket 60).
  - /usr/bin/better-monitor
  - /usr/bin/better-monitor-service
  - /usr/bin/better-monitor-cli
  # The taskbar item (ticket 97): a user unit enabled and disabled with the
  # component, which the window starts through its activation file.
  - /usr/bin/better-monitor-tray
  - /usr/lib/systemd/user/better-monitor-tray.service
  - /usr/share/dbus-1/services/org.betteros.MonitorTray1.service
  - /usr/lib/systemd/user/better-monitor.service
  # Asking for org.betteros.Monitor1 starts the service through its unit.
  - /usr/share/dbus-1/services/org.betteros.Monitor1.service
  # The desktop entry launches the window and neither of the other two
  # executables: the service is started by the user unit, and the command line
  # has no window to show.
  - /usr/share/applications/io.betteros.Monitor.desktop
  - /usr/share/icons/hicolor/scalable/apps/better-monitor.svg
  - /var/lib/better-os/monitor
