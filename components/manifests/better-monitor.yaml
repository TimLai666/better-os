schema_version: 2
id: better-monitor
display_name: Better Monitor
component_type: diagnostic
version: 0.2.7
summary: Low-cost desktop observation with samples, incidents, and export.
icon: monitor
restart: application
targets:
  distributions: [zorin, ubuntu]
  releases: [22.04, 24.04]
  architectures: [amd64, arm64]
enhances:
  - gnome-system-monitor
# The package changed shape at 0.2.0: v0.1.0 shipped the window alone, and
# ticket 36 put the session service, the command line, and the systemd user
# unit into the same package, so the wider payload took its own version number
# rather than reusing 0.1.0.
# The checksums below belong to the published v0.2.7 release assets. Each one
# was re-hashed from the package downloaded back from the public release rather
# than copied from its sidecar, which is what ADR 0002 requires a manifest to
# record.
artifacts:
  - release: "22.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.7/better-monitor_0.2.7_ubuntu-22.04_amd64.deb
    sha256: 5b7789cec4fedb23e5d41446df4dcf92401317e394e42ff44326be46ee6bdf37
    release_asset: better-monitor_0.2.7_ubuntu-22.04_amd64.deb
  - release: "22.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.7/better-monitor_0.2.7_ubuntu-22.04_arm64.deb
    sha256: 014b7178e8d6aa6a85c17a878eaf5c1a5097fff5c78ca97028e57b5e4ed45edb
    release_asset: better-monitor_0.2.7_ubuntu-22.04_arm64.deb
  - release: "24.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.7/better-monitor_0.2.7_ubuntu-24.04_amd64.deb
    sha256: 3bee1454ec43608790516f30bcf0af1a33563ee905f38aba479259476b577913
    release_asset: better-monitor_0.2.7_ubuntu-24.04_amd64.deb
  - release: "24.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.7/better-monitor_0.2.7_ubuntu-24.04_arm64.deb
    sha256: 71d6b65d76a10d2a70fcca4010538433f745278f45e1952598a84e2ce823dc5b
    release_asset: better-monitor_0.2.7_ubuntu-24.04_arm64.deb
lifecycle:
  install: plan-local-apt-install
  enable: plan-enable
  disable: plan-disable
  remove: plan-remove
  rollback: plan-rollback
health_checks:
  - monitor-core-self-check
benchmarks:
  - name: idle-overhead
    workload: desktop-idle
    metric: cpu-percent
    minimum_improvement_percent: 0
    maximum_regression_percent: 1
permissions:
  - name: procfs-read
    reason: future low-cost observation collector
paths:
  # /usr/bin/better-monitor is the window, because that is what the published
  # v0.1.0 package installed. The command line is installed beside it as
  # better-monitor-cli even though its own --help says `better-monitor`; the
  # collision and what resolving it would cost are in ticket 36.
  - /usr/bin/better-monitor
  - /usr/bin/better-monitor-service
  - /usr/bin/better-monitor-cli
  - /usr/lib/systemd/user/better-monitor.service
  # The desktop entry launches the window and neither of the other two
  # executables: the service is started by the user unit, and the command line
  # has no window to show.
  - /usr/share/applications/io.betteros.Monitor.desktop
  - /usr/share/icons/hicolor/scalable/apps/better-monitor.svg
  - /var/lib/better-os/monitor
