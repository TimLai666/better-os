schema_version: 2
id: better-monitor
display_name: Better Monitor
component_type: diagnostic
version: 0.2.0
summary: Low-cost desktop observation with samples, incidents, and export.
icon: monitor
restart: application
targets:
  distributions: [zorin, ubuntu]
  releases: [22.04, 24.04]
  architectures: [amd64, arm64]
enhances:
  - gnome-system-monitor
# The version is 0.2.0 because the package changed shape. v0.1.0 shipped the
# window alone; ticket 36 put the session service, the command line, and the
# systemd user unit into the same package, so the wider payload needed its own
# version number rather than reusing 0.1.0. The checksums below belong to the
# published v0.2.0 assets, verified after re-downloading them from the public
# release, which is what ADR 0002 requires a manifest to record.
artifacts:
  - release: "22.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.0/better-monitor_0.2.0_ubuntu-22.04_amd64.deb
    sha256: ae1bdb5697b0e8ff24c78fff3092290e86d9332486d09641477b438d20ac9d20
    release_asset: better-monitor_0.2.0_ubuntu-22.04_amd64.deb
  - release: "22.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.0/better-monitor_0.2.0_ubuntu-22.04_arm64.deb
    sha256: 913e9e9e1321fc50741b5ec812d7db6ad8b482d73a07e2a6edb9c7479044fbde
    release_asset: better-monitor_0.2.0_ubuntu-22.04_arm64.deb
  - release: "24.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.0/better-monitor_0.2.0_ubuntu-24.04_amd64.deb
    sha256: 1ac42f56172af506c8471d6a36da45e5f8eeaa93cca38a79607bff2063dbcda5
    release_asset: better-monitor_0.2.0_ubuntu-24.04_amd64.deb
  - release: "24.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.0/better-monitor_0.2.0_ubuntu-24.04_arm64.deb
    sha256: c0f280c9c89193d1d71dc3ea0ad3917d04da6d4485c9a23b1f7a8dd33f4d99c0
    release_asset: better-monitor_0.2.0_ubuntu-24.04_arm64.deb
lifecycle:
  install: plan-local-apt-install
  enable: plan-enable
  disable: plan-disable
  remove: plan-remove
  rollback: plan-rollback
health_checks:
  - monitor-core-self-check
benchmarks:
  - name: idle-overhead
    workload: desktop-idle
    metric: cpu-percent
    minimum_improvement_percent: 0
    maximum_regression_percent: 1
permissions:
  - name: procfs-read
    reason: future low-cost observation collector
paths:
  # /usr/bin/better-monitor is the window, because that is what the published
  # v0.1.0 package installed. The command line is installed beside it as
  # better-monitor-cli even though its own --help says `better-monitor`; the
  # collision and what resolving it would cost are in ticket 36.
  - /usr/bin/better-monitor
  - /usr/bin/better-monitor-service
  - /usr/bin/better-monitor-cli
  - /usr/lib/systemd/user/better-monitor.service
  - /var/lib/better-os/monitor
