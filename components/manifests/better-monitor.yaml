schema_version: 2
id: better-monitor
display_name: Better Monitor
component_type: diagnostic
version: 0.2.4
summary: Low-cost desktop observation with samples, incidents, and export.
icon: monitor
restart: application
targets:
  distributions: [zorin, ubuntu]
  releases: [22.04, 24.04]
  architectures: [amd64, arm64]
enhances:
  - gnome-system-monitor
# The package changed shape at 0.2.0: v0.1.0 shipped the window alone, and
# ticket 36 put the session service, the command line, and the systemd user
# unit into the same package, so the wider payload took its own version number
# rather than reusing 0.1.0.
# Placeholder checksums until v0.2.4 is published. ADR 0002 records the
# checksum of a *published* release asset; the v0.2.3 values these variants
# carried describe 0.2.3's packages, not 0.2.4's. The real values are written
# back once the release is public and every asset has been re-downloaded and
# verified.
artifacts:
  - release: "22.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.4/better-monitor_0.2.4_ubuntu-22.04_amd64.deb
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    release_asset: better-monitor_0.2.4_ubuntu-22.04_amd64.deb
  - release: "22.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.4/better-monitor_0.2.4_ubuntu-22.04_arm64.deb
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    release_asset: better-monitor_0.2.4_ubuntu-22.04_arm64.deb
  - release: "24.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.4/better-monitor_0.2.4_ubuntu-24.04_amd64.deb
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    release_asset: better-monitor_0.2.4_ubuntu-24.04_amd64.deb
  - release: "24.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.4/better-monitor_0.2.4_ubuntu-24.04_arm64.deb
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    release_asset: better-monitor_0.2.4_ubuntu-24.04_arm64.deb
lifecycle:
  install: plan-local-apt-install
  enable: plan-enable
  disable: plan-disable
  remove: plan-remove
  rollback: plan-rollback
health_checks:
  - monitor-core-self-check
benchmarks:
  - name: idle-overhead
    workload: desktop-idle
    metric: cpu-percent
    minimum_improvement_percent: 0
    maximum_regression_percent: 1
permissions:
  - name: procfs-read
    reason: future low-cost observation collector
paths:
  # /usr/bin/better-monitor is the window, because that is what the published
  # v0.1.0 package installed. The command line is installed beside it as
  # better-monitor-cli even though its own --help says `better-monitor`; the
  # collision and what resolving it would cost are in ticket 36.
  - /usr/bin/better-monitor
  - /usr/bin/better-monitor-service
  - /usr/bin/better-monitor-cli
  - /usr/lib/systemd/user/better-monitor.service
  # The desktop entry launches the window and neither of the other two
  # executables: the service is started by the user unit, and the command line
  # has no window to show.
  - /usr/share/applications/io.betteros.Monitor.desktop
  - /usr/share/icons/hicolor/scalable/apps/better-monitor.svg
  - /var/lib/better-os/monitor
