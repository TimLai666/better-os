schema_version: 2
id: better-monitor
display_name: Better Monitor
component_type: diagnostic
version: 0.2.8
summary: Low-cost desktop observation with samples, incidents, and export.
icon: monitor
restart: application
targets:
  distributions: [zorin, ubuntu]
  releases: [22.04, 24.04]
  architectures: [amd64, arm64]
enhances:
  - gnome-system-monitor
# The package changed shape at 0.2.0: v0.1.0 shipped the window alone, and
# ticket 36 put the session service, the command line, and the systemd user
# unit into the same package, so the wider payload took its own version number
# rather than reusing 0.1.0.
# The checksums below belong to the published v0.2.8 release assets. Each one
# was re-hashed from the package downloaded back from the public release rather
# than copied from its sidecar, which is what ADR 0002 requires a manifest to
# record.
artifacts:
  - release: "22.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.8/better-monitor_0.2.8_ubuntu-22.04_amd64.deb
    sha256: cb7ac37bed375d9a17ee044fac3f075af85df59ec219854efbf3dd50f4605016
    release_asset: better-monitor_0.2.8_ubuntu-22.04_amd64.deb
  - release: "22.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.8/better-monitor_0.2.8_ubuntu-22.04_arm64.deb
    sha256: 74e73a3585140e8456ded73f2c310230398ed523b97417c448a70c918f3d96c9
    release_asset: better-monitor_0.2.8_ubuntu-22.04_arm64.deb
  - release: "24.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.8/better-monitor_0.2.8_ubuntu-24.04_amd64.deb
    sha256: 68e1e87d5a480d56eaddfa42c40ecac6c1138e5b66fc065232796b6b8d90bf9c
    release_asset: better-monitor_0.2.8_ubuntu-24.04_amd64.deb
  - release: "24.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.8/better-monitor_0.2.8_ubuntu-24.04_arm64.deb
    sha256: f70de5c9f30af1c9ebad0964c70192c1cdcfd8cd168d0e36c30ccee3f13874b5
    release_asset: better-monitor_0.2.8_ubuntu-24.04_arm64.deb
lifecycle:
  install: plan-local-apt-install
  enable: plan-enable
  disable: plan-disable
  remove: plan-remove
  rollback: plan-rollback
health_checks:
  - monitor-core-self-check
benchmarks:
  - name: idle-overhead
    workload: desktop-idle
    metric: cpu-percent
    minimum_improvement_percent: 0
    maximum_regression_percent: 1
permissions:
  - name: procfs-read
    reason: future low-cost observation collector
paths:
  # /usr/bin/better-monitor is the window, because that is what the published
  # v0.1.0 package installed. The command line is installed beside it as
  # better-monitor-cli and calls itself that, and the window refuses the
  # command line's arguments and names it (ticket 60).
  - /usr/bin/better-monitor
  - /usr/bin/better-monitor-service
  - /usr/bin/better-monitor-cli
  - /usr/lib/systemd/user/better-monitor.service
  # The desktop entry launches the window and neither of the other two
  # executables: the service is started by the user unit, and the command line
  # has no window to show.
  - /usr/share/applications/io.betteros.Monitor.desktop
  - /usr/share/icons/hicolor/scalable/apps/better-monitor.svg
  - /var/lib/better-os/monitor
