schema_version: 2
id: better-awake
display_name: Better Awake
component_type: enhancement
version: 0.2.1
summary: Keep-awake sessions and automatic rules, with every reason the machine is awake shown.
icon: generic
restart: application
targets:
  distributions: [zorin, ubuntu]
  releases: [22.04, 24.04]
  architectures: [amd64, arm64]
# The checksums below belong to the published v0.2.1 release assets. Each one
# was re-hashed from the package downloaded back from the public release rather
# than copied from its sidecar, which is what ADR 0002 requires a manifest to
# record.
artifacts:
  - release: "22.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.1/better-awake_0.2.1_ubuntu-22.04_amd64.deb
    sha256: 41f6680c2bc52b83cf0def802f51647f55f4d3346759caf046113d481a7c697c
    release_asset: better-awake_0.2.1_ubuntu-22.04_amd64.deb
  - release: "22.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.1/better-awake_0.2.1_ubuntu-22.04_arm64.deb
    sha256: dd3394052fe52e445ed3e5c787b0cb3bf278d42ce6c4a271a59daf5e545840ff
    release_asset: better-awake_0.2.1_ubuntu-22.04_arm64.deb
  - release: "24.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.1/better-awake_0.2.1_ubuntu-24.04_amd64.deb
    sha256: 4eab08936a3ea371442478a31ae670da7bfacc9d39480185508e121871b4a039
