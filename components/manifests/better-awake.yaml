schema_version: 2
id: better-awake
display_name: Better Awake
component_type: enhancement
version: 0.2.14
summary: Keep-awake sessions and automatic rules, with every reason the machine is awake shown.
icon: generic
restart: application
targets:
  distributions: [zorin, ubuntu]
  releases: [22.04, 24.04]
  architectures: [amd64, arm64]
# Placeholder checksums until v0.2.14 is published. ADR 0002 records the
# checksum of a *published* release asset; the v0.2.13 values these variants
# carried describe 0.2.13's packages, not 0.2.14's. The real values are written
# back once the release is public and every asset has been re-downloaded and
# verified.
artifacts:
  - release: "22.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.14/better-awake_0.2.14_ubuntu-22.04_amd64.deb
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    release_asset: better-awake_0.2.14_ubuntu-22.04_amd64.deb
  - release: "22.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.14/better-awake_0.2.14_ubuntu-22.04_arm64.deb
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    release_asset: better-awake_0.2.14_ubuntu-22.04_arm64.deb
  - release: "24.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.14/better-awake_0.2.14_ubuntu-24.04_amd64.deb
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    release_asset: better-awake_0.2.14_ubuntu-24.04_amd64.deb
  - release: "24.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.14/better-awake_0.2.14_ubuntu-24.04_arm64.deb
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    release_asset: better-awake_0.2.14_ubuntu-24.04_arm64.deb
lifecycle:
  install: plan-local-apt-install
  enable: plan-enable
  disable: plan-disable
  remove: plan-remove
  rollback: plan-rollback
health_checks:
  - awake-service-unit-check
  - awake-inhibitor-backend-check
  - awake-tray-registration-check
benchmarks:
  - name: idle-overhead
    workload: service-running-with-no-active-session
    metric: cpu-percent
    minimum_improvement_percent: 0
    maximum_regression_percent: 1
permissions:
  - name: session-bus-name
    reason: owns org.betteros.Awake1 so the tray and the settings window talk to one service, and the tray owns org.betteros.AwakeTray1 while it raises the low-battery notification so the service raises it only when no tray is running; asking for that name starts the tray through its better-awake-tray user unit; that tray also owns org.betteros.AwakeTray1.Protocol3 to say it raises the closed-lid notification too, which the service otherwise raises itself because a tray from before protocol version 3 cannot
  - name: logind-inhibitor
    reason: holds systemd-logind sleep and idle locks, and the handle-lid-switch lock while a session keeps awake with the lid closed, all in block mode and without privilege; display-blank and automatic-lock have no logind lock and are reported unmet rather than faked
  - name: status-notifier-item
    reason: the tray needs the StatusNotifierItem protocol; a missing StatusNotifierWatcher host is reported, never assumed present
  - name: systemd-user-unit
    reason: installs systemd user units for the service and for the tray, both bound to graphical-session.target
  - name: procfs-read
    reason: trigger providers read /proc for running processes, CPU utilization, and network throughput
  - name: sysfs-read
    reason: trigger providers read /sys/class/power_supply, /sys/class/drm, and /sys/class/net for power, display, and interface state
  - name: filesystem-watch
    reason: the watched-path trigger provider watches user-selected files and directories for activity
paths:
  - /usr/bin/better-awake-service
  - /usr/bin/awake-tray
  - /usr/bin/awake-gui
  - /usr/share/applications/better-awake.desktop
  - /usr/lib/systemd/user/better-awake.service
  - /usr/lib/systemd/user/better-awake-tray.service
  # One icon for the window and the notifications the tray raises.
  - /usr/share/icons/hicolor/scalable/apps/better-awake.svg
  - /usr/share/dbus-1/services/org.betteros.Awake1.service
  - /usr/share/dbus-1/services/org.betteros.AwakeTray1.service
  - /usr/share/icons/hicolor/scalable/status/better-awake-inactive-symbolic.svg
  - /usr/share/icons/hicolor/scalable/status/better-awake-active-symbolic.svg
  - /usr/share/icons/hicolor/scalable/status/better-awake-active-trigger-symbolic.svg
  - /usr/share/icons/hicolor/scalable/status/better-awake-paused-symbolic.svg
  - /usr/share/icons/hicolor/scalable/status/better-awake-attention-symbolic.svg
  - /usr/share/icons/hicolor/scalable/status/better-awake-unavailable-symbolic.svg
  - ~/.local/state/better-awake/awake-rules.json
  - ~/.local/state/better-awake/awake-history.json
  - ~/.local/state/better-awake/awake-service-state.json
  - ~/.local/state/better-awake/awake-service-settings.json
release_notes:
  - Keeping awake now also covers closing the lid. A session you start by hand keeps the computer awake with the lid closed (the screen still turns off), and you can turn that off in Quick options, in Session defaults, or per rule; rules leave it off unless you turn it on. On battery, the battery stop threshold still ends the session, and so does the lid staying closed for longer than a limit you choose in Battery & Safety (2 hours unless you change it, or never). A notification says why the session ended.
  - The tray menu always matches the service. A panel now sees every changed menu under new item ids, so it can no longer keep showing the not-awake menu during a session, and every item with an arrow opens.
  - Choosing a length while a session runs changes that session instead of reporting an error, and an action the service refuses is said in a notification.
  - The tray runs as a systemd user unit, so an update restarts it with the service, and it follows the service and the panel across their restarts.
  - Keep-awake sessions started by hand or by an automatic rule, with every active reason listed and the battery stop threshold on by default.
  - Uninstall stops the service and releases every inhibitor it holds before the package is removed, so the machine is never left awake with nobody left to explain why.
  - Uninstall disables the better-awake and better-awake-tray systemd user units (the second is the tray's autostart), and the tray leaves the StatusNotifierWatcher host when its unit stops rather than leaving a dead icon behind.
  - Your rules and history are kept by default when the component is removed. Deleting them is a separate, explicit choice at uninstall time, never the default.
  - Rollback reinstalls the previously installed version and restores its systemd user units, the tray's included. Rules and history are left untouched by a rollback, so a failed update never costs you the rules you wrote.
