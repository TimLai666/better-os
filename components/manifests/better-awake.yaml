schema_version: 2
id: better-awake
display_name: Better Awake
component_type: enhancement
version: 0.2.2
summary: Keep-awake sessions and automatic rules, with every reason the machine is awake shown.
icon: generic
restart: application
targets:
  distributions: [zorin, ubuntu]
  releases: [22.04, 24.04]
  architectures: [amd64, arm64]
# Placeholder checksums until v0.2.2 is published. ADR 0002 records the
# checksum of a *published* release asset; the v0.2.1 values these variants
# carried describe 0.2.1's packages, not 0.2.2's. The real values are written
# back once the release is public and every asset has been re-downloaded and
# verified.
artifacts:
  - release: "22.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.2/better-awake_0.2.2_ubuntu-22.04_amd64.deb
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    release_asset: better-awake_0.2.2_ubuntu-22.04_amd64.deb
  - release: "22.04"
    architecture: arm64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.2/better-awake_0.2.2_ubuntu-22.04_arm64.deb
    sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    release_asset: better-awake_0.2.2_ubuntu-22.04_arm64.deb
  - release: "24.04"
    architecture: amd64
    url: https://github.com/TimLai666/better-os/releases/download/v0.2.2/better-awake_0.2.2_ubuntu-24.04_amd64.deb
    sha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
