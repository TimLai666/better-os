[workspace]
resolver = "2"
members = [
    "crates/app-catalog-core",
    "crates/app-catalog-platform",
    "crates/app-chooser-core",
    "crates/app-chooser-gui",
    "crates/awake-core",
    "crates/awake-gui",
    "crates/awake-ipc",
    "crates/awake-service",
    "crates/awake-store",
    "crates/awake-tray",
    "crates/better-core",
    "crates/better-ui",
    "crates/launcher-core",
    "crates/manager-core",
    "crates/manager-ipc",
    "crates/manager-platform",
    "crates/manager-store",
    "crates/manager-cli",
    "crates/manager-daemon",
    "crates/manager-gui",
    "crates/monitor-core",
    "crates/monitor-collectors-linux",
    "crates/monitor-views",
    "crates/monitor-actions-linux",
    "crates/monitor-gui",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.85"
authors = ["Better OS contributors"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
app-catalog-core = { path = "crates/app-catalog-core" }
app-catalog-platform = { path = "crates/app-catalog-platform" }
app-chooser-core = { path = "crates/app-chooser-core" }
app-chooser-gui = { path = "crates/app-chooser-gui" }
awake-core = { path = "crates/awake-core" }
awake-ipc = { path = "crates/awake-ipc" }
awake-service = { path = "crates/awake-service" }
awake-store = { path = "crates/awake-store" }
awake-gui = { path = "crates/awake-gui" }
awake-tray = { path = "crates/awake-tray" }
better-core = { path = "crates/better-core" }
better-ui = { path = "crates/better-ui" }
launcher-core = { path = "crates/launcher-core" }
manager-core = { path = "crates/manager-core" }
manager-ipc = { path = "crates/manager-ipc" }
manager-platform = { path = "crates/manager-platform" }
manager-store = { path = "crates/manager-store" }
monitor-core = { path = "crates/monitor-core" }
monitor-collectors-linux = { path = "crates/monitor-collectors-linux" }
monitor-views = { path = "crates/monitor-views" }
monitor-actions-linux = { path = "crates/monitor-actions-linux" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
semver = { version = "1.0", features = ["serde"] }
thiserror = "2.0"
notify = "7.0"
tempfile = "3"
clap = { version = "4.5", features = ["derive", "env"] }
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "88f102d13654fe25aa2fede076274b6b751a3704" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "88f102d13654fe25aa2fede076274b6b751a3704" }
gpui-platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", features = ["wayland", "x11"] }
