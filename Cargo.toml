[workspace]
resolver = "2"
members = [
    "crates/better-core",
    "crates/better-ui",
    "crates/manager-core",
    "crates/manager-ipc",
    "crates/manager-platform",
    "crates/manager-store",
    "crates/manager-cli",
    "crates/manager-daemon",
    "crates/manager-gui",
    "crates/monitor-core",
    "crates/monitor-ipc",
    "crates/monitor-gui",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.85"
authors = ["Better OS contributors"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
better-core = { path = "crates/better-core" }
better-ui = { path = "crates/better-ui" }
manager-core = { path = "crates/manager-core" }
manager-ipc = { path = "crates/manager-ipc" }
manager-platform = { path = "crates/manager-platform" }
manager-store = { path = "crates/manager-store" }
monitor-core = { path = "crates/monitor-core" }
monitor-ipc = { path = "crates/monitor-ipc" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
semver = { version = "1.0", features = ["serde"] }
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "env"] }
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "88f102d13654fe25aa2fede076274b6b751a3704" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "88f102d13654fe25aa2fede076274b6b751a3704" }
gpui-platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", features = ["wayland", "x11"] }
