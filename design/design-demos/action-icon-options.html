<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>操作按鈕圖示的三種畫法</title>
<style>
  :root { --desk: #dcd8d1; --raised: #ffffff; --text: #1c1b19; --text-2: #66635d; --text-3: #8d8982;
    --line: rgba(28,27,25,.09); --hover: rgba(28,27,25,.05); --accent: #3a6ff0; --danger: #c9372b; --accent-2: #a3bdfa; --danger-2: #eba59e; --quiet: #77736c; --quiet-2: #bdb9b2;
    --float: 0 1px 2px rgba(28,27,25,.10), 0 6px 18px rgba(28,27,25,.10); }
  :root[data-theme="dark"] { --desk: #121110; --raised: #34322f; --text: #f3f1ec; --text-2: #b6b2aa; --text-3: #8a867f;
    --line: rgba(255,255,255,.09); --hover: rgba(255,255,255,.06); --accent: #86a8ff; --danger: #ff8a7d; --accent-2: #5673c4; --danger-2: #c2584e; --quiet: #a9a59d; --quiet-2: #6b6862;
    --float: 0 1px 2px rgba(0,0,0,.45), 0 8px 22px rgba(0,0,0,.40); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 40px; background: var(--desk); color: var(--text);
    font: 14px/20px system-ui, "Noto Sans CJK TC", sans-serif; }
  .top { max-width: 1000px; margin: 0 auto 20px; display: flex; align-items: center; gap: 12px; }
  h1 { font-size: 20px; line-height: 28px; font-weight: 600; margin: 0; flex: 1; }
  button { font: inherit; height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--raised); color: var(--text); cursor: pointer; }
  .cols { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  p { margin: 0 0 12px; color: var(--text-2); font-size: 12px; line-height: 16px; min-height: 32px; }
  .pill { display: inline-flex; align-items: center; gap: 2px; padding: 4px; border-radius: 12px; background: var(--raised);
    box-shadow: var(--float); margin-bottom: 14px; }
  .pill span { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; }
  .pill span:hover, .row:hover { background: var(--hover); }
  .menu { background: var(--raised); border-radius: 12px; border: 1px solid var(--line); box-shadow: var(--float); padding: 4px; }
  .row { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 8px; }
  .row b { flex: 1; font-weight: 400; }
  .row kbd { font: inherit; font-size: 12px; color: var(--text-3); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 4px 8px; }
  svg { width: 18px; height: 18px; flex: none; }
  .a svg { color: var(--text-2); }
  .a .f, .a .b { fill: currentColor; }
  .b2 svg { color: var(--text-2); }
  .b2 .f { fill: currentColor; } .b2 .b { fill: currentColor; opacity: .38; }
  .c svg { color: var(--accent); } .c svg.red { color: var(--danger); }
  .c .f { fill: currentColor; } .c .b { fill: currentColor; opacity: .38; }
  .d .b { opacity: 1; fill: var(--accent-2); } .d svg.red .b { fill: var(--danger-2); } .d .s { stroke-width: 2.2; }
  .d .menu svg { width: 16px; height: 16px; color: var(--quiet); } .d .menu svg .b { fill: var(--quiet-2); }
  .d .menu svg.red { color: var(--danger); } .d .menu svg.red .b { fill: var(--danger-2); }
  .k { fill: none; stroke: var(--raised); stroke-width: 2; stroke-linecap: round; }
  .s { fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }
</style>
</head>
<body>
<div class="top"><h1>操作按鈕圖示的三種畫法</h1><button id="theme" type="button">切換深淺色</button></div>
<div class="cols" id="cols"></div>
<script>
const G = {
  copy: '<rect class="b" x="3" y="3" width="12.5" height="12.5" rx="2.5"/><rect class="f" x="8.5" y="8.5" width="12.5" height="12.5" rx="2.5"/>',
  rename: '<path class="f" d="M15.6 3.6a2.4 2.4 0 0 1 3.4 0l1.4 1.4a2.4 2.4 0 0 1 0 3.4L9 19.8l-4.8-4.8z"/><path class="b" d="M4.2 15 9 19.8 3 21z"/>',
  newfolder: '<path class="f" d="M2.5 6.5a2 2 0 0 1 2-2h4.6l2 2.2h8.4a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2z"/><path class="k" d="M12 10.4v6M9 13.4h6"/>',
  del: '<path class="b" d="M5.5 9h13l-.9 10.2a2 2 0 0 1-2 1.8H8.4a2 2 0 0 1-2-1.8z"/><rect class="f" x="3.5" y="4.6" width="17" height="3" rx="1.5"/><rect class="f" x="9.5" y="2.6" width="5" height="3" rx="1"/>',
  refresh: '<path class="s" d="M4.2 11a8 8 0 0 1 13.4-4.4"/><path class="f" d="M20.6 3.6v5.8h-5.8z"/><g transform="rotate(180 12 12)" class="b"><path class="s" d="M4.2 11a8 8 0 0 1 13.4-4.4"/><path d="M20.6 3.6v5.8h-5.8z"/></g>'
};
const G2 = {
  copy: '<path class="b" d="M5.5 3h8A2.5 2.5 0 0 1 16 5.5V7H9.5A2.5 2.5 0 0 0 7 9.500V16H5.5A2.5 2.5 0 0 1 3 13.5v-8A2.5 2.5 0 0 1 5.5 3z"/><rect class="f" x="9" y="9" width="12" height="12" rx="2.5"/>',
  rename: '<path class="f" d="M16.3 3.9a1.9 1.9 0 0 1 2.7 0l1.1 1.1a1.9 1.9 0 0 1 0 2.700L9.300 18.500l-3.800-3.800z"/><path class="b" d="M4.400 16.100 7.900 19.600 3.200 20.800z"/>',
  newfolder: '<path class="b" d="M3 6.800A1.800 1.800 0 0 1 4.800 5h4.300l1.900 2H3z"/><path class="f" d="M3 8.500h16.200A1.800 1.800 0 0 1 21 10.300v7.400a1.800 1.800 0 0 1-1.800 1.800H4.800A1.800 1.800 0 0 1 3 17.700z"/><path class="k" d="M12 11.300v5.400M9.300 14h5.400"/>',
  del: '<path class="f" d="M6 9.500h12l-.800 9.300a1.900 1.900 0 0 1-1.900 1.700H8.700a1.900 1.900 0 0 1-1.900-1.700z"/><rect class="b" x="9.300" y="12" width="1.700" height="6" rx=".850"/><rect class="b" x="13" y="12" width="1.700" height="6" rx=".850"/><path class="f" d="M9.300 4.200A1.700 1.700 0 0 1 11 2.500h2a1.700 1.700 0 0 1 1.700 1.700V5H19a1.250 1.250 0 0 1 0 2.500H5A1.250 1.250 0 0 1 5 5h4.300z"/>',
  refresh: '<path class="s" d="M5 10.500a7.300 7.300 0 0 1 12.300-3.300"/><path class="f" d="M19.800 3.500v5.400h-5.400z"/><g transform="rotate(180 12 12)"><path class="s" d="M5 10.500a7.300 7.300 0 0 1 12.300-3.300"/><path class="f" d="M19.800 3.500v5.400h-5.400z"/></g>'
};
const svg = (k, red, set) => `<svg viewBox="0 0 24 24" aria-hidden="true"${red ? ' class="red"' : ""}>${(set || G)[k]}</svg>`;
const sets = [
  ["a", "一：實心單色", "每個按鈕一個實心形狀，顏色跟文字一樣，沒有彩色。"],
  ["b2", "二：實心雙層灰", "同樣沒有彩色，但次要的部分淡一階，看得出前後。"],
  ["c", "三：雙層加重點色", "全部用同一個重點色，只有刪除是紅的。"],
  ["c d", "三（修過）", "形狀重畫，兩層不再疊在一起。淡的那層改用固定的顏色，不靠透明度。", G2]
];
document.getElementById("cols").innerHTML = sets.map(([c, t, d, g]) => `
  <section class="${c}"><h2>${t}</h2><p>${d}</p>
    <div class="pill">${["newfolder", "copy", "rename", "del", "refresh"].map(k => `<span>${svg(k, k === "del", g)}</span>`).join("")}</div>
    <div class="menu">
      <div class="row">${svg("copy", false, g)}<b>複製</b><kbd>Ctrl C</kbd></div>
      <div class="row">${svg("rename", false, g)}<b>重新命名</b><kbd>F2</kbd></div>
      <div class="row">${svg("newfolder", false, g)}<b>新增資料夾</b><kbd>Ctrl Shift N</kbd></div>
      <hr>
      <div class="row">${svg("del", true, g)}<b>刪除</b><kbd>Delete</kbd></div>
    </div></section>`).join("");
const root = document.documentElement;
document.getElementById("theme").addEventListener("click", () => {
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
});
</script>
</body>
</html>
