<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Better OS 圖示方向</title>
<style>
  :root {
    --window: #f3f3f3; --card: #fbfbfb; --text: #1a1a1a; --text-2: #5c5c5c;
    --stroke: rgba(0,0,0,.06); --hover: rgba(0,0,0,.04); --accent: #005fb8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --window: #202020; --card: #2b2b2b; --text: #ffffff; --text-2: #cccccc;
      --stroke: rgba(255,255,255,.07); --hover: rgba(255,255,255,.06); --accent: #60cdff;
    }
  }
  :root[data-theme="dark"] {
    --window: #202020; --card: #2b2b2b; --text: #ffffff; --text-2: #cccccc;
    --stroke: rgba(255,255,255,.07); --hover: rgba(255,255,255,.06); --accent: #60cdff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: var(--window); color: var(--text);
    font: 14px/20px system-ui, "Noto Sans CJK TC", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  h1 { font-size: 20px; line-height: 28px; font-weight: 600; margin: 0; flex: 1; }
  button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--stroke);
    border-radius: 4px; height: 32px; padding: 0 12px; cursor: pointer; }
  .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 767px) { .cols { grid-template-columns: 1fr; } }
  section { background: var(--card); border: 1px solid var(--stroke); border-radius: 4px; padding: 16px; }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
  .note { color: var(--text-2); font-size: 12px; line-height: 16px; margin: 0 0 12px; min-height: 32px; }
  .bar { display: flex; gap: 4px; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid var(--stroke); }
  .bar span { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 4px; }
  .bar span:hover, .row:hover { background: var(--hover); }
  .row { display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 8px; border-radius: 4px; position: relative; }
  .row.sel { background: var(--hover); font-weight: 600; }
  .row.sel::before { content: ""; position: absolute; left: 0; top: 10px; width: 3px; height: 16px; border-radius: 2px; background: var(--accent); }
  .row svg { width: 20px; height: 20px; flex: none; }
  .bar svg { width: 18px; height: 18px; }
  .big { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--stroke); }
  .big svg { width: 40px; height: 40px; }
  .line { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="g-home" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3df"/><stop offset="1" stop-color="#f1d3a8"/></linearGradient>
  <linearGradient id="g-desk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4aa8ff"/><stop offset="1" stop-color="#7ad7c8"/></linearGradient>
  <linearGradient id="g-doc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d6e2f8"/></linearGradient>
  <linearGradient id="g-down" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#63dd90"/><stop offset="1" stop-color="#22a95a"/></linearGradient>
  <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc6ff"/><stop offset="1" stop-color="#dcf1ff"/></linearGradient>
  <linearGradient id="g-note" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff86b0"/><stop offset="1" stop-color="#c22f6a"/></linearGradient>
  <linearGradient id="g-can" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c3d0dd"/><stop offset="1" stop-color="#8b9db2"/></linearGradient>
  <linearGradient id="g-usb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#45d0c8"/><stop offset="1" stop-color="#178891"/></linearGradient>
</defs></svg>

<header>
  <h1>Better Files 側邊欄：三種圖示畫法</h1>
  <button id="theme" type="button">切換深淺色</button>
</header>
<div class="cols" id="cols"></div>

<script>
const names = ["家目錄", "桌面", "文件", "下載", "圖片", "音樂", "影片", "垃圾桶", "USB 隨身碟"];

const line = [
  '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v10.5a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5V9"/><path d="M10 21v-6h4v6"/>',
  '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>',
  '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/>',
  '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>',
  '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  '<path d="M16 13l5.2 3.5a.5.5 0 0 0 .8-.4V7.9a.5.5 0 0 0-.8-.4L16 11"/><rect x="2" y="6" width="14" height="12" rx="2"/>',
  '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/>',
  '<rect x="7" y="9" width="10" height="13" rx="2"/><path d="M9 9V3h6v6"/><path d="M11 6h.01"/><path d="M13 6h.01"/>'
];

const tint = [
  '<path d="M5 9v10.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V9l-7-6z" fill="#ffb59f"/>',
  '<rect x="2" y="3" width="20" height="14" rx="2" fill="#9cc8ff"/>',
  '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="#bcd3ff"/>',
  '<path d="M3 15v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4z" fill="#a6e6bd"/>',
  '<rect x="3" y="3" width="18" height="18" rx="2" fill="#ffe08a"/>',
  '<circle cx="6" cy="18" r="3" fill="#ffb3cf"/><circle cx="18" cy="16" r="3" fill="#ffb3cf"/>',
  '<rect x="2" y="6" width="14" height="12" rx="2" fill="#cdb9ff"/>',
  '<path d="M5 6h14v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z" fill="#c9d3df"/>',
  '<rect x="7" y="9" width="10" height="13" rx="2" fill="#a5e6e1"/>'
];

const color = [
  '<rect x="15.5" y="4.6" width="2.3" height="4.5" fill="#b63a26"/><path d="M5.5 11.3 12 5.8l6.5 5.5V19a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 19z" fill="url(#g-home)"/><rect x="10.2" y="14" width="3.6" height="6.5" rx=".8" fill="#8a5a3c"/><path d="M2.9 11 12 3.2l9.1 7.8-1.5 1.8L12 6.3l-7.6 6.5z" fill="#de4a30"/>',
  '<path d="M10 17h4l.8 3H9.2z" fill="#8a95a8"/><rect x="7.5" y="19.6" width="9" height="1.7" rx=".85" fill="#6b7689"/><rect x="2.5" y="3.8" width="19" height="13.4" rx="2" fill="#2f3b58"/><rect x="4" y="5.3" width="16" height="10.4" rx="1" fill="url(#g-desk)"/><path d="M4 13.2c3-2.4 6-2.4 8.5-.4s5 1.4 7.5-.6v2.5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z" fill="#2069c4" opacity=".55"/>',
  '<path d="M6 2.5h8l4.5 4.5V20a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 20V4A1.5 1.5 0 0 1 6 2.5z" fill="url(#g-doc)" stroke="#9db5e6" stroke-width=".6"/><path d="M14 2.5V6a1 1 0 0 0 1 1h3.5z" fill="#8fb0ee"/><rect x="7.5" y="10" width="8" height="1.6" rx=".8" fill="#3f78e0"/><rect x="7.5" y="13.2" width="8" height="1.6" rx=".8" fill="#7da3ea"/><rect x="7.5" y="16.4" width="5" height="1.6" rx=".8" fill="#7da3ea"/>',
  '<path d="M3.5 14.5h4l1.2 2.2h6.6l1.2-2.2h4V19a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" fill="#1c7f46"/><path d="M10.3 2.8h3.4V9h3.3L12 14.6 7 9h3.3z" fill="url(#g-down)"/>',
  '<rect x="2.5" y="4" width="19" height="16" rx="2.5" fill="#ffffff" stroke="#c3c9d4" stroke-width=".6"/><rect x="4.3" y="5.8" width="15.4" height="12.4" rx="1.2" fill="url(#g-sky)"/><circle cx="8.3" cy="9.3" r="1.9" fill="#ffc531"/><path d="M4.3 16.9l4.2-4.5 3.4 3.4v2.4H5.5a1.2 1.2 0 0 1-1.2-1.2z" fill="#3aa35c"/><path d="M9.6 18.2l5.1-7 5 6v-.2a1.2 1.2 0 0 1-1.2 1.2z" fill="#2a8048"/>',
  '<path d="M8 4.8 20 2.6v13.2h-2.2V7.3l-7.6 1.5V18H8z" fill="#e0457b"/><ellipse cx="6.7" cy="18.1" rx="3.5" ry="2.9" fill="url(#g-note)"/><ellipse cx="16.5" cy="16" rx="3.5" ry="2.9" fill="url(#g-note)"/>',
  '<rect x="3" y="8.6" width="18" height="12" rx="2" fill="#4a3f6b"/><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4h15A1.5 1.5 0 0 1 21 5.5V9H3z" fill="#f2c230"/><path d="M6.4 4l-2 5H7l2-5zM11.6 4l-2 5h2.6l2-5zM16.8 4l-2 5h2.6l2-5z" fill="#2d2740"/><path d="M10.2 12.2v5.2l4.8-2.6z" fill="#ffffff"/>',
  '<rect x="9.3" y="2.8" width="5.4" height="3.4" rx="1" fill="#5d6f86"/><path d="M5.5 8.4h13l-1 11.2a2 2 0 0 1-2 1.9H8.5a2 2 0 0 1-2-1.9z" fill="url(#g-can)"/><rect x="3.5" y="5.2" width="17" height="2.8" rx="1.4" fill="#5d6f86"/><rect x="9" y="11" width="1.5" height="7" rx=".75" fill="#5d6f86"/><rect x="13.5" y="11" width="1.5" height="7" rx=".75" fill="#5d6f86"/>',
  '<rect x="8.6" y="2.5" width="6.8" height="7" rx=".8" fill="#c3cbd6"/><rect x="10" y="4.6" width="1.4" height="1.9" fill="#6b7689"/><rect x="12.6" y="4.6" width="1.4" height="1.9" fill="#6b7689"/><rect x="7" y="8.8" width="10" height="12.7" rx="2.2" fill="url(#g-usb)"/><circle cx="12" cy="17.6" r="1.1" fill="#d6fffb"/>'
];

const actions = [
  ['<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>', '<path d="M12 11v5M9.5 13.5h5"/>', "#1f9d55"],
  ['<path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>', '<rect x="8" y="8" width="13" height="13" rx="2"/>', "#2f7de1"],
  ['<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>', '<path d="m15 5 4 4"/>', "#d98a00"],
  ['<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>', '<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>', "#d4402f"],
  ['<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>', '<path d="M21 3v5h-5"/><path d="M8 16H3v5"/>', "#2f7de1"]
];

const svg = (inner, cls) => `<svg viewBox="0 0 24 24" aria-hidden="true"${cls ? ` class="${cls}"` : ""}>${inner}</svg>`;

const styles = [
  { title: "現在：單色線條", note: "目前每個視窗的樣子。",
    icon: i => svg(line[i], "line"),
    act: a => svg(a[0] + a[1], "line") },
  { title: "方向一：線條加色塊", note: "保留線條，裡面填上各自的顏色。改動最小。",
    icon: i => svg(`<g stroke="none">${tint[i]}</g>` + line[i], "line"),
    act: a => svg(a[0] + `<g stroke="${a[2]}">${a[1]}</g>`, "line") },
  { title: "方向二：彩色實心圖案", note: "不用外框線，每個圖示有自己的形狀、顏色和明暗。",
    icon: i => svg(color[i]),
    act: a => svg(a[0] + `<g stroke="${a[2]}">${a[1]}</g>`, "line") }
];

document.getElementById("cols").innerHTML = styles.map(s => `
  <section>
    <h2>${s.title}</h2>
    <p class="note">${s.note}</p>
    <div class="bar">${actions.map(a => `<span>${s.act(a)}</span>`).join("")}</div>
    ${names.map((n, i) => `<div class="row${i === 2 ? " sel" : ""}">${s.icon(i)}<span>${n}</span></div>`).join("")}
    <div class="big">${names.map((n, i) => s.icon(i)).join("")}</div>
  </section>`).join("");

const root = document.documentElement;
if (location.hash === "#dark") root.dataset.theme = "dark";
document.getElementById("theme").addEventListener("click", () => {
  const dark = root.dataset.theme
    ? root.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
});
</script>
</body>
</html>
