<meta charset="utf-8">

<title>Better OS icon set</title>
<style>
  :root { --window: #f3f3f3; --card: #fbfbfb; --text: #1a1a1a; --text-2: #5c5c5c; --stroke: rgba(0,0,0,.08); }
  :root[data-theme="dark"] { --window: #202020; --card: #2b2b2b; --text: #ffffff; --text-2: #cccccc; --stroke: rgba(255,255,255,.08); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; background: var(--window); color: var(--text);
    font: 14px/20px system-ui, "Noto Sans CJK TC", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  h1 { font-size: 20px; line-height: 28px; font-weight: 600; margin: 0; flex: 1; }
  h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  h2 span { color: var(--text-2); font-weight: 400; }
  p { margin: 0 0 12px; color: var(--text-2); }
  button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--stroke);
    border-radius: 4px; height: 32px; padding: 0 12px; cursor: pointer; }
  section { margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
  figure { margin: 0; padding: 10px 8px 8px; border-radius: 4px; background: var(--window);
    border: 1px solid var(--stroke); }
  .sizes { display: flex; align-items: center; gap: 12px; height: 40px; }
  .sizes img { display: block; flex: none; }
  figcaption { margin-top: 6px; font-size: 12px; line-height: 16px; color: var(--text-2); overflow-wrap: anywhere; }
</style>
</head>
